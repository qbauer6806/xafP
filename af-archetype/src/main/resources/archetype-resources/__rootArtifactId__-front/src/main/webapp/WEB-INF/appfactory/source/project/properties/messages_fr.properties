ts.pageDemarrer.contenuHtml = '<p>La présente démarche en ligne vous permet de faire une demande de dérogation relative aux jours fériés légaux.</p><p></p><p>Le principe et les conditions de la démarche sont décrits dans la <a title="Ouvrir la fiche démarche dans une nouvelle fenêtre" data-ng-href="{{properties[&${symbol_pound}39;mc.gouv.appfactory.gen.front.ficheDemarcheUrl.fr&${symbol_pound}39;]}}" class="ext_link" target="_blank">fiche démarche</a> de l${symbol_escape}u2019Espace Entreprises du Service Public.</p><p></p><p>Avant de démarrer, assurez-vous d${symbol_escape}u2019avoir à votre disposition toutes les pièces à joindre dans l${symbol_escape}u2019un des formats suivants : .doc, .docx, .rtf, .pdf, .jpg, .png et .tif.</p><p></p><p>Sachez que l${symbol_escape}u2019utilisation de cette démarche en ligne nécessite de disposer d${symbol_escape}u2019un compte personnel que vous devrez créer si vous n${symbol_escape}u2019en possédez pas déjà un.</p><p></p><p>Veuillez également vous munir de la pièce justificative suivante :</p><ul><li>L''avis des délégués du personnel, si l${symbol_escape}u2019effectif de votre entreprise en justifie la présence;</li><li>L${symbol_escape}ufeff''avis du personnel concerné, si l${symbol_escape}u2019effectif de votre entreprise ne justifie pas la présence de délégués du personnel.</li></ul><p></p><p>Les étapes sont les suivantes :</p><ol><li>Informations concernant l${symbol_escape}u2019entreprise</li><li>Informations concernant la demande de dérogation</li><li>Pièce(s) justificative(s)</li><li>Récapitulatif</li></ol><p>Dans le cadre de cette démarche, vous avez également la possibilité de répondre anonymement à un sondage.</p>'
