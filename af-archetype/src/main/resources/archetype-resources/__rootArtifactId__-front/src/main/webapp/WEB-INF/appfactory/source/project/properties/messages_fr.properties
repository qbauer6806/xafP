ts.pageAide.introHtml = '<h4>Que faire si je ne reçois pas d${symbol_escape}u2019accusé de réception ?</h4><pre>Lors de la déclaration, un accusé de réception vous est transmis par courriel à l${symbol_escape}u2019adresse e-mail du compte avec lequel vous vous êtes connecté(e).${symbol_escape}nIl convient de vérifier que ce courriel n${symbol_escape}u2019apparaît pas dans le courrier indésirable de votre messagerie.${symbol_escape}nA défaut, veuillez contacter le Service de l${symbol_escape}u2019Inspection du Travail.</pre><h4>Que faire si je rencontre des problèmes d${symbol_escape}u2019affichage ?</h4><pre>L${symbol_escape}u2019utilisation du téléservice requiert une connexion et un navigateur Internet. Le navigateur doit être configuré pour autoriser les « cookies » de session. Il doit également être configuré afin d${symbol_escape}u2019autoriser l${symbol_escape}u2019ouverture des fenêtres pour le site "teleservice.gouv.mc". Le site est optimisé pour un affichage en 1024x768 pixels. Afin de garantir un bon fonctionnement du traitement, il est conseillé d${symbol_escape}u2019utiliser les versions de navigateurs suivantes :</pre><ul><li>Chrome</li><li>Internet Explorer</li></ul><pre>Les autres navigateurs usuels (Safari, Firefox, Edge...) sont réputés compatibles avec le téléservice, mais l${symbol_escape}u2019Administration ne peut garantir un rendu optimal.</pre><h4>Comment obtenir des informations sur la démarche&nbsp;?</h4><pre>Vous pouvez consulter la <a title="Ouvrir la fiche démarche dans une nouvelle fenêtre" data-ng-href="{{properties[&${symbol_pound}39;mc.gouv.appfactory.gen.front.ficheDemarcheUrl.fr&${symbol_pound}39;]}}" class="ext_link" target="_blank">fiche démarche</a> de l${symbol_escape}u2019Espace Particuliers du Service Public.</pre>'
