ts.pageCgu.introHtml = '<p><strong>Introduction</strong></p><p></p><p>Le présent document fixe les conditions générales d${symbol_escape}u2019utilisation du téléservice permettant de demander une dérogation relative aux jours fériés légaux. Les conditions générales d${symbol_escape}u2019utilisation sont consultables depuis la page https://teleservice.gouv.mc/${tsFrontUrl}/legalterms.html</p><p></p><p>L${symbol_escape}u2019utilisation de ce téléservice implique l${symbol_escape}u2019acceptation sans réserve des présentes conditions générales d${symbol_escape}u2019utilisation.</p><p></p><p>Le Service de l${symbol_escape}u2019Inspection du Travail se réserve le droit de modifier les présentes conditions générales d${symbol_escape}u2019utilisation à tout moment et sans préavis. Les usagers sont invités à s${symbol_escape}u2019y reporter régulièrement. Les présentes conditions constituent la totalité des accords, pour ce téléservice, entre le Gouvernement Princier et l${symbol_escape}u2019usager.</p><p></p><p>Toute modification ou contenu supplémentaire intégré à ce téléservice sera soumis aux présentes conditions.</p><p></p><p><strong>Définition et objet du téléservice</strong></p><p></p><p>1.&nbsp;&nbsp;Ce téléservice mis en ${symbol_escape}u0153uvre par la direction du Travail, contribue à simplifier les démarches des usagers afin de demander une dérogation relative aux jours fériés légaux.</p><p></p><p>2.&nbsp;&nbsp;Conformément aux dispositions de l${symbol_escape}u2019article 43 de l${symbol_escape}u2019Ordonnance Souveraine n° 3.413 du 29 août 2011 portant diverses mesures relatives à la relation entre l${symbol_escape}u2019Administration et l${symbol_escape}u2019administré, la création de ce téléservice n${symbol_escape}u2019a pas pour effet de supprimer la possibilité pour l${symbol_escape}u2019usager d${symbol_escape}u2019accomplir la démarche par voie postale ou en se déplaçant au Service de l${symbol_escape}u2019Inspection du Travail.</p><p></p><p>3.&nbsp;&nbsp;Ce téléservice permet également aux usagers:</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o &nbsp;de contacter par courrier électronique le Service de l${symbol_escape}u2019Inspection du Travail</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;de répondre anonymement, s${symbol_escape}u2019ils le souhaitent, à un sondage sur l${symbol_escape}u2019utilisation du téléservice</p><p></p><p><strong>Propriété du téléservice</strong></p><p></p><p>4.&nbsp;&nbsp;Ce téléservice est la propriété exclusive du Gouvernement Princier (Service de l${symbol_escape}u2019Inspection du Travail).</p><p></p><p><strong>Siège</strong></p><p>Service de l${symbol_escape}u2019Inspection du Travail </p><p>La Frégate</p><p>2, rue Princesse Antoinette</p><p>98000 Monaco </p><p>inspectiondutravail@gouv.mc</p><p></p><p>Téléphone : (+377) 98 98 87 26</p><p></p><p><strong>Hébergement</strong></p><p>Direction des Réseaux et Systèmes d${symbol_escape}u2019Information</p><p>23, Avenue Albert II</p><p>BP 699</p><p>98014 MONACO CEDEX</p><p></p><p><strong>Accès au téléservice et compte personnel</strong></p><p></p><p>5.&nbsp;&nbsp;L${symbol_escape}u2019utilisation de ce téléservice est facultative. A l${symbol_escape}u2019exception du coût éventuel de connexion, l${symbol_escape}u2019accès au contenu de ce téléservice est gratuit. Il est convenu que tout accès au téléservice s${symbol_escape}u2019effectue sur une base gratuite ou forfaitaire (Câble, ADSL, etc.) et ne pourra donner lieu à aucun remboursement.</p><p></p><p>6.&nbsp;&nbsp;L${symbol_escape}u2019utilisation dudit téléservice se fait suite à l${symbol_escape}u2019authentification de l${symbol_escape}u2019usager via un compte personnel, à créer s${symbol_escape}u2019il n${symbol_escape}u2019en dispose d${symbol_escape}u2019aucun ou s${symbol_escape}u2019il ne souhaite pas utiliser un compte existant.</p><p></p><p>7.&nbsp;&nbsp;Le Service de l${symbol_escape}u2019Inspection du Travail se réserve le droit, à tout moment, de modifier et/ou d${symbol_escape}u2019interrompre temporairement ou définitivement tout ou partie de ce téléservice, et ce sans avoir à en informer préalablement l${symbol_escape}u2019usager. Aucune responsabilité de ce fait n${symbol_escape}u2019est encourue par ledit Service.</p><p></p><p>8.&nbsp;&nbsp;Le Service de l${symbol_escape}u2019Inspection du Travail se réserve le droit de radier, sans préavis ni indemnité d${symbol_escape}u2019aucune sorte, tout accès au téléservice faisant l${symbol_escape}u2019objet d${symbol_escape}u2019une utilisation illicite ou d${symbol_escape}u2019acte portant atteinte aux droits de la Personne et plus généralement aux intérêts de tiers.</p><p></p><p><strong>Compte personnel</strong></p><p>9.&nbsp;&nbsp;Lors de la création du compte personnel, l${symbol_escape}u2019usager choisit un identifiant et un mot de passe qui lui permettront de s${symbol_escape}u2019authentifier.</p><p>L${symbol_escape}u2019usager doit conserver son identifiant et son mot de passe qui lui seront utiles pour tout accès à son compte personnel ou au(x) téléservice(s) qui l${symbol_escape}u2019utilise(nt).</p><p></p><p>10. Le mot de passe doit être choisi par l${symbol_escape}u2019usager de façon à ce qu${symbol_escape}u2019il ne puisse pas être deviné par un tiers et offrir un niveau de sécurité conforme aux règles en vigueur. Ces règles sont consultables depuis les écrans de choix de mot de passe.&nbsp;L${symbol_escape}u2019usager s${symbol_escape}u2019engage à en préserver la confidentialité.</p><p></p><p>11. La création du compte personnel implique la saisie par l${symbol_escape}u2019usager d${symbol_escape}u2019un certain nombre d${symbol_escape}u2019informations, tels que son titre, son nom, son prénom, son adresse postale et son adresse e-mail.</p><p></p><p>12. L${symbol_escape}u2019usager s${symbol_escape}u2019engage à avertir immédiatement la Direction de l${symbol_escape}u2019Administration Numérique (ci-après dénommée DAN), en sa qualité d${symbol_escape}u2019administrateur du compte personnel, de toute utilisation non autorisée de ces informations ; la DAN ne saurait être tenue pour responsable des dommages éventuellement causés par l${symbol_escape}u2019utilisation de l${symbol_escape}u2019identifiant et du mot de passe par un tiers non autorisé.</p><p></p><p>13. L${symbol_escape}u2019usager devra fournir une adresse e-mail valide lors de la création de son compte. Cette adresse est nécessaire et utilisée pour la confirmation des opérations réalisées par l${symbol_escape}u2019usager.</p><p></p><p>14. La DAN se réserve le droit de radier, sans préavis ni indemnité d${symbol_escape}u2019aucune sorte, tout compte faisant l${symbol_escape}u2019objet d${symbol_escape}u2019une utilisation illicite ou d${symbol_escape}u2019acte portant atteinte aux droits de la Personne et plus généralement aux intérêts de tiers.</p><p></p><p><strong>Accès au téléservice</strong></p><p>15. En acceptant les conditions générales d${symbol_escape}u2019utilisation, l${symbol_escape}u2019usager accepte de fait que les informations de son compte ${symbol_escape}u2013 exemples: Nom, Prénom, Adresse e-mail - soient utilisées dans le cadre du présent téléservice.</p><p></p><p>16. L${symbol_escape}u2019usager s${symbol_escape}u2019engage à avertir immédiatement Le Service de l${symbol_escape}u2019Inspection du Travail de toute utilisation non autorisée de ces informations ; Le Service de l${symbol_escape}u2019Inspection du Travail ne saurait être tenue pour responsable des dommages éventuellement causés par l${symbol_escape}u2019utilisation de l${symbol_escape}u2019identifiant et du mot de passe et par un tiers non autorisé.</p><p></p><p><strong>Contraintes techniques</strong></p><p>17. L${symbol_escape}u2019utilisation du service requiert une connexion et un navigateur Internet. Le navigateur doit être configuré pour autoriser les « cookies » de session. Il doit également être configuré afin dautoriser louverture de fenêtres pour le site "teleservice.gouv.mc". Le site est optimisé pour un affichage en 1024x768 pixels. Afin de garantir un bon fonctionnement du Service, il est conseillé d${symbol_escape}u2019utiliser les versions récentes de navigateurs suivants :</p><p>o&nbsp;&nbsp;&nbsp;Chrome </p><p>o&nbsp;&nbsp;&nbsp;Internet Explorer </p><p>Les autres navigateurs usuels (Safari, Firefox, Edge${symbol_escape}u2026) sont réputés compatibles avec le téléservice, mais l${symbol_escape}u2019Administration ne peut garantir un rendu optimal.</p><p><strong>Conservation des données</strong></p><p></p><p><strong>Compte personnel</strong></p><p>18. Un compte personnel qui n${symbol_escape}u2019est pas utilisé pendant plus de 12 mois entre dans un processus automatique de désinscription. L${symbol_escape}u2019usager peut également se désinscrire en ligne à tout moment. Dans les deux cas, un courrier électronique prévient l${symbol_escape}u2019usager de sa désinscription.</p><p>Ce processus de désinscription permet d${symbol_escape}u2019effacer définitivement toutes les données personnelles de l${symbol_escape}u2019usager dans un délai de 10 jours. </p><p></p><p><strong>Données du téléservice</strong></p><p>19. Un téléservice qui n${symbol_escape}u2019est pas utilisé pendant plus de 48 mois entre dans un processus automatique de désinscription. L${symbol_escape}u2019usager peut également se désinscrire de ce téléservice en ligne à tout moment. Dans les deux cas, un courrier électronique prévient l${symbol_escape}u2019usager de sa désinscription du téléservice.</p><p>Ce processus de désinscription du téléservice permet d${symbol_escape}u2019effacer définitivement toutes les données personnelles de l${symbol_escape}u2019usager liées à ce téléservice dans un délai de 10 jours.</p><p></p><p><strong>Données de connexion</strong></p><p>20. Certaines données de connexion sont conservées aux fins de protection contre les intrusions et de poursuites judiciaires le cas échéant. Ces données sont conservées pendant trois mois.</p><p></p><p><strong>Engagement concernant l${symbol_escape}u2019utilisation du téléservice et de son contenu</strong></p><p></p><p>21. L${symbol_escape}u2019usager s${symbol_escape}u2019engage à ne pas commettre, sur ce téléservice, d${symbol_escape}u2019acte illicite ou portant atteinte aux droits de la Personne et plus généralement aux intérêts de tiers.</p><p>Est prohibé par les présentes conditions générales d${symbol_escape}u2019utilisation, tout acte pouvant contribuer à ternir le nom et/ou l${symbol_escape}u2019image de l${symbol_escape}u2019État de Monaco, ou pouvant endommager, surcharger, mettre hors d${symbol_escape}u2019état, discréditer ou mettre en échec le téléservice.</p><p>Est notamment prohibé : la transmission, par courrier électronique ou par tout autre moyen, des contenus servant à des fins de persécution, harcèlement, diffamation, discrimination, insultes, ou toute autre diffusion d${symbol_escape}u2019information ou d${symbol_escape}u2019opinion à caractère personnel sur un ou plusieurs individus ou portant atteinte aux droits de la personne ou aux usagers mineurs. </p><p></p><p>22. Les correspondances doivent avoir en toute circonstance un caractère courtois et doivent obéir aux règles élémentaires de la politesse.</p><p></p><p><strong>Responsabilité</strong></p><p></p><p>23. Le Service de l${symbol_escape}u2019Inspection du Travail ne donne aucune garantie, implicite ou explicite, concernant le fonctionnement et/ou le contenu du téléservice.</p><p></p><p>24. Le Service de l${symbol_escape}u2019Inspection du Travail se réserve la liberté de faire évoluer, de modifier ou de suspendre, sans préavis, le téléservice pour des raisons de maintenance ou pour tout autre motif jugé nécessaire. L${symbol_escape}u2019indisponibilité de la démarche ne donne droit à aucune indemnité.</p><p></p><p>25. Le Service de l${symbol_escape}u2019Inspection du Travail ne sera pas tenu responsable des dommages, directs ou indirects, commerciaux ou non, résultant de l${symbol_escape}u2019utilisation du téléservice.</p><p></p><p>26. Le Service de l${symbol_escape}u2019Inspection du Travail ne garantit pas la continuité, l${symbol_escape}u2019accès et la disponibilité du fonctionnement du téléservice et des services afférents. </p><p></p><p>27. Le Service de l${symbol_escape}u2019Inspection du Travail décline toute responsabilité relative aux virus qui pourraient être importés lors du téléchargement de l${symbol_escape}u2019un des éléments du téléservice ou des sites auxquels ledit Service renvoie par le biais de liens hypertextes.</p><p></p><p>28. Les termes des présentes conditions générales d${symbol_escape}u2019utilisation peuvent également être amendés à tout moment, sans préavis, en fonction des modifications opérées par le Service de l${symbol_escape}u2019Inspection du Travail, de l${symbol_escape}u2019évolution de la législation ou de tout autre motif jugé nécessaire. Il appartient à l${symbol_escape}u2019usager de s${symbol_escape}u2019informer desdites conditions. Conformément à l${symbol_escape}u2019article 46 alinéa 2 de l${symbol_escape}u2019Ordonnance Souveraine n° 3.413 du 29 août 2011 portant diverses mesures relatives à la relation entre l${symbol_escape}u2019Administration et l${symbol_escape}u2019administré, les modalités d${symbol_escape}u2019utilisation du téléservice opposables à l${symbol_escape}u2019usager sont celles qui sont accessibles par voie électronique au jour où l${symbol_escape}u2019usager utilise ledit téléservice.</p><p></p><p><strong>Protection des données personnelles</strong></p><p></p><p>29. Conformément aux dispositions de l${symbol_escape}u2019article 14 de la loi n° 1.165 du 23 décembre 1993 relative à la protection des informations nominatives, la collecte des éléments nominatifs respecte les principes suivants :</p><p></p><p><strong>Finalité du traitement</strong></p><p>30. Dans le cadre du téléservice permettant de demander une dérogation relative aux jours fériés légaux, le Service de l${symbol_escape}u2019Inspection du Travail traite des informations nominatives afin de :</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o &nbsp;Traiter les demandes de dérogation relative aux jours fériés légaux</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o &nbsp;Permettre le traitement des demandes des usagers</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;Permettre la fluidité de la connexion et de la navigation</p><p></p><p><strong>Caractère obligatoire des informations demandées ou collectées</strong></p><p>31. Les informations nominatives collectées au travers de ce téléservice sont nécessaires, d${symbol_escape}u2019une part pour procéder au traitement, et d${symbol_escape}u2019autre part pour pouvoir répondre à toute demande ou toute question en cas de demande de l${symbol_escape}u2019usager.</p><p></p><p><strong>Identité des destinataires</strong></p><p>32. Le Service de l${symbol_escape}u2019Inspection du Travail s${symbol_escape}u2019engage à n${symbol_escape}u2019opérer aucune commercialisation des informations transmises par l${symbol_escape}u2019usager au moyen du téléservice, ainsi qu${symbol_escape}u2019à ne pas les communiquer à des tiers, à l${symbol_escape}u2019exclusion des cas prévus par la loi.</p><p></p><p><strong>Droits d${symbol_escape}u2019accès et de rectification</strong></p><p>33. Conformément à l${symbol_escape}u2019article 14 de la loi n° 1.165 du 23 décembre 1993 relative à la protection des informations nominatives, les personnes concernées par ces traitements disposent d${symbol_escape}u2019un droit d${symbol_escape}u2019accès aux informations nominatives les concernant, ainsi que le droit de demander à ce que soient rectifiées, mises à jour ou supprimées les données inexactes, incomplètes ou périmées.</p><p></p><p>34. Ces droits peuvent être exercés auprès de&nbsp;:</p><p>Service de l${symbol_escape}u2019Inspection du Travail </p><p>La Frégate</p><p>2, rue Princesse Antoinette</p><p>98000 Monaco </p><p>inspectiondutravail@gouv.mc</p><p></p><p>Téléphone : (+377) 98 98 87 26</p><p>&nbsp;</p><p></p><p><strong>Sécurité des traitements</strong></p><p>35. L${symbol_escape}u2019État de Monaco prend les mesures physiques, techniques et organisationnelles appropriées pour assurer la sécurité et la confidentialité des données à caractère personnel, en vue notamment de les protéger contre toute perte, destruction accidentelle, altération, et accès non autorisés.</p><p></p><p><strong>Avis favorable de la Commission de Contrôle des Informations Nominatives</strong></p><p>36. Le téléservice permettant de faire une déclaration concernant le travail pour les jours fériés est en cours d${symbol_escape}u2019examen par la Commission de Contrôle des Informations Nominatives.</p><p></p><p><strong>Droits d${symbol_escape}u2019auteur</strong></p><p></p><p>37. Tous les contenus ${symbol_escape}u2013 qu${symbol_escape}u2019il s${symbol_escape}u2019agisse de textes, commentaires, titres, photographies, sons, images, données, dessins, séquences animées sonores, vidéos${symbol_escape}u2026 ${symbol_escape}u2013 reproduits sur ce téléservice, ainsi que la conception, la forme et les logiciels sont la propriété de l${symbol_escape}u2019État de Monaco et sont protégés par les textes en vigueur sur le droit d${symbol_escape}u2019auteur et plus généralement sur les droits incorporels, notamment les dispositions de la loi n° 491 du 24 novembre 1948 sur la protection des ${symbol_escape}u0153uvres littéraires et artistiques.</p><p></p><p>38. Seule la copie électronique à usage privé de tout ou partie du téléservice ou des éléments le composant est autorisée par le Service de l${symbol_escape}u2019Inspection du Travail, sous réserve de ne pas en modifier l${symbol_escape}u2019original. </p><p></p><p>39. Le Service de l${symbol_escape}u2019Inspection du Travail accorde aux usagers de son téléservice un droit d${symbol_escape}u2019usage personnel, ponctuel et non exclusif, de celui-ci. La reproduction, la copie ou l${symbol_escape}u2019exploitation dans un but autre que celui mentionné ci-dessus et notamment la modification, la diffusion ou l${symbol_escape}u2019utilisation dans un but commercial ou non, constitue une infraction pénalement sanctionnée par les Cours et Tribunaux monégasques en application des articles 21 à 28 de la loi n° 491 du 24 novembre 1948 sur la protection des ${symbol_escape}u0153uvres littéraires et artistiques et de l${symbol_escape}u2019article 26 du Code pénal.</p><p></p><p><strong>Marques</strong></p><p></p><p>40. Les marques et/ou logos dont est titulaire l${symbol_escape}u2019État de Monaco, apparaissant sur ce téléservice, sont des marques protégées par des dispositifs du droit de la propriété intellectuelle, en application de la loi n° 1.058 du 10 juin 1983 sur les marques de fabrique, de commerce ou de service. Toute reproduction, en tout ou partie, sans l${symbol_escape}u2019autorisation du titulaire constitue une infraction pénalement sanctionnée par les Cours et Tribunaux monégasques, en application de l${symbol_escape}u2019article 23 de la loi n° 1.058 du 10 juin 1983 sur les marques de fabrique, de commerce ou de service et de l${symbol_escape}u2019article 26 du Code pénal.</p><p></p><p><strong>Liens hypertextes</strong></p><p></p><p>41. La création de lien vers le téléservice est libre. Le Service de l${symbol_escape}u2019Inspection du Travail se réserve le droit d${symbol_escape}u2019interdire tout lien dont la finalité porterait atteinte au bon fonctionnement ou à l${symbol_escape}u2019image du Service ou de l${symbol_escape}u2019Administration. Le téléservice peut fournir à l${symbol_escape}u2019usager, ainsi qu${symbol_escape}u2019à des tiers, des liens vers d${symbol_escape}u2019autres sites ou d${symbol_escape}u2019autres sources Internet.</p><p></p><p>42. Le Service de l${symbol_escape}u2019Inspection du Travail ne contrôle pas ces sites et ne pourrait être tenu responsable, ni supporter aucune responsabilité quant au contenu, publicité, produit, service ou tout autre matériel disponible à partir de ces sites tiers.</p><p></p><p>43. Le Service de l${symbol_escape}u2019Inspection du Travail ne pourrait être tenu responsable de tous dommages ou pertes avérés ou allégués consécutifs ou en relation avec l${symbol_escape}u2019utilisation ou avec le fait d${symbol_escape}u2019avoir fait confiance au contenu des sites tiers ou aux biens et services disponibles sur ces sites tiers.</p><p></p><p>44. En application des articles 29 à 32 de la loi n° 1.383 du 02 août 2011 sur l${symbol_escape}u2019Économie Numérique, l${symbol_escape}u2019usager est responsable et supporte tous les risques afférents à l${symbol_escape}u2019utilisation qu${symbol_escape}u2019il fait du contenu du site, notamment lorsqu${symbol_escape}u2019il se fie à l${symbol_escape}u2019opportunité, l${symbol_escape}u2019utilité ou le caractère complet de ce contenu. Si un lien amenait l${symbol_escape}u2019usager à pointer vers des contenus illicites, en infraction avec la législation en vigueur, l${symbol_escape}u2019usager devrait alors interrompre sa consultation du site concerné.</p><p></p><p>45. Le Service de l${symbol_escape}u2019Inspection du Travail invite dans ce cas l${symbol_escape}u2019usager à l${symbol_escape}u2019informer immédiatement, ainsi que les autorités compétentes, du lien automatique vers un site illicite.</p><p></p><p><strong>Transmission des informations</strong></p><p></p><p>46. Tout changement de statut ou d${symbol_escape}u2019état de l${symbol_escape}u2019usager devra être communiqué et justifié par ce dernier auprès du Service de l${symbol_escape}u2019Inspection du Travail.</p><p></p><p><strong>Fausse déclaration</strong></p><p></p><p>47. L${symbol_escape}u2019usager déclare sur l${symbol_escape}u2019honneur connaître parfaitement les sanctions prévues à l${symbol_escape}u2019article 98 du Code pénal monégasque en cas de fausse déclaration, soit une peine d${symbol_escape}u2019emprisonnement de 3 mois à 1 an et l${symbol_escape}u2019amende prévue au chiffre 2 de l${symbol_escape}u2019article 26 ou l${symbol_escape}u2019une de ces deux peines seulement.</p><p></p><p><strong>Textes officiels</strong></p><p></p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o &nbsp;Article 98 du Code Pénal monégasque</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;Loi n° 1.383 du 02 août 2011 sur l${symbol_escape}u2019Économie Numérique</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;Loi n° 1.058 du 10 juin 1983 sur les marques de fabrique, de commerce ou de service</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;Loi n° 1.165 du 23 décembre 1993 relative à la protection des informations nominatives</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o &nbsp;Loi n° 491 du 24 novembre 1948 sur la protection des ${symbol_escape}u0153uvres littéraires et artistiques</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;Ordonnance Souveraine n° 3.413 du 29 août 2011 portant diverses mesures relatives à la</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;relation entre l${symbol_escape}u2019Administration et l${symbol_escape}u2019administré</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;Ordonnance Souveraine n° 7.011 du 20 juillet 2018 portant création de la Direction de l${symbol_escape}u2019Administration Numérique parue au Journal De Monaco le 20 juillet 2018. </p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o &nbsp;Ordonnance Souveraine n° 7.012 du 20 juillet 2018 portant création de la Direction des Réseaux et Systèmes d${symbol_escape}u2019Information.</p><p></p>'
