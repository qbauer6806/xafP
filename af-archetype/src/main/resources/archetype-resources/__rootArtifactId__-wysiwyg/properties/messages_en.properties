ts.pageAide.introHtml = '<h4>What should I do if I do not receive confirmation of receipt?</h4><pre>Following the declaration, confirmation of receipt will be sent to you electronically using the e-mail address of the account with which you are connected.${symbol_escape}nYou should check to see whether the e-mail appears in the spam section of your In Box.${symbol_escape}n Otherwise, please contact Direction de l''Environnement.</pre><h4>What should I do if I encounter problems displaying pages?</h4><p>An Internet connection and browser are required to use this online service. The browser must be configured to allow session cookies and pop-up windows. The site is optimised for viewing with a screen resolution of 1024x768 pixels. To ensure that the application works properly, the following browser versions are recommended:</p><ul><li>Last vesrsion of Chrome</li><li>Last vesrsion of Firefox</li><li>Last vesrsion of Internet Explorer</li></ul><h4>How can I obtain information on this process?</h4><p>You can consult <a title="Open the procedure in a new window" data-ng-href="{{properties[&${symbol_pound}39;mc.gouv.appfactory.gen.front.ficheDemarcheUrl.en&${symbol_pound}39;]}}" class="ext_link" target="_blank">the procedure</a> on the Individuals section of the Public Services web pages.</p><p></p>'
