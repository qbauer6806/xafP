ts.pageDemarrer.contenuHtml = '<p>This online service allows you to make a declaration regarding the request to obtain a a subsidy for buying a clean energy vehicle.</p><p>The principle and conditions of the online service are described in the <a title="Open the procedure in a new window" data-ng-href="{{properties[&${symbol_pound}39;mc.gouv.appfactory.gen.front.ficheDemarcheUrl.en&${symbol_pound}39;]}}" class="ext_link" target="_blank">procedure</a> on the Individuals section of the Public Services web pages.</p><p>A subsidy may be granted for the purchase of a clean or low-emission vehicle:</p><ul><li>Be new, with the exception of vehicles previously registered as demonstration vehicles for less than a year by a dealer. Proof must be provided</li><li>Be registered in Monaco&nbsp;(or owned by a Monegasque resident, as concerns bicycles with a maximum power of 250 W)</li></ul><p></p><p>Before you begin, make sure that you have at hand all of the documents you will need to attach in one of the following format: .doc, .docx, .rtf, .pdf, .jpg, .png and .tif.</p><p>Make sure that you have:</p><ul><li>A copy of the vehicle registration certificate</li><li>A copy of the invoice for the vehicle</li><li>Your full bank accounts details (RIB)</li><li>For electric vehicles, proof of the insured value of the battery or, where appropriate, a copy of the lease agreement and payment schedule</li><li>In the case of a long-term lease, for all vehicles, a copy of the lease agreement and payment schedule for the vehicle, and for the battery if the vehicle is electric</li><li>For unregistered bicycles (with a maximum power of 250W), proof of residency in Monaco (a copy of your residence permit, Monegasque identity card or, for companies, an extract from the RCI)</li></ul><p></p><p>Finally, a personal account is required to use this online service, so you will need to create one if you do not already have one.</p><p></p><p>The steps in the online service are as follows:</p><ol><li>Information about the user</li><li>Bank details</li><li>Information about the vehicle</li><li>Simulation</li><li>Information about collating the documents</li><li>Summary</li></ol><p></p><p>As part of this online service, you will also be offered the opportunity to take part in an anonymous survey.</p><p></p>'
