ts.pageCgu.introHtml = '<pre><strong>Introduction</strong>${symbol_escape}n<strong>&nbsp;</strong>${symbol_escape}nThis document sets out the general terms of use of the online service for requesting a subsidy for the purchase of a clean energy vehicle. The general terms of use are available for consultation from the following page: https://teleservice.gouv.mc/subvention-vehicule-ecologique/legalterms.html${symbol_escape}n${symbol_escape}nAccess to this online service implies that the user has accepted these general terms of use without reservation.${symbol_escape}n${symbol_escape}n${symbol_escape}nThe Department of the Environment reserves the right to amend these general terms of use at any time and without notice. Users are invited to consult these terms on a regular basis. These terms constitute the full set of agreements between the Princes Government and the user for this online service. ${symbol_escape}n${symbol_escape}n${symbol_escape}nAny change or additional content introduced to the personal account will be subject to these terms.${symbol_escape}n${symbol_escape}n${symbol_escape}n<strong>Definition and purpose of the online service</strong>${symbol_escape}n<strong>&nbsp;</strong>${symbol_escape}n1.&nbsp;This online service, which is implemented by the Department of the Environment, helps to simplify procedures for users who are requesting a subsidy from the aforesaid Department for the purchase of a clean energy vehicle.${symbol_escape}n${symbol_escape}n2. In accordance with Article 46,&nbsp;of the ${symbol_escape}nSovereign Ordinance no. 3.413 of 29 August 2011 concerning various measures pertaining to the relationship between the Government and its subjects, the introduction of this online service does not in any way replace the option for the user to make a request by post or by visiting the Department of the Environment in person${symbol_escape}n${symbol_escape}n3. This online service also enables users:${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;To contact the Department of the Environment by email${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;To reply anonymously, if so wished, to a survey on using this online service${symbol_escape}n${symbol_escape}n${symbol_escape}n<strong>Ownership of the online service</strong>${symbol_escape}n${symbol_escape}n4. This online service is the exclusive property of the State of Monaco (Department of the Environment)${symbol_escape}n${symbol_escape}n<strong>Headquarter</strong>${symbol_escape}nDirection de l${symbol_escape}u2019Environnement (Department of the Environment)${symbol_escape}n3, Avenue de Fontvieille ${symbol_escape}nMC 98013 MONACO${symbol_escape}nenvironnement@gouv.mc${symbol_escape}n${symbol_escape}nPhone: (+377) 98 98 83 41${symbol_escape}n${symbol_escape}n<strong>Hosting</strong>${symbol_escape}nNetwork and Information Technologies Department${symbol_escape}n23, Avenue Albert II${symbol_escape}nBP 699${symbol_escape}nMC 98014 MONACO CEDEX${symbol_escape}n${symbol_escape}n<strong>Access to online service and personal account </strong>${symbol_escape}n${symbol_escape}n5. The use of this online service is optional. With the exception of any connection costs incurred, access to the content of this application is free. It is agreed that all access to the application is made available on a free or all-inclusive basis (Cable, ADSL, etc.) and therefore no refunds can be offered.${symbol_escape}n${symbol_escape}n6. Use of the aforesaid online service shall be made following the authentication of the user via a personal account, which must be created if the user has no such account or if the user does not wish to use an existing account.${symbol_escape}n${symbol_escape}n7. The Department of the Environment reserves the right, at any time, to change, and/or to temporarily or permanently suspend all or part of this online service, without notifying users in advance. The Department of the Environment incurs no liability as a result of such action.${symbol_escape}n${symbol_escape}n8. The Department of the Environment reserves the right to remove, without warning or compensation of any kind, any access to the online service which constitutes unlawful use or an act which infringes human rights or more generally causes prejudice to the interests of third parties${symbol_escape}n${symbol_escape}n<strong>Personal account</strong>${symbol_escape}n9. During the account creation process, the user selects a user name and a password which will enable them to authenticate their identity.${symbol_escape}nThe user must retain their user name and password, which they will use to gain access to their personal account or to the online service(s) which use it.${symbol_escape}n${symbol_escape}n10. The password must be selected by the user in such a way that it cannot be guessed by a third party. The user undertakes to keep their password secret.${symbol_escape}nThe password must be made up of between 8 and 20 characters, excluding special characters, and including at least one letter and one number.${symbol_escape}n11. The creation of a personal account requires the user to enter certain information, including their title, name, first name, postal adress and email adress${symbol_escape}n${symbol_escape}n${symbol_escape}n12. The user undertakes to advise the Digital Government Department hereinafter referred to as DAN, as the administrator of the personal account, of any unlawful use of this information immediately; the DAN cannot be held responsible for any damage which may be caused by the use of the user name and password by an unlawful third party.${symbol_escape}n${symbol_escape}n13. The user must provide a valid email address when creating an account. This address is required and is used to confirm operations carried out by the user.${symbol_escape}n${symbol_escape}n14. The DAN reserves the right to remove, without warning or compensation of any kind, any account which constitutes unlawful or fraudulent use or act which infringes human rights or more generally causes prejudice to the interests of third parties${symbol_escape}n${symbol_escape}n<strong>Access to online service </strong>${symbol_escape}n15. By accepting the General Terms of Use, the user agrees that the information given in his or her account ${symbol_escape}u2013 title, last name, first name, postal address and e-mail address - may be used in connection with this online service.${symbol_escape}n${symbol_escape}n16. The user undertakes to advise the The Department of the Environment, of any unlawful use of this information immediately; the The Department of the Environment cannot be held responsible for any damage which may be caused by the use of the user name and password by an unlawful third party.${symbol_escape}n${symbol_escape}n<strong>Technical constraints</strong>${symbol_escape}n17. Use of the service requires an Internet connection and browser. The browser must be configured to allow session cookies and pop-up${symbol_escape}nThe site is optimised for viewing with a screen resolution of 1024x768 pixels.${symbol_escape}n&nbsp;To ensure that the application works properly, use of the following browser versions is recommended:${symbol_escape}n&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;Last vesrsion of Chrome${symbol_escape}n&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;Last vesrsion of Firefox${symbol_escape}n&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;Last vesrsion of Internet Explorer${symbol_escape}n${symbol_escape}n<strong>Data retention</strong>${symbol_escape}n${symbol_escape}n<strong>Personal account</strong>${symbol_escape}n18. Personal accounts which have not been used for more than 12 months will be automatically deleted. Users can also delete their accounts online at any time. In both cases, an email will warn the user that their account is being deleted. ${symbol_escape}nThe account deletion process allows all of a user${symbol_escape}u2019s personal data to be completely erased within 10 days.${symbol_escape}n${symbol_escape}n<strong>Data used in this online service</strong>${symbol_escape}n19. An online service which have not been used for more than 48 months will be automatically deleted. Users can also delete this online service at any time. In both cases, an email will warn the user that their account is being deleted. ${symbol_escape}nThe account deletion process allows all of a user${symbol_escape}u2019s personal data to be completely erased within 10 days.${symbol_escape}n${symbol_escape}n<strong>Login data</strong>${symbol_escape}n20. Certain login data is retained in order to prevent intrusion, and for the purposes of legal proceedings should the need arise. This data is retained for three months.${symbol_escape}n${symbol_escape}n<strong>Undertaking regarding the use of the online service and its content</strong>${symbol_escape}n${symbol_escape}n21. The user undertakes not to commit, on this online service, any unlawful act or toinfringe human rights or more generally to cause prejudice to third party interests.${symbol_escape}n${symbol_escape}nThese general terms of use prohibit any act which could tarnish the name and/or the image of the State of Monaco, or damage, overload, disable, discredit or compromise the online service.${symbol_escape}n${symbol_escape}nIn particular, the following are prohibited: the transmission by email or any other means of content whose purpose is to persecute, harass, defame, discriminate or abuse; or any other dissemination of information or opinion of a personal nature relating to one or more individuals, or infringing human rights, or causing harm to minors.${symbol_escape}n${symbol_escape}n22. Correspondence must be courteous in nature at all times and comply with the basic rules of politeness.${symbol_escape}n${symbol_escape}n${symbol_escape}n<strong>Responsibility</strong>${symbol_escape}n${symbol_escape}n23. The Department of the Environment gives no guarantee, implicit or explicit, regarding the operation and/or the content of the online service.${symbol_escape}n${symbol_escape}n24. The Department of the Environment reserves the right to develop, modify or suspend the online service, without warning, for maintenance or any other reason it deems necessary.${symbol_escape}nUnavailability of the procedure does not entitle users to any compensation.${symbol_escape}n${symbol_escape}n25. The Department of the Environment cannot be held${symbol_escape}n&nbsp;responsible for damage, direct or indirect, commercial or otherwise, which results from the use of the online service.${symbol_escape}n${symbol_escape}n26. The Department of the Environment does not guarantee the continuity, accessibility or availability of the online service or related services.${symbol_escape}n${symbol_escape}n27. The Department of the Environment accepts no responsibility for any viruses which may be imported during the process of downloading any of the elements of the application or from any sites which the Department may direct the user to via hypertext links.${symbol_escape}n${symbol_escape}n28. These terms of use may also be amended at any time, without warning, in accordance with modifications made by the The Department of the Environment, changes in legislation, or for any other reason deemed necessary. It is the responsibility of users to keep themselves informed of these terms. In accordance with Article 46 of the ${symbol_escape}nSovereign Ordinance no. 3.413 of 29 August 2011 concerning various measures pertaining to the relationship between the Government and its subjects, alinea 2, the terms of use of the online service which are enforceable against the user are those which are accessible electronically on the day that the user uses the said online service${symbol_escape}n${symbol_escape}n<strong>Protection of personal data</strong>${symbol_escape}n${symbol_escape}n29. In accordance with the provisions of Article 14 of the Act&nbsp;no. 1.165 of 23 December 1993 on personal data protection, personal data collection follows the following principles:${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;${symbol_escape}n<strong>Purpose of processing data</strong>${symbol_escape}n30. In connection with the online service for requesting a subsidy for the purchase of a clean energy vehicle, the Department of the Environment processes personal information in order to:${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;Process requests for a subsidy for the purchase of a clean energy vehicle${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;Enable users requests to be dealt ${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;Ensure ease of login and navigation${symbol_escape}n${symbol_escape}n<strong>Mandatory nature of information requested or gathered</strong>${symbol_escape}n31. The personal data collected via this online service is necessary, on the one hand, to use the application and, on the other hand, to be able to respond to any request or inquiry from the user.${symbol_escape}n${symbol_escape}n${symbol_escape}n<strong>Identity of recipients</strong>${symbol_escape}n32. The Department of the Environment undertakes not to commercialise the information provided by users via the online service in any way, nor to communicate it to third parties, except in cases where this is required by law.${symbol_escape}nRights of access and rectification${symbol_escape}n33. In accordance with the provisions of Article 14 of the Act&nbsp;no. 1.165 of 23 December 1993 on personal data protection, persons affected by this procedure have a right of access to personal information concerning them, as well as the right to request the rectification, updating or removal of inaccurate, incomplete or outdated personal information concerning them.${symbol_escape}n${symbol_escape}n34. Rights can be exercised with the: ${symbol_escape}nDirection de l${symbol_escape}u2019Environnement (Department of the Environment)${symbol_escape}n3, Avenue de Fontvieille ${symbol_escape}nMC 98013 MONACO${symbol_escape}nenvironnement@gouv.mc${symbol_escape}n${symbol_escape}nPhone: (+377) 98 98 83 41${symbol_escape}n${symbol_escape}n${symbol_escape}n<strong>Security of applications</strong>${symbol_escape}n35. The State of Monaco takes the appropriate physical, technical and administrative measures to ensure the security and confidentiality of personal data, particularly in order to protect such information from loss, accidental destruction, alteration or unlawful access.${symbol_escape}n${symbol_escape}n${symbol_escape}n<strong>Copyright</strong>${symbol_escape}n${symbol_escape}n36. All content ${symbol_escape}u2013 text, comments, titles, photographs, audio, images, data, drawings, animations with sound, video... reproduced in this online service, as well as the design, form and software are the property of the State of Monaco and are protected by existing legislation on copyright and on intangible rights more generally, in particular the provisions of the Act&nbsp;no. 491 of 24 November 1948 concerning the protection of literature and works of art.${symbol_escape}n${symbol_escape}n37. Electronic copying only, for private use, of all or part of the oneline service or its elements, is authorised by the Department of the Environment, subject to no modifications being made to the original.${symbol_escape}n${symbol_escape}n38. The Department of the Environment grants users of its online service the right to personal, specific and non-exclusive use of the online service. Reproduction, copying or use for any purpose other than those described above, and in particular the modification, dissemination or use for commercial or non-commercial purposes, constitutes a criminal offence punished by the Monaco Courts and Tribunals under Articles 21 to 28 of the Act&nbsp;no. 491 of 24 November 1948 concerning the protection of literature and works of art and&nbsp;article 26 of Criminal Code${symbol_escape}n${symbol_escape}n${symbol_escape}n<strong>Trademarks</strong>${symbol_escape}n<strong>&nbsp;</strong>${symbol_escape}n39. The Trademarks and/or logos belonging to the State of Monaco which appear within this online service are protected by the provisions of the law on intellectual property under the Act&nbsp;no. 1.058 of 10 June 1983 concerning trademarks, brand names or service marks. Any reproduction, in full or in part, without the authorisation of the owner, constitutes an offence punished by the Monaco Courts and Tribunals under Article 23 of the&nbsp;Act&nbsp;no. 1.058 of 10 June 1983 concerning trademarks, brand names or service marks and&nbsp;article 26 of Criminal Code.${symbol_escape}n${symbol_escape}n${symbol_escape}n<strong>Hypertext links</strong>${symbol_escape}n${symbol_escape}n40. The creation of links to the online service is unrestricted. The Department of the Environment reserves the right to forbid any links whose purpose affects the smooth running or image of the service or the Administration. The online service may provide the user, and third parties, with links to other web sites or other Internet sources.${symbol_escape}n${symbol_escape}n${symbol_escape}n41. The Department of the Environment does not monitor these sites and cannot be held responsible, or take any responsibility for the content, advertising, products, services or any other material available on such third-party web sites.${symbol_escape}n${symbol_escape}n42. The Department of the Environment cannot be held responsible for any damage or losses, whether actual or alleged, resulting from or connected with such use or from users placing their trust in the content of third-party web sites or in goods and services available on these third-party websites.${symbol_escape}n${symbol_escape}n43. Under Articles 29 to 32 of the Act n°1.383 dated 02 August 2011 on Digital Economy, the user is responsible and bears all risks associated with using the content of the web site, particularly when relying upon the appropriateness, usefulness or completeness of such content.&nbsp;If a link leads the user to illicit content, in violation of the legislation in force, the user must cease viewing the site in question.${symbol_escape}n${symbol_escape}n44. The Department of the Environment invites the user, in such a case, to inform it immediately, and to inform the competent authorities of any link to an illicit site.${symbol_escape}n${symbol_escape}n<strong>Forwarding information</strong>${symbol_escape}n${symbol_escape}n45.&nbsp;Any change in the status or circumstances of the user must be communicated and justified to the Department of the Environment by the user.${symbol_escape}n${symbol_escape}n${symbol_escape}n${symbol_escape}n<strong>False declaration</strong>${symbol_escape}n${symbol_escape}n46. The user solemnly declares that he/she is fully aware of the sanctions provided for in Article 98 of the Monaco Criminal Code in the event of a false declaration. These include a period of imprisonment of between three months and one year, and the fine laid down in point 2 of Article 26, or one or the other of these two penalties.${symbol_escape}n${symbol_escape}n<strong>Legislation</strong>${symbol_escape}n${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;Articles 98,&nbsp;of&nbsp;the Monaco Criminal Code${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;Act n°1.383 dated 02 August 2011 on Digital Economy${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;Act&nbsp;no. 1.058 of 10 June 1983 concerning trademarks, brand names or service marks${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;Act&nbsp;no. 1.165 of 23 December 1993 on personal data protection${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;Act&nbsp;no. 491 of 24 November 1948 concerning the protection of literature and works of art${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;Sovereign Ordinance no. 3.413 of 29 August 2011 concerning various measures pertaining to the relationship between the Government and its subjects${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;Sovereign Ordinance no. 7.011 of 20 July 2018 establishing the Digital Government Department, published in the Journal de Monaco on 20 July 2018${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;Sovereign Ordinance no. 7.012 of 20 July 2018 establishing the Network and Information Technologies Department</pre>'
