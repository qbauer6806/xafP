ts.pageCgu.introHtml = '<pre><strong>Introduction</strong>${symbol_escape}n${symbol_escape}nLe présent document fixe les conditions générales d${symbol_escape}u2019utilisation du téléservice permettant de demander une aide à l${symbol_escape}u2019achat d${symbol_escape}u2019un véhicule écologique. Les conditions générales d${symbol_escape}u2019utilisation sont consultables depuis la page https://teleservice.gouv.mc/subvention-vehicule-ecologique/legalterms.html${symbol_escape}n${symbol_escape}nL${symbol_escape}u2019utilisation de ce téléservice implique l${symbol_escape}u2019acceptation sans réserve des présentes conditions générales d${symbol_escape}u2019utilisation.${symbol_escape}n${symbol_escape}nLa direction de l${symbol_escape}u2019Environnement se réserve le droit de modifier les présentes conditions générales d${symbol_escape}u2019utilisation à tout moment et sans préavis. Les usagers sont invités à s${symbol_escape}u2019y reporter régulièrement. Les présentes conditions constituent la totalité des accords, pour ce téléservice, entre le Gouvernement Princier et l${symbol_escape}u2019usager.${symbol_escape}n${symbol_escape}nToute modification ou contenu supplémentaire intégré à ce téléservice sera soumis aux présentes conditions.${symbol_escape}n${symbol_escape}n<strong>Définition et objet du téléservice</strong>${symbol_escape}n${symbol_escape}n1.&nbsp;&nbsp;Ce téléservice mis en ${symbol_escape}u0153uvre par la direction de l${symbol_escape}u2019Environnement, contribue à simplifier les démarches des usagers afin de demander une aide à l${symbol_escape}u2019achat d${symbol_escape}u2019un véhicule écologique auprès de ladite Direction.${symbol_escape}n${symbol_escape}n2.&nbsp;&nbsp;Conformément aux dispositions de l${symbol_escape}u2019article 43 de l${symbol_escape}u2019Ordonnance Souveraine n° 3.413 du 29 août 2011 portant diverses mesures relatives à la relation entre l${symbol_escape}u2019Administration et l${symbol_escape}u2019administré, la création de ce téléservice n${symbol_escape}u2019a pas pour effet de supprimer la possibilité pour l${symbol_escape}u2019usager d${symbol_escape}u2019accomplir la démarche par voie postale ou en se déplaçant à la Direction de l${symbol_escape}u2019Environnement.${symbol_escape}n${symbol_escape}n3.&nbsp;&nbsp;Ce téléservice permet également aux usagers:${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o &nbsp;de contacter par courrier électronique la Direction de l${symbol_escape}u2019Environnement${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;de répondre anonymement, s${symbol_escape}u2019ils le souhaitent, à un sondage sur l${symbol_escape}u2019utilisation du téléservice${symbol_escape}n${symbol_escape}n<strong>Propriété du téléservice</strong>${symbol_escape}n${symbol_escape}n4.&nbsp;&nbsp;Ce téléservice est la propriété exclusive du Gouvernement Princier (Direction de l${symbol_escape}u2019Environnement).${symbol_escape}n${symbol_escape}n<strong>Siège</strong>${symbol_escape}nDirection de l${symbol_escape}u2019Environnement${symbol_escape}n3, Avenue de Fontvieille ${symbol_escape}nMC 98013 MONACO${symbol_escape}nenvironnement@gouv.mc${symbol_escape}n${symbol_escape}nTéléphone : (+377) 98 98 83 41 ${symbol_escape}n${symbol_escape}n<strong>Hébergement</strong>${symbol_escape}nDirection des Réseaux et Systèmes d${symbol_escape}u2019Information${symbol_escape}n23, Avenue Albert II${symbol_escape}nBP 699${symbol_escape}n98014 MONACO CEDEX${symbol_escape}n${symbol_escape}n<strong>Accès au téléservice et compte personnel</strong>${symbol_escape}n${symbol_escape}n5.&nbsp;&nbsp;L${symbol_escape}u2019utilisation de ce téléservice est facultative. A l${symbol_escape}u2019exception du coût éventuel de connexion, l${symbol_escape}u2019accès au contenu de ce téléservice est gratuit. Il est convenu que tout accès au téléservice s${symbol_escape}u2019effectue sur une base gratuite ou forfaitaire (Câble, ADSL, etc.) et ne pourra donner lieu à aucun remboursement.${symbol_escape}n${symbol_escape}n6.&nbsp;&nbsp;L${symbol_escape}u2019utilisation dudit téléservice se fait suite à l${symbol_escape}u2019authentification de l${symbol_escape}u2019usager via un compte personnel, à créer s${symbol_escape}u2019il n${symbol_escape}u2019en dispose d${symbol_escape}u2019aucun ou s${symbol_escape}u2019il ne souhaite pas utiliser un compte existant.${symbol_escape}n${symbol_escape}n7.&nbsp;&nbsp;La Direction de l${symbol_escape}u2019Environnement se réserve le droit, à tout moment, de modifier et/ou d${symbol_escape}u2019interrompre temporairement ou définitivement tout ou partie de ce téléservice, et ce sans avoir à en informer préalablement l${symbol_escape}u2019usager. Aucune responsabilité de ce fait n${symbol_escape}u2019est encourue par ledit Service.${symbol_escape}n${symbol_escape}n8.&nbsp;&nbsp;La Direction de l${symbol_escape}u2019Environnement se réserve le droit de radier, sans préavis ni indemnité d${symbol_escape}u2019aucune sorte, tout accès au téléservice faisant l${symbol_escape}u2019objet d${symbol_escape}u2019une utilisation illicite ou d${symbol_escape}u2019acte portant atteinte aux droits de la Personne et plus généralement aux intérêts de tiers.${symbol_escape}n${symbol_escape}n<strong>Compte personnel</strong>${symbol_escape}n9.&nbsp;&nbsp;Lors de la création du compte personnel, l${symbol_escape}u2019usager choisit un identifiant et un mot de passe qui lui permettront de s${symbol_escape}u2019authentifier.${symbol_escape}nL${symbol_escape}u2019usager doit conserver son identifiant et son mot de passe qui lui seront utiles pour tout accès à son compte personnel ou au(x) téléservice(s) qui l${symbol_escape}u2019utilise(nt).${symbol_escape}n${symbol_escape}n10. Le mot de passe doit être choisi par l${symbol_escape}u2019usager de façon qu${symbol_escape}u2019il ne puisse pas être deviné par un tiers. L${symbol_escape}u2019usager s${symbol_escape}u2019engage à en préserver la confidentialité.${symbol_escape}nLe mot de passe doit être composé de 8 à 20 caractères, hors caractères spéciaux, dont au moins une lettre et un chiffre.${symbol_escape}n${symbol_escape}n11. La création du compte personnel implique la saisie par l${symbol_escape}u2019usager d${symbol_escape}u2019un certain nombre d${symbol_escape}u2019informations, tels que son titre, son nom, son prénom, son adresse postale et son adresse e-mail.${symbol_escape}n${symbol_escape}n12. L${symbol_escape}u2019usager s${symbol_escape}u2019engage à avertir immédiatement la Direction de l${symbol_escape}u2019Administration Numérique (ci-après dénommée DAN), en sa qualité d${symbol_escape}u2019administrateur du compte personnel, de toute utilisation non autorisée de ces informations ; la DAN ne saurait être tenue pour responsable des dommages éventuellement causés par l${symbol_escape}u2019utilisation de l${symbol_escape}u2019identifiant et du mot de passe par un tiers non autorisé.${symbol_escape}n${symbol_escape}n13. L${symbol_escape}u2019usager devra fournir une adresse e-mail valide lors de la création de son compte. Cette adresse est nécessaire et utilisée pour la confirmation des opérations réalisées par l${symbol_escape}u2019usager.${symbol_escape}n${symbol_escape}n14. La DAN se réserve le droit de radier, sans préavis ni indemnité d${symbol_escape}u2019aucune sorte, tout compte faisant l${symbol_escape}u2019objet d${symbol_escape}u2019une utilisation illicite ou d${symbol_escape}u2019acte portant atteinte aux droits de la Personne et plus généralement aux intérêts de tiers.${symbol_escape}n${symbol_escape}n<strong>Accès au téléservice</strong>${symbol_escape}n15. En acceptant les conditions générales d${symbol_escape}u2019utilisation, l${symbol_escape}u2019usager accepte de fait que les informations de son compte ${symbol_escape}u2013 exemples: Nom, Prénom, Adresse e-mail - soient utilisées dans le cadre du présent téléservice.${symbol_escape}n${symbol_escape}n16. L${symbol_escape}u2019usager s${symbol_escape}u2019engage à avertir immédiatement La Direction de l${symbol_escape}u2019Environnement de toute utilisation non autorisée de ces informations ; La Direction de l${symbol_escape}u2019Environnement ne saurait être tenu pour responsable des dommages éventuellement causés par l${symbol_escape}u2019utilisation de l${symbol_escape}u2019identifiant et du mot de passe et par un tiers non autorisé.${symbol_escape}n${symbol_escape}n<strong>Contraintes techniques</strong>${symbol_escape}n17. L${symbol_escape}u2019utilisation du service requiert une connexion et un navigateur Internet. Le navigateur doit être configuré pour autoriser les « cookies » de session et les fenêtres surgissantes (pop-up). Le site est optimisé pour un affichage en 1024x768 pixels. Afin de garantir un bon fonctionnement du téléservice, il est conseillé d${symbol_escape}u2019utiliser les versions de navigateurs suivantes :${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o &nbsp;Dernière version de Chrome${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;Dernière version de Firefox${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;Internet Explorer 10, et suivants${symbol_escape}n${symbol_escape}n<strong>Conservation des données</strong>${symbol_escape}n${symbol_escape}n<strong>Compte personnel</strong>${symbol_escape}n18. Un compte personnel qui n${symbol_escape}u2019est pas utilisé pendant plus de 12 mois entre dans un processus automatique de désinscription. L${symbol_escape}u2019usager peut également se désinscrire en ligne à tout moment. Dans les deux cas, un courrier électronique prévient l${symbol_escape}u2019usager de sa désinscription.${symbol_escape}nCe processus de désinscription permet d${symbol_escape}u2019effacer définitivement toutes les données personnelles de l${symbol_escape}u2019usager dans un délai de 10 jours. ${symbol_escape}n${symbol_escape}n<strong>Données du téléservice</strong>${symbol_escape}n19. Un téléservice qui n${symbol_escape}u2019est pas utilisé pendant plus de 48 mois entre dans un processus automatique de désinscription. L${symbol_escape}u2019usager peut également se désinscrire de ce téléservice en ligne à tout moment. Dans les deux cas, un courrier électronique prévient l${symbol_escape}u2019usager de sa désinscription du téléservice.${symbol_escape}nCe processus de désinscription du téléservice permet d${symbol_escape}u2019effacer définitivement toutes les données personnelles de l${symbol_escape}u2019usager liées à ce téléservice dans un délai de 10 jours.${symbol_escape}n${symbol_escape}n<strong>Données de connexion</strong>${symbol_escape}n20. Certaines données de connexion sont conservées aux fins de protection contre les intrusions et de poursuites judiciaires le cas échéant. Ces données sont conservées pendant trois mois.${symbol_escape}n${symbol_escape}n<strong>Engagement concernant l${symbol_escape}u2019utilisation du téléservice et de son contenu</strong>${symbol_escape}n${symbol_escape}n21. L${symbol_escape}u2019usager s${symbol_escape}u2019engage à ne pas commettre, sur ce téléservice, d${symbol_escape}u2019acte illicite ou portant atteinte aux droits de la Personne et plus généralement aux intérêts de tiers.${symbol_escape}nEst prohibé par les présentes conditions générales d${symbol_escape}u2019utilisation, tout acte pouvant contribuer à ternir le nom et/ou l${symbol_escape}u2019image de l${symbol_escape}u2019État de Monaco, ou pouvant endommager, surcharger, mettre hors d${symbol_escape}u2019état, discréditer ou mettre en échec le téléservice.${symbol_escape}nEst notamment prohibé : la transmission, par courrier électronique ou par tout autre moyen, des contenus servant à des fins de persécution, harcèlement, diffamation, discrimination, insultes, ou toute autre diffusion d${symbol_escape}u2019information ou d${symbol_escape}u2019opinion à caractère personnel sur un ou plusieurs individus ou portant atteinte aux droits de la personne ou aux usagers mineurs. ${symbol_escape}n${symbol_escape}n22. Les correspondances doivent avoir en toute circonstance un caractère courtois et doivent obéir aux règles élémentaires de la politesse.${symbol_escape}n${symbol_escape}n<strong>Responsabilité</strong>${symbol_escape}n${symbol_escape}n23. La Direction de l${symbol_escape}u2019Environnement ne donne aucune garantie, implicite ou explicite, concernant le fonctionnement et/ou le contenu du téléservice.${symbol_escape}n${symbol_escape}n24. La Direction de l${symbol_escape}u2019Environnement &nbsp;se réserve la liberté de faire évoluer, de modifier ou de suspendre, sans préavis, le téléservice pour des raisons de maintenance ou pour tout autre motif jugé nécessaire. L${symbol_escape}u2019indisponibilité de la démarche ne donne droit à aucune indemnité.${symbol_escape}n${symbol_escape}n25. La Direction de l${symbol_escape}u2019Environnement ne sera pas tenu responsable des dommages, directs ou indirects, commerciaux ou non, résultant de l${symbol_escape}u2019utilisation du téléservice.${symbol_escape}n${symbol_escape}n26. La Direction de l${symbol_escape}u2019Environnement ne garantit pas la continuité, l${symbol_escape}u2019accès et la disponibilité du fonctionnement du téléservice et des services afférents. ${symbol_escape}n${symbol_escape}n27. La Direction de l${symbol_escape}u2019Environnement décline toute responsabilité relative aux virus qui pourraient être importés lors du téléchargement de l${symbol_escape}u2019un des éléments du téléservice ou des sites auxquels ledit Service renvoie par le biais de liens hypertextes.${symbol_escape}n${symbol_escape}n28. Les termes des présentes conditions générales d${symbol_escape}u2019utilisation peuvent également être amendés à tout moment, sans préavis, en fonction des modifications opérées par la Direction de l${symbol_escape}u2019Environnement, de l${symbol_escape}u2019évolution de la législation ou de tout autre motif jugé nécessaire. Il appartient à l${symbol_escape}u2019usager de s${symbol_escape}u2019informer desdites conditions. Conformément à l${symbol_escape}u2019article 46 alinéa 2 de l${symbol_escape}u2019Ordonnance Souveraine n° 3.413 du 29 août 2011 portant diverses mesures relatives à la relation entre l${symbol_escape}u2019Administration et l${symbol_escape}u2019administré, les modalités d${symbol_escape}u2019utilisation du téléservice opposables à l${symbol_escape}u2019usager sont celles qui sont accessibles par voie électronique au jour où l${symbol_escape}u2019usager utilise ledit téléservice.${symbol_escape}n${symbol_escape}n<strong>Protection des données personnelles</strong>${symbol_escape}n${symbol_escape}n29. Conformément aux dispositions de l${symbol_escape}u2019article 14 de la loi n° 1.165 du 23 décembre 1993 relative à la protection des informations nominatives, la collecte des éléments nominatifs respecte les principes suivants :${symbol_escape}n${symbol_escape}n<strong>Finalité du traitement</strong>${symbol_escape}n30. Dans le cadre du téléservice permettant de demander une aide à l${symbol_escape}u2019achat d${symbol_escape}u2019un véhicule écologique, la Direction de l${symbol_escape}u2019Environnement traite des informations nominatives afin de :${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o &nbsp;Traiter les demandes d${symbol_escape}u2019aide à l${symbol_escape}u2019achat d${symbol_escape}u2019un véhicule écologique${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o &nbsp;Permettre le traitement des demandes des usagers${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;Permettre la fluidité de la connexion et de la navigation${symbol_escape}n${symbol_escape}n<strong>Caractère obligatoire des informations demandées ou collectées</strong>${symbol_escape}n31. Les informations nominatives collectées au travers de ce téléservice sont nécessaires, d${symbol_escape}u2019une part pour procéder au traitement, et d${symbol_escape}u2019autre part pour pouvoir répondre à toute demande ou toute question en cas de demande de l${symbol_escape}u2019usager.${symbol_escape}n${symbol_escape}n<strong>Identité des destinataires</strong>${symbol_escape}n32. La Direction de l${symbol_escape}u2019Environnement s${symbol_escape}u2019engage à n${symbol_escape}u2019opérer aucune commercialisation des informations transmises par l${symbol_escape}u2019usager au moyen du téléservice, ainsi qu${symbol_escape}u2019à ne pas les communiquer à des tiers, à l${symbol_escape}u2019exclusion des cas prévus par la loi.${symbol_escape}n${symbol_escape}n<strong>Droits d${symbol_escape}u2019accès et de rectification</strong>${symbol_escape}n33. Conformément à l${symbol_escape}u2019article 14 de la loi n° 1.165 du 23 décembre 1993 relative à la protection des informations nominatives, les personnes concernées par ces traitements disposent d${symbol_escape}u2019un droit d${symbol_escape}u2019accès aux informations nominatives les concernant, ainsi que le droit de demander à ce que soient rectifiées, mises à jour ou supprimées les données inexactes, incomplètes ou périmées.${symbol_escape}n${symbol_escape}n34. Ces droits peuvent être exercés auprès de la&nbsp;:${symbol_escape}nDirection de l${symbol_escape}u2019Environnement${symbol_escape}n3, Avenue de Fontvieille ${symbol_escape}nMC 98013 MONACO${symbol_escape}nenvironnement@gouv.mc${symbol_escape}n${symbol_escape}nTéléphone : (+377) 98 98 83 41 ${symbol_escape}n&nbsp;${symbol_escape}n${symbol_escape}n<strong>Sécurité des traitements</strong>${symbol_escape}n35. L${symbol_escape}u2019État de Monaco prend les mesures physiques, techniques et organisationnelles appropriées pour assurer la sécurité et la confidentialité des données à caractère personnel, en vue notamment de les protéger contre toute perte, destruction accidentelle, altération, et accès non autorisés.${symbol_escape}n${symbol_escape}n<strong>Droits d${symbol_escape}u2019auteur</strong>${symbol_escape}n${symbol_escape}n36. Tous les contenus ${symbol_escape}u2013 qu${symbol_escape}u2019il s${symbol_escape}u2019agisse de textes, commentaires, titres, photographies, sons, images, données, dessins, séquences animées sonores, vidéos${symbol_escape}u2026 ${symbol_escape}u2013 reproduits sur ce téléservice, ainsi que la conception, la forme et les logiciels sont la propriété de l${symbol_escape}u2019État de Monaco et sont protégés par les textes en vigueur sur le droit d${symbol_escape}u2019auteur et plus généralement sur les droits incorporels, notamment les dispositions de la loi n° 491 du 24 novembre 1948 sur la protection des ${symbol_escape}u0153uvres littéraires et artistiques.${symbol_escape}n${symbol_escape}n37. Seule la copie électronique à usage privé de tout ou partie du téléservice ou des éléments le composant est autorisée par la Direction de l${symbol_escape}u2019Environnement, sous réserve de ne pas en modifier l${symbol_escape}u2019original. ${symbol_escape}n${symbol_escape}n38. La Direction de l${symbol_escape}u2019Environnement accorde aux usagers de son téléservice un droit d${symbol_escape}u2019usage personnel, ponctuel et non exclusif, de celui-ci. La reproduction, la copie ou l${symbol_escape}u2019exploitation dans un but autre que celui mentionné ci-dessus et notamment la modification, la diffusion ou l${symbol_escape}u2019utilisation dans un but commercial ou non, constitue une infraction pénalement sanctionnée par les Cours et Tribunaux monégasques en application des articles 21 à 28 de la loi n° 491 du 24 novembre 1948 sur la protection des ${symbol_escape}u0153uvres littéraires et artistiques et de l${symbol_escape}u2019article 26 du Code pénal.${symbol_escape}n${symbol_escape}n<strong>Marques</strong>${symbol_escape}n${symbol_escape}n39. Les marques et/ou logos dont est titulaire l${symbol_escape}u2019État de Monaco, apparaissant sur ce téléservice, sont des marques protégées par des dispositifs du droit de la propriété intellectuelle, en application de la loi n° 1.058 du 10 juin 1983 sur les marques de fabrique, de commerce ou de service. Toute reproduction, en tout ou partie, sans l${symbol_escape}u2019autorisation du titulaire constitue une infraction pénalement sanctionnée par les Cours et Tribunaux monégasques, en application de l${symbol_escape}u2019article 23 de la loi n° 1.058 du 10 juin 1983 sur les marques de fabrique, de commerce ou de service et de l${symbol_escape}u2019article 26 du Code pénal.${symbol_escape}n${symbol_escape}n<strong>Liens hypertextes</strong>${symbol_escape}n${symbol_escape}n40. La création de lien vers le téléservice est libre. La Direction de l${symbol_escape}u2019Environnement se réserve le droit d${symbol_escape}u2019interdire tout lien dont la finalité porterait atteinte au bon fonctionnement ou à l${symbol_escape}u2019image du Service ou de l${symbol_escape}u2019Administration. Le téléservice peut fournir à l${symbol_escape}u2019usager, ainsi qu${symbol_escape}u2019à des tiers, des liens vers d${symbol_escape}u2019autres sites ou d${symbol_escape}u2019autres sources Internet.${symbol_escape}n${symbol_escape}n41. La Direction de l${symbol_escape}u2019Environnement ne contrôle pas ces sites et ne pourrait être tenu responsable, ni supporter aucune responsabilité quant au contenu, publicité, produit, service ou tout autre matériel disponible à partir de ces sites tiers.${symbol_escape}n${symbol_escape}n42. La Direction de l${symbol_escape}u2019Environnement ne pourrait être tenu responsable de tous dommages ou pertes avérés ou allégués consécutifs ou en relation avec l${symbol_escape}u2019utilisation ou avec le fait d${symbol_escape}u2019avoir fait confiance au contenu des sites tiers ou aux biens et services disponibles sur ces sites tiers.${symbol_escape}n${symbol_escape}n43. En application des articles 29 à 32 de la loi n° 1.383 du 02 août 2011 sur l${symbol_escape}u2019Économie Numérique, l${symbol_escape}u2019usager est responsable et supporte tous les risques afférents à l${symbol_escape}u2019utilisation qu${symbol_escape}u2019il fait du contenu du site, notamment lorsqu${symbol_escape}u2019il se fie à l${symbol_escape}u2019opportunité, l${symbol_escape}u2019utilité ou le caractère complet de ce contenu. Si un lien amenait l${symbol_escape}u2019usager à pointer vers des contenus illicites, en infraction avec la législation en vigueur, l${symbol_escape}u2019usager devrait alors interrompre sa consultation du site concerné.${symbol_escape}n${symbol_escape}n44. La Direction de l${symbol_escape}u2019Environnement invite dans ce cas l${symbol_escape}u2019usager à l${symbol_escape}u2019informer immédiatement, ainsi que les autorités compétentes, du lien automatique vers un site illicite.${symbol_escape}n${symbol_escape}n<strong>Transmission des informations</strong>${symbol_escape}n${symbol_escape}n45. Tout changement de statut ou d${symbol_escape}u2019état de l${symbol_escape}u2019usager devra être communiqué et justifié par ce dernier auprès de la Direction de l${symbol_escape}u2019Environnement.${symbol_escape}n${symbol_escape}n<strong>Fausse déclaration</strong>${symbol_escape}n${symbol_escape}n46. L${symbol_escape}u2019usager déclare sur l${symbol_escape}u2019honneur connaître parfaitement les sanctions prévues à l${symbol_escape}u2019article 98 du Code pénal monégasque en cas de fausse déclaration, soit une peine d${symbol_escape}u2019emprisonnement de 3 mois à 1 an et l${symbol_escape}u2019amende prévue au chiffre 2 de l${symbol_escape}u2019article 26 ou l${symbol_escape}u2019une de ces deux peines seulement.${symbol_escape}n${symbol_escape}n<strong>Textes officiels</strong>${symbol_escape}n${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o &nbsp;Article 98 du Code Pénal monégasque${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;Loi n° 1.383 du 02 août 2011 sur l${symbol_escape}u2019Économie Numérique${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;Loi n° 1.058 du 10 juin 1983 sur les marques de fabrique, de commerce ou de service${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;Loi n° 1.165 du 23 décembre 1993 relative à la protection des informations nominatives${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o &nbsp;Loi n° 491 du 24 novembre 1948 sur la protection des ${symbol_escape}u0153uvres littéraires et artistiques${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;Ordonnance Souveraine n° 3.413 du 29 août 2011 portant diverses mesures relatives à la${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;relation entre l${symbol_escape}u2019Administration et l${symbol_escape}u2019administré${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;Ordonnance Souveraine n° 7.011 du 20 juillet 2018 portant création de la Direction de l${symbol_escape}u2019Administration Numérique parue au Journal De Monaco le 20 juillet 2018. ${symbol_escape}n&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o &nbsp;Ordonnance Souveraine n° 7.012 du 20 juillet 2018 portant création de la Direction des Réseaux et Systèmes d${symbol_escape}u2019Information.</pre>'
