ts.pageDemarrer.contenuHtml = '<p>La présente démarche en ligne vous permet de faire une déclaration concernant la demande de Subvention pour l${symbol_escape}u2019achat d${symbol_escape}u2019un véhicule écologique.</p><p>Le principe et les conditions de la démarche sont décrits dans la <a title="Ouvrir la fiche démarche dans une nouvelle fenêtre" data-ng-href="{{properties[&${symbol_pound}39;mc.gouv.appfactory.gen.front.ficheDemarcheUrl.fr&${symbol_pound}39;]}}" class="ext_link" target="_blank">fiche démarche</a> de l${symbol_escape}u2019Espace Particuliers du Service Public.</p><p>Merci de noter qu${symbol_escape}u2019une aide peut être attribuée pour l${symbol_escape}u2019achat d${symbol_escape}u2019un véhicule&nbsp;propre ou peu polluant&nbsp;:</p><ul><li>Neuf ou précédemment immatriculé en série démonstration depuis moins d${symbol_escape}u2019un an par un concessionnaire si justificatif</li><li>Immatriculé à Monaco (ou appartenant à un résident monégasque pour les vélos&nbsp;d${symbol_escape}u2019une puissance maximale de 250 W)</li></ul><p></p><p>Avant de démarrer, assurez-vous d${symbol_escape}u2019avoir à votre disposition toutes les pièces à joindre dans l${symbol_escape}u2019un des formats suivants : .doc, .docx, .rtf, .pdf, .jpg, .png et .tif.</p><p>Voici la liste des pièces justificatives à prévoir dans le cadre de cette démarche :</p><ul><li>Une copie du certificat d${symbol_escape}u2019immatriculation du véhicule</li><li>Une copie de la facture du véhicule</li><li>Un relevé d${symbol_escape}u2019identité bancaire (RIB) à votre nom</li><li>Pour les véhicules électriques, un justificatif de la valeur assurée de la batterie ou, le cas échéant, une copie du contrat de location avec échéancier</li><li>En cas de location longue durée, pour tous les véhicules, une copie du contrat de location avec échéancier du véhicule et de la batterie si le véhicule est électrique</li><li>Pour les vélos non immatriculés (d${symbol_escape}u2019une puissance maximale de 250W), un justificatif de résidence à Monaco (copie de la carte de résident, carte d${symbol_escape}u2019identité monégasque ou un extrait du RCI pour les entreprises)</li></ul><p></p><p>Enfin, l${symbol_escape}u2019utilisation de cette démarche en ligne nécessite de disposer d${symbol_escape}u2019un compte personnel que vous devrez créer si vous n${symbol_escape}u2019en possédez pas déjà un.</p><p></p><p>Les étapes de la démarche en ligne sont les suivantes :</p><ol><li>Informations concernant l${symbol_escape}u2019usager</li><li>Identification bancaire</li><li>Informations concernant le véhicule</li><li>Simulation du montant</li><li>Pièces justificatifs à fournir</li><li>Récapitulatif</li></ol><p></p><p>Dans le cadre de cette démarche, vous avez également la possibilité de répondre anonymement à un sondage.</p>'
