spring.profiles.active=test

spring.datasource.initialize=true
spring.datasource.platform=h2

#logging.level.org.springframework = DEBUG

application.name=TESTDEM

#Mode embarqué pour artémis
spring.artemis.mode=embedded
#Pour désactiver la configuration embedded par défaut qui ne gère pas un accès sécurisé par user / password
spring.artemis.embedded.enabled=false
#Pour activer la nouvelle configuration securisée
spring.artemis.embedded.secure.enabled=true
#Pour configurer via  mc.gouv.af.apiserver.ArtemisConfig le fait de pouvoir s'y connecter depuis une application tierce
spring.artemis.embedded.remoteAccess=true
#Le topic est persistent
spring.artemis.embedded.persistent=true
#Pour créer automatiquement le topic demandes
spring.artemis.embedded.topics=demandes,demandes.dlq

mc.gouv.candi.jms.topic.create=true
mc.gouv.candi.indexing.enabled=true

mc.gouv.mail.smtp.server.host=localhost
mc.gouv.mail.smtp.server.port=30485

mc.gouv.api.mail.security.user.name=abc
mc.gouv.api.mail.security.user.password=abc
