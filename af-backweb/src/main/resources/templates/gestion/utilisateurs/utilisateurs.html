<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	class="no-js sidebar-left-collapsed"  lang="fr" dir="ltr">

<head>
<meta charset="utf-8" />
<meta http-equiv="x-ua-compatible" content="ie=edge" />
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no" />
<title th:text="${AfBackUtils.getDemarcheNom()}"></title>
<link rel="shortcut icon" th:href="@{/img/favicon.ico}" />
<!-- Import FONTS -->
<link th:href="@{/webjars/xcb-wlib/fonts/style.css}" rel="stylesheet" />
<link rel="stylesheet" th:href="@{/webjars/xcb-wlib/fonts/ie7/ie7.css}" />

<!-- Import CSS -->
<link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
	rel="stylesheet" type="text/css" />
<link th:href="@{/webjars/xcb-wlib/css/template.css}" rel="stylesheet" />
<link th:href="@{/webjars/xcb-wlib/css/sidebar.css}" rel="stylesheet" />
<link th:href="@{/webjars/xcb-wlib/css/element.css}" rel="stylesheet" />
<link th:href="@{/webjars/datatables/css/dataTables.bootstrap.css}"
	rel="stylesheet" />
<link
	th:href="@{/webjars/bootstrap-datepicker/css/bootstrap-datepicker.css}"
	rel="stylesheet" />

<link rel="shortcut icon" type="image/x-icon"
	th:href="@{/img/favicon.ico}" />
<link th:href="@{/css/tsgen.css(${applicationBuildTimestamp})}"
	rel="stylesheet" />
<link th:href="@{/css/tsdem.css(${applicationBuildTimestamp})}"
	rel="stylesheet" />

</head>
<body th:with="pageUtilisateursActive='active'">

	<div>

		<div th:replace="fragments/header :: header" />

		<div id="wrapper">

			<div th:replace="fragments/sidebar :: sidebar" />

			<!-- DEBUT CONTENU -->
			<div id="page-content-wrapper">

				<div class="breadcrumbContent">
					<ol class="breadcrumb">
						<span class="breadcrumb-item active"><a
							th:href="@{/}" class="breadcrumb-item">Accueil</a>&nbsp;&gt;&nbsp;<a
							th:href="@{/gestion/utilisateurs}" class="breadcrumb-item">Utilisateurs</a>
							&gt;</span>
					</ol>
					<div class="triangleTopright"></div>
				</div>

				<div class="container-fluid">

					<div class="row">
						<div class="col-xs-12">
							<h1>Utilisateurs de l'application <span th:text="${AfBackUtils.getDemarcheInfos().pkDemarches}"></span></h1>
						</div>
					</div>

					<div class="row">
						<div class="col-xs-12">
							<div class="tableContent">
								<div class="tableTitle">
									Utilisateurs <span class="badge" th:text="${#lists.size(userList)}"></span>
									
								</div>
								<table id="datatable_utilisateurs"
									class="table table-striped table-bordered table-hover">
									<thead>
										<tr>
											<th>Etat</th>
											<th>Rôle</th>
											<th>Matricule</th>
											<th>Opid</th>
											<th>Nom</th>
											<th>Service</th>
										</tr>
									</thead>
									<tbody>
										<tr th:each="obj : ${userList}">
											<td th:text="${obj.getEtat()}"></td>
											<td th:text="${obj.getRolesByAppli(demarcheId)}"></td>
											<td th:text="${obj.getMatricule()}"></td>
											<td th:text="${obj.getOpid()}"></td>
											<td th:text="${obj.getNom()}"></td>
											<td th:text="${obj.getService()}"></td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>

					</div>
				</div>
				
			</div>
		</div>
	</div>


	<div class=" row">
		<div th:replace="fragments/footer :: footer" /></div>

		<script th:inline="javascript">
			$(document).ready(
					function() {

						var datatablePersonnes = $('#datatable_utilisateurs')
								.DataTable({
									binfo : false,
									paging : true,
									searching : false,
									select : false,
									"iDisplayLength" : 25,
									order : [ [ 1, "asc" ] ],

									columnDefs : [ {
										targets : [ 0 ],
										orderData : [ 1, 3 ]
									}, {
										targets : 3,
										orderable : false
									} ],
									language : frenchTranslation,
								});

					});
		</script>
</body>
</html>
