#set( $symbol_pound = '#' )
#set( $symbol_dollar = '$' )
#set( $symbol_escape = '\' )
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
	<div id="sectiondiscussion${artifactIdLower}"
		th:fragment="sectiondiscussion${artifactIdLower}" th:remove="tag">
		<div class="col-xs-12">
			<form id="discussion-demande" action="${symbol_pound}"
				th:action="@{/demandes/commentaires}" method="post">
				<div class="panel-group accordion" role="tablist"
					aria-multiselectable="true">
					<div class="panel panel-default">
						<div class="panel-heading" role="tab" id="heading5">
							<h4 class="panel-title">
								<a role="button" data-toggle="collapse"
									data-parent="${symbol_pound}accordion5" href="${symbol_pound}collapse5"
									aria-controls="collapse5"
									th:attr="aria-expanded=${symbol_dollar}{isDiscussionPanelActive}"
									th:class="${symbol_dollar}{isDiscussionPanelActive}  ? '' : collapsed "> <i
									class="pannelState icon-action_accordeon-ouvert"
									th:classappend="${symbol_dollar}{isDiscussionPanelActive} ? icon-action_accordeon-ouvert : icon-action_accordeon-ferme"></i>
									Discussion administration
								</a>
							</h4>
						</div>
						<div id="collapse5" class="panel-collapse collapse"
							th:classappend="${symbol_dollar}{isDiscussionPanelActive} ? in:out"
							role="tabpanel" aria-labelledby="heading5">
							<div class="panel-body">
								<div class="row">
									<div class="col-xs-12">


										<div id="commentairesInternes" class="container-fluid"
											style="padding: 2px; margin-bottom: 10px; overflow-y: scroll; height: 250px; border-top: 1px solid rgb(28, 142, 172); border-bottom: 1px solid rgb(28, 142, 172);">

											<div class="row" th:each="comm : ${symbol_dollar}{commInternes}">

												<div class="col-xs-12"
													style="background-color: ${symbol_pound}ffffff; line-height: 1em">
													<div
														th:text="${symbol_dollar}{${symbol_pound}dates.format(comm.date,'dd/MM/yyyy HH:mm:ss')}"
														style="font-size: 0.8em; font-weight: bold; color: rgb(94, 97, 100);"></div>
													<div style="font-weight: bold;"
														th:text="${symbol_dollar}{AfBackUtils.getUserNameFromID(comm.agentId)}"></div>
													<div th:text="${symbol_dollar}{comm.commentaire}"
														style="margin: 5px 0 8px 0;"></div>
												</div>

											</div>


										</div>



										<div class="row">
											<div id="com-interne-inputFormGroup"
												class="col-xs-12 form-group">
												<label for="com-interne-input">AJOUTER UN
													COMMENTAIRE</label>
												<textarea class="form-control greyTooltip"
													oninput="checkCommentaireDiscussionValidity()"
													data-toggle="tooltip" data-placement="bottom"
													title="Commentaire limité à 140 caractères"
													th:field="${symbol_dollar}{traitementFormBean.commentaireInterne}"
													id="com-interne-input"
													th:disabled="!${symbol_dollar}{isDiscussionPanelActive}"></textarea>
											</div>

										</div>
										<div class="row mt-15">
											<div class="col-xs-12 text-right">
												<input type="hidden" name="pkDemande"
													th:value="${symbol_dollar}{demandeDTO.pkDemandes}" /> <input
													type="submit" name="action" value="Publier"
													class="btn btn-action ripple-effect"
													id="envoyer-commentaire-button"
													th:disabled="!${symbol_dollar}{isDiscussionPanelActive}" />
											</div>

										</div>

									</div>
								</div>

							</div>
						</div>
					</div>
				</div>
			</form>
		</div>
	</div>
</body>
</html>
