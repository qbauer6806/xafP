#set( $symbol_pound = '#' )
#set( $symbol_dollar = '$' )
#set( $symbol_escape = '\' )
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div id="sectiontraitement" th:fragment="sectiontraitement"
	 th:remove="tag">

	<div
			th:if="${symbol_dollar}{statutPublicOuInterneDTO.getName()} != 'REFUSEE' and ${symbol_dollar}{statutPublicOuInterneDTO.getName()} != 'ACCORDEE' and ${symbol_dollar}{statutPublicOuInterneDTO.getName()} != 'ANNULEE'">
		<div class="panel-group accordion" role="tablist"
			 aria-multiselectable="true">
			<div class="panel panel-default">
				<div class="panel-heading" role="tab" id="headingThree">
					<h4 class="panel-title">
						<a role="button" data-toggle="collapse" data-parent="${symbol_pound}accordion3"
						   href="${symbol_pound}collapseThree"
						   th:attr="aria-expanded=${symbol_dollar}{hasRoleValidationOrTraitement}"
						   aria-controls="collapseThree"
						   th:class="${symbol_dollar}{hasRoleValidationOrTraitement}  ? '' : collapsed ">
							<i class="pannelState"
							   th:classappend="${symbol_dollar}{hasRoleValidationOrTraitement}  ? icon-action_accordeon-ouvert : icon-action_accordeon-ferme"></i>
							Traitement de la demande <span
								th:class="(${symbol_dollar}{isEnCoursTraitement} or ${symbol_dollar}{isEnAttentTraitemant} or ${symbol_dollar}{isEnAttendValidationHierarchique}) ? 'required' : ''"></span>
						</a>
					</h4>
				</div>
				<div id="collapseThree" class="panel-collapse collapse"
					 th:classappend="${symbol_dollar}{hasRoleValidationOrTraitement} ? in : out"
					 role="tabpanel" aria-labelledby="headingTwo">
					<div class="panel-body">

						<!-- Prendre en charge la demande -->
						<div class="row" th:if="${symbol_dollar}{isEnAttentTraitemant}">
							<div class="col-xs-12 text-center">
								<form action="${symbol_pound}" th:action="@{/demandes/prendreEnCharge}"
									  th:object="${symbol_dollar}{demandeDTO}" method="post">
									<input type="submit" value="Prendre en charge la demande"
										   th:disabled="!${symbol_dollar}{${symbol_pound}authorization.expression('hasRole(''ROLE_TRAITEMENT'')')}"
										   class="btn btn-action ripple-effect " /> <input
										type="hidden" name="pkDemande"
										th:value="${symbol_dollar}{demandeDTO.pkDemandes}" /> <input type="hidden"
																					  name="pkDemande" th:value="${symbol_dollar}{demandeDTO.pkDemandes}" /> <input
										type="hidden" name="activeTaskDefinitionKey"
										th:value="${symbol_dollar}{activeTaskDefinitionKey}" />
								</form>
							</div>
						</div>

						<!--  Demande en cours de traitement et validation hiérarchique-->
						<div th:if="(${symbol_dollar}{isEnCoursTraitement} or ${symbol_dollar}{isEnAttendValidationHierarchique}) and !${symbol_dollar}{isReprendreEnchargeVisible}">
							<form id="form-validation" action="${symbol_pound}"
								  th:action="@{/demandes/traiter}" th:object="${symbol_dollar}{demandeDTO}"
								  method="post">

								<!-- Input cach�e contenant le statut actuel de la demande (ne pas enlever) -->
								<input type="hidden" name="pkDemande"
									   th:value="${symbol_dollar}{demandeDTO.pkDemandes}" />
								<input type="hidden" id="modif" name="modif" value="false" /> <input type="hidden" name="activeTaskDefinitionKey"
										th:value="${symbol_dollar}{activeTaskDefinitionKey}" />
								<input type="hidden" name="statutPublicOuInterne" th:value="${symbol_dollar}{statutPublicOuInterneDTO.getName()}" />

								<div class="row">
									<div class="col-xs-12">
										<h2>Décision de l'administration</h2>
									</div>
								</div>

								<div class="row">
									<div class="col-xs-12">
										<ul class="radiobuttons toggle">
											<li th:each="item : ${symbol_dollar}{actionsDisponibles}"
												th:object="${symbol_dollar}{traitementFormBean}"><input type="radio"
																						 class="custom" name="statutChoisi" data-toggle="button"
																						 th:field="*{statutChoisi}" th:id="${symbol_dollar}{item.statut}"
																						 th:value="${symbol_dollar}{item.statut}"
																						 th:disabled="!${symbol_dollar}{${symbol_pound}authorization.expression('hasRole(''ROLE_TRAITEMENT'')')} or ${symbol_dollar}{isEnAttendValidationHierarchique}" />
												<label th:inline='text' th:for="${symbol_dollar}{item.statut}"> <span
														class="ico"></span><span>[[${symbol_dollar}{item.action}]]</span>
												</label></li>
										</ul>
									</div>
								</div>

								<div class="row">
									<div class="col-xs-12">
										<span class="titre">Motif :</span> <select
											th:disabled="!${symbol_dollar}{isMotifActive}"
											th:field="${symbol_dollar}{traitementFormBean.codeMotifChoisi}"
											class="form-control">
										<option th:each="motif : ${symbol_dollar}{motifsInit}"
												th:value="${symbol_dollar}{motif.code}" th:text="${symbol_dollar}{motif.libelle}" />
									</select>
									</div>
								</div>

								<div class="row mt-15">
                                    <div id="commentaireUsagerFormGroup"
                                         class="col-xs-12 form-group">
                                        <span class="titre">Commentaire (envoyé à l'usager) :</span>
                                        <textarea id="commentaireUsager"
                                                  class="form-control greyTooltip"
                                                  oninput="checkCommentaireLength('${symbol_pound}commentaireUsager')"
                                                  data-toggle="tooltip" data-placement="bottom"
                                                  title="Commentaire limité à 1500 caractères"
                                                  th:disabled="!${symbol_dollar}{isMotifActive}"
                                                  th:field="${symbol_dollar}{traitementFormBean.commentaireUsager}"></textarea>
                                    </div>
								</div>

								<div class="row mt-15">
									<div class="col-xs-5 text-left">
										<input type="hidden" name="pkDemande"
											   th:value="${symbol_dollar}{demandeDTO.pkDemandes}" /> <a
											class="btn btn-action-second ripple-effect"
											id="annulerDemande" th:disabled="!${symbol_dollar}{isAnnulationActive}">
										Annuler la demande</a>
									</div>

									<div class="col-xs-7 text-right"
										 th:if="${symbol_dollar}{isEnCoursTraitement}">
										<input type="submit" name="action" value="Traiter"
											   id="traiter-button" class="btn btn-action ripple-effect "
											   th:disabled="!${symbol_dollar}{${symbol_pound}authorization.expression('hasRole(''ROLE_TRAITEMENT'')')}" />
										<input type="submit" name="action" value="Traiter"
											   id="confirmer-button" style="display: none" />
									</div>

									<div th:if="${symbol_dollar}{isEnAttendValidationHierarchique}"
										 sec:authorize="hasRole('ROLE_VALIDATION')">
									    <div class="col-xs-7 text-right">
									        <input type="submit" name="action" value="Refuser"
									            class="btn btn-action ripple-effect " /> 
									            
									        <input type="button" name="Modifier" value="Modifier"
									            class="btn btn-action ripple-effect" /> 
									            
									        <input id="valider-button" type="button" name="Action"
									            value="Valider" class="btn btn-action ripple-effect" /> 
									            
									        <input id="confirmer-button" type="submit" name="action"
									            value="Valider" style="display: none" />
									    </div>
									</div>
								</div>
							</form>
						</div>

						<!-- Demander des informations complémentaires -->
						<div class="row"
							 th:if="${symbol_dollar}{statutPublicOuInterneDTO.getName()} == 'EN_ATTENTE_COMPL'">
							<div class="col-xs-12">
								<form method="POST" enctype="multipart/form-data"
									  th:action="@{/demandes/repondreDIC}+'?'+${symbol_dollar}{_csrf.parameterName}+'='+${symbol_dollar}{_csrf.token}">

									<div class="row">
										<div id="commentaireReponseFormGroup"
											class="col-xs-12 form-group">
											<span class="titre">Répondre à la demande d'informations
													complémentaires à la place de l'usager</span>
											<textarea id="commentaireReponse"
												class="form-control greyTooltip" name="commentaireReponse"
												oninput="checkCommentaireLength('${symbol_pound}commentaireReponse')"
												data-toggle="tooltip" data-placement="bottom"
												title="Commentaire limité à 1500 caractères"
												th:disabled="!${symbol_dollar}{${symbol_pound}authorization.expression('hasRole(''ROLE_TRAITEMENT'')')}"></textarea>
										</div>
									</div>

									<div class="row mt-15">
										<div class="col-xs-12">
											<input class="multiple-file-input" id="fileInput"
												   type="file" name="uploadingFiles" multiple="multiple"
												   th:disabled="!${symbol_dollar}{${symbol_pound}authorization.expression('hasRole(''ROLE_TRAITEMENT'')')}" />
										</div>
									</div>

									<div class="row mt-15">
										<div class="col-xs-6 text-left">
											<input type="hidden" name="pkDemande"
												   th:value="${symbol_dollar}{demandeDTO.pkDemandes}" /> <input
												type="hidden" name="activeTaskDefinitionKey"
												th:value="${symbol_dollar}{activeTaskDefinitionKey}" /> <a
												class="btn btn-action-second ripple-effect"
												id="annulerDemande" th:disabled="!${symbol_dollar}{isAnnulationActive}">
											Annuler la demande</a>
										</div>
										<div class="col-xs-6 text-right">
											<input type="submit" value="Envoyer"
												   class="btn btn-action ripple-effect"
												   th:disabled="!${symbol_dollar}{${symbol_pound}authorization.expression('hasRole(''ROLE_TRAITEMENT'')')}" />
											<input type="hidden" name="icId" th:value="${symbol_dollar}{icId}" />
										</div>
									</div>
								</form>
							</div>
						</div>

						<!-- Reprendre en charge la demande -->
						<div class="row" th:if="${symbol_dollar}{isReprendreEnchargeVisible}">
							<div class="col-xs-12 text-center">
								<form action="${symbol_pound}" th:action="@{/demandes/reprendreEnCharge}"
									  th:object="${symbol_dollar}{demandeDTO}" method="post">
									<input type="submit" id="reprendre-button"
										   value="Reprendre en charge la demande"
										   th:disabled="!${symbol_dollar}{${symbol_pound}authorization.expression('hasRole(''ROLE_TRAITEMENT'')')}"
										   class="btn btn-action ripple-effect  " /> <input
										type="hidden" name="pkDemande"
										th:value="${symbol_dollar}{demandeDTO.pkDemandes}" /> <input type="hidden"
																					  name="pkDemande" th:value="${symbol_dollar}{demandeDTO.pkDemandes}" /><input
										type="hidden" name="activeTaskDefinitionKey"
										th:value="${symbol_dollar}{activeTaskDefinitionKey}" />
								</form>
							</div>
						</div>

					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- fin de section -->
</div>
</body>
</html>
