ts.pageAide.introHtml = '<h4>What should I do if I do not receive confirmation of receipt?</h4><pre>Following the declaration, confirmation of receipt will be sent to you electronically using the e-mail address of the account with which you are connected.${symbol_escape}nYou should check to see whether the e-mail appears in the spam section of your In Box.${symbol_escape}nOtherwise, please contact the Labour Inspectorate Service Department.</pre><h4>What should I do if I encounter problems displaying pages?</h4><pre>Use of the service requires an Internet connection and browser. The browser must be configured to allow session cookies. It must also be configured to allpw pop-ups for the teleservice.gouv.mc website. The site is optimised for viewing with a screen resolution of 1024x768 pixels. To ensure that the application works properly, use of the following browser versions is recommended :</pre><ul><li>Chrome</li><li>Internet Explorer</li></ul><pre>Other common browsers (Safari, Firefox, Edge, ect.) are believed to be compatible with the online service, but the Government cannot guarantee optimal rendering.</pre><h4>How can I obtain information on this process?</h4><pre>You can consult <a title="Open the procedure in a new window" data-ng-href="{{properties[&${symbol_pound}39;mc.gouv.appfactory.gen.front.ficheDemarcheUrl.en&${symbol_pound}39;]}}" class="ext_link" target="_blank">the procedure</a> on the Individuals section of the Public Services web pages.</pre>'
