ts.pageDemarrer.contenuHtml = '<p>This online service allows you to make a declaration regarding XXXXXXX.</p><p>The principle and conditions of the online service are described in the <a class="ext_link" target="_blank" data-ng-href="{{properties[''mc.gouv.appfactory.gen.front.ficheDemarcheUrl.en'']}}" title="Open the procedure in a new window" rel="noopener noreferrer">procedure</a> on the Individuals section of the Public Services web pages.</p><p>Before you begin, make sure that you have at hand all of the documents you will need to attach in one of the following format: .doc, .docx, .rtf, .pdf, .jpg, .png and .tif.</p><p>Finally, a personal account is required to use this online service, so you will need to create one if you do not already have one.</p><p>The steps in the online service are as follows:</p><ol><li>Information about the test</li></ol><p>As part of this online service, you will also be offered the opportunity to take part in an anonymous survey.</p>'
