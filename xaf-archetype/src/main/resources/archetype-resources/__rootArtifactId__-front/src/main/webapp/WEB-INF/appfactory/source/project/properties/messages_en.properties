ts.pageCgu.introHtml = '<p><strong>Introduction</strong></p><p><strong>&nbsp;</strong></p><p>This document sets out the general terms of use of the online service for requesting an exemption to statutory public holidays. The general terms of use are available for consultation from the following page: https://teleservice.gouv.mc/derogation-nuit-femme/legalterms.html</p><p></p><p>Access to this online service implies that the user has accepted these general terms of use without reservation.</p><p></p><p></p><p>The Labour Inspectorate Service reserves the right to amend these general terms of use at any time and without notice. Users are invited to consult these terms on a regular basis. These terms constitute the full set of agreements between the Prince's Government and the user for this online service. </p><p></p><p></p><p>Any change or additional content introduced to the personal account will be subject to these terms.</p><p></p><p></p><p><strong>Definition and purpose of the online service</strong></p><p><strong>&nbsp;</strong></p><p>1.&nbsp;This online service, which is implemented by the Labour Inspectorate Service, helps to simplify procedures for users who are requesting an exemption to statutory public holidays.</p><p></p><p>2. In accordance with Article 46,&nbsp;of the </p><p>Sovereign Ordinance no. 3.413 of 29 August 2011 concerning various measures pertaining to the relationship between the Government and its subjects, the introduction of this online service does not in any way replace the option for the user to make a request by post or by visiting the Labour Inspectorate Service in person</p><p></p><p>3. This online service also enables users:</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;To contact the Labour Inspectorate Service by email</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;To reply anonymously, if so wished, to a survey on using this online service</p><p></p><p></p><p><strong>Ownership of the online service</strong></p><p></p><p>4. This online service is the exclusive property of the State of Monaco (Labour Inspectorate Service)</p><p></p><p><strong>Headquarter</strong></p><p>Service de l${symbol_escape}u2019Inspection du Travail (Labour Inspectorate Service)</p><p>La Frégate</p><p>2, rue Princesse Antoinette</p><p>98000 Monaco </p><p>inspectiondutravail@gouv.mc</p><p></p><p>Phone : (+377) 98 98 87 26</p><p></p><p><strong>Hosting</strong></p><p>Network and Information Technologies Department</p><p>23, Avenue Albert II</p><p>BP 699</p><p>MC 98014 MONACO CEDEX</p><p></p><p><strong>Access to online service and personal account </strong></p><p></p><p>5. The use of this online service is optional. With the exception of any connection costs incurred, access to the content of this application is free. It is agreed that all access to the application is made available on a free or all-inclusive basis (Cable, ADSL, etc.) and therefore no refunds can be offered.</p><p></p><p>6. Use of the aforesaid online service shall be made following the authentication of the user via a personal account, which must be created if the user has no such account or if the user does not wish to use an existing account.</p><p></p><p>7. The Labour Inspectorate Service reserves the right, at any time, to change, and/or to temporarily or permanently suspend all or part of this online service, without notifying users in advance. The Labour Inspectorate Service incurs no liability as a result of such action.</p><p></p><p>8. The Labour Inspectorate Service reserves the right to remove, without warning or compensation of any kind, any access to the online service which constitutes unlawful use or an act which infringes human rights or more generally causes prejudice to the interests of third parties</p><p></p><p><strong>Personal account</strong></p><p>9. During the account creation process, the user selects a user name and a password which will enable them to authenticate their identity.</p><p>The user must retain their user name and password, which they will use to gain access to their personal account or to the online service(s) which use it.</p><p></p><p>10. Users must choose a password that cannot be guessed by a third party and meets the current security rules. These rules are available on the choose password screens. Users undertake to keep their password confidential.</p><p></p><p>11. The creation of a personal account requires the user to enter certain information, including their title, name, first name, postal adress and email adress</p><p></p><p>12. The user undertakes to advise the Digital Government Department hereinafter referred to as DAN, as the administrator of the personal account, of any unlawful use of this information immediately; the DAN cannot be held responsible for any damage which may be caused by the use of the user name and password by an unlawful third party.</p><p></p><p>13. The user must provide a valid email address when creating an account. This address is required and is used to confirm operations carried out by the user.</p><p></p><p>14. The DAN reserves the right to remove, without warning or compensation of any kind, any account which constitutes unlawful or fraudulent use or act which infringes human rights or more generally causes prejudice to the interests of third parties</p><p></p><p><strong>Access to online service </strong></p><p>15. By accepting the General Terms of Use, the user agrees that the information given in his or her account ${symbol_escape}u2013 title, last name, first name, postal address and e-mail address - may be used in connection with this online service.</p><p></p><p>16. The user undertakes to advise the Labour Inspectorate Service, of any unlawful use of this information immediately; the Labour Inspectorate Service cannot be held responsible for any damage which may be caused by the use of the user name and password by an unlawful third party.</p><p></p><p><strong>Technical constraints</strong></p><p>17. Use of the service requires an Internet connection and browser. The browser must be configured to allow session cookies. It must also be configured to allow pop-ups for the teleservice.gouv.mc website. The site is optimised for viewing with a screen resolution of 1024x768 pixels. To ensure that the application works properly, use of the following browser versions is recommended:</p><p>o&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Chrome </p><p>o&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Internet Explorer </p><p>Other common browsers (Safari, Firefox, Edge, etc.) are believed to be compatible with the online service, but the Government cannot guarantee optimal rendering.&nbsp;&nbsp;&nbsp;&nbsp;</p><p><strong>Data retention</strong></p><p></p><p><strong>Personal account</strong></p><p>18. Personal accounts which have not been used for more than 12 months will be automatically deleted. Users can also delete their accounts online at any time. In both cases, an email will warn the user that their account is being deleted. </p><p>The account deletion process allows all of a user${symbol_escape}u2019s personal data to be completely erased within 10 days.</p><p></p><p><strong>Data used in this online service</strong></p><p>19. An online service which have not been used for more than 48 months will be automatically deleted. Users can also delete this online service at any time. In both cases, an email will warn the user that their account is being deleted. </p><p>The account deletion process allows all of a user${symbol_escape}u2019s personal data to be completely erased within 10 days.</p><p></p><p><strong>Login data</strong></p><p>20. Certain login data is retained in order to prevent intrusion, and for the purposes of legal proceedings should the need arise. This data is retained for three months.</p><p></p><p><strong>Undertaking regarding the use of the online service and its content</strong></p><p></p><p>21. The user undertakes not to commit, on this online service, any unlawful act or toinfringe human rights or more generally to cause prejudice to third party interests.</p><p></p><p>These general terms of use prohibit any act which could tarnish the name and/or the image of the State of Monaco, or damage, overload, disable, discredit or compromise the online service.</p><p></p><p>In particular, the following are prohibited: the transmission by email or any other means of content whose purpose is to persecute, harass, defame, discriminate or abuse; or any other dissemination of information or opinion of a personal nature relating to one or more individuals, or infringing human rights, or causing harm to minors.</p><p></p><p>22. Correspondence must be courteous in nature at all times and comply with the basic rules of politeness.</p><p></p><p></p><p><strong>Responsibility</strong></p><p></p><p>23. The Labour Inspectorate Service gives no guarantee, implicit or explicit, regarding the operation and/or the content of the online service.</p><p></p><p>24. The Labour Inspectorate Service reserves the right to develop, modify or suspend the online service, without warning, for maintenance or any other reason it deems necessary.</p><p>Unavailability of the procedure does not entitle users to any compensation.</p><p></p><p>25. The Labour Inspectorate Service cannot be held</p><p>&nbsp;responsible for damage, direct or indirect, commercial or otherwise, which results from the use of the online service.</p><p></p><p>26. The Labour Inspectorate Service does not guarantee the continuity, accessibility or availability of the online service or related services.</p><p></p><p>27. The Labour Inspectorate Service accepts no responsibility for any viruses which may be imported during the process of downloading any of the elements of the application or from any sites which the Department may direct the user to via hypertext links.</p><p></p><p>28. These terms of use may also be amended at any time, without warning, in accordance with modifications made by The Labour Inspectorate Service, changes in legislation, or for any other reason deemed necessary. It is the responsibility of users to keep themselves informed of these terms. In accordance with Article 46 of the </p><p>Sovereign Ordinance no. 3.413 of 29 August 2011 concerning various measures pertaining to the relationship between the Government and its subjects, alinea 2, the terms of use of the online service which are enforceable against the user are those which are accessible electronically on the day that the user uses the said online service</p><p></p><p><strong>Protection of personal data</strong></p><p></p><p>29. In accordance with the provisions of Article 14 of the Act&nbsp;no. 1.165 of 23 December 1993 on personal data protection, personal data collection follows the following principles:</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</p><p><strong>Purpose of processing data</strong></p><p>30. In connection with the online service for requesting a subsidy for the purchase of a clean energy vehicle, the Labour Inspectorate Service processes personal information in order to:</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;Process requests for requesting an exemption to statutory public holidays</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;Enable users' requests to be dealt </p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;Ensure ease of login and navigation</p><p></p><p><strong>Mandatory nature of information requested or gathered</strong></p><p>31. The personal data collected via this online service is necessary, on the one hand, to use the application and, on the other hand, to be able to respond to any request or inquiry from the user.</p><p></p><p></p><p><strong>Identity of recipients</strong></p><p>32. The Labour Inspectorate Service undertakes not to commercialise the information provided by users via the online service in any way, nor to communicate it to third parties, except in cases where this is required by law.</p><p>Rights of access and rectification</p><p>33. In accordance with the provisions of Article 14 of the Act&nbsp;no. 1.165 of 23 December 1993 on personal data protection, persons affected by this procedure have a right of access to personal information concerning them, as well as the right to request the rectification, updating or removal of inaccurate, incomplete or outdated personal information concerning them.</p><p></p><p>34. Rights can be exercised with the: </p><p>Service de l${symbol_escape}u2019Inspection du Travail (Labour Inspectorate Service)</p><p>La Frégate</p><p>2, rue Princesse Antoinette</p><p>98000 Monaco </p><p>inspectiondutravail@gouv.mc</p><p></p><p>Phone : (+377) 98 98 87 26</p><p></p><p></p><p><strong>Security of applications</strong></p><p>35. The State of Monaco takes the appropriate physical, technical and administrative measures to ensure the security and confidentiality of personal data, particularly in order to protect such information from loss, accidental destruction, alteration or unlawful access.</p><p></p><p><strong>Approval from the Data Protection Authority of Monaco</strong></p><p></p><p>36. The online service for hiring domestic staff is currently being reviewed by the Commission Data Protection Authority of Monaco.</p><p></p><p><strong>Copyright</strong></p><p></p><p>37. All content ${symbol_escape}u2013 text, comments, titles, photographs, audio, images, data, drawings, animations with sound, video... reproduced in this online service, as well as the design, form and software are the property of the State of Monaco and are protected by existing legislation on copyright and on intangible rights more generally, in particular the provisions of the Act&nbsp;no. 491 of 24 November 1948 concerning the protection of literature and works of art.</p><p></p><p>38. Electronic copying only, for private use, of all or part of the oneline service or its elements, is authorised by the Department of the Environment, subject to no modifications being made to the original.</p><p></p><p>39. The Labour Inspectorate Service grants users of its online service the right to personal, specific and non-exclusive use of the online service. Reproduction, copying or use for any purpose other than those described above, and in particular the modification, dissemination or use for commercial or non-commercial purposes, constitutes a criminal offence punished by the Monaco Courts and Tribunals under Articles 21 to 28 of the Act&nbsp;no. 491 of 24 November 1948 concerning the protection of literature and works of art and&nbsp;article 26 of Criminal Code</p><p></p><p></p><p><strong>Trademarks</strong></p><p><strong>&nbsp;</strong></p><p>40. The Trademarks and/or logos belonging to the State of Monaco which appear within this online service are protected by the provisions of the law on intellectual property under the Act&nbsp;no. 1.058 of 10 June 1983 concerning trademarks, brand names or service marks. Any reproduction, in full or in part, without the authorisation of the owner, constitutes an offence punished by the Monaco Courts and Tribunals under Article 23 of the&nbsp;Act&nbsp;no. 1.058 of 10 June 1983 concerning trademarks, brand names or service marks and&nbsp;article 26 of Criminal Code.</p><p></p><p></p><p><strong>Hypertext links</strong></p><p></p><p>41. The creation of links to the online service is unrestricted. The Labour Inspectorate Service reserves the right to forbid any links whose purpose affects the smooth running or image of the service or the Administration. The online service may provide the user, and third parties, with links to other web sites or other Internet sources.</p><p></p><p></p><p>42. The Labour Inspectorate Service does not monitor these sites and cannot be held responsible, or take any responsibility for the content, advertising, products, services or any other material available on such third-party web sites.</p><p></p><p>43. The Labour Inspectorate Service cannot be held responsible for any damage or losses, whether actual or alleged, resulting from or connected with such use or from users placing their trust in the content of third-party web sites or in goods and services available on these third-party websites.</p><p></p><p>44. Under Articles 29 to 32 of the Act n°1.383 dated 02 August 2011 on Digital Economy, the user is responsible and bears all risks associated with using the content of the web site, particularly when relying upon the appropriateness, usefulness or completeness of such content.&nbsp;If a link leads the user to illicit content, in violation of the legislation in force, the user must cease viewing the site in question.</p><p></p><p>45. The Labour Inspectorate Service invites the user, in such a case, to inform it immediately, and to inform the competent authorities of any link to an illicit site.</p><p></p><p><strong>Forwarding information</strong></p><p></p><p>46.&nbsp;Any change in the status or circumstances of the user must be communicated and justified to the Labour Inspectorate Service by the user.</p><p></p><p></p><p></p><p><strong>False declaration</strong></p><p></p><p>47. The user solemnly declares that he/she is fully aware of the sanctions provided for in Article 98 of the Monaco Criminal Code in the event of a false declaration. These include a period of imprisonment of between three months and one year, and the fine laid down in point 2 of Article 26, or one or the other of these two penalties.</p><p></p><p><strong>Legislation</strong></p><p></p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;Articles 98,&nbsp;of&nbsp;the Monaco Criminal Code</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;Act n°1.383 dated 02 August 2011 on Digital Economy</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;Act&nbsp;no. 1.058 of 10 June 1983 concerning trademarks, brand names or service marks</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;Act&nbsp;no. 1.165 of 23 December 1993 on personal data protection</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;Act&nbsp;no. 491 of 24 November 1948 concerning the protection of literature and works of art</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;Sovereign Ordinance no. 3.413 of 29 August 2011 concerning various measures pertaining to the relationship between the Government and its subjects</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;Sovereign Ordinance no. 7.011 of 20 July 2018 establishing the Digital Government Department, published in the Journal de Monaco on 20 July 2018</p><p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;o&nbsp;&nbsp;&nbsp;Sovereign Ordinance no. 7.012 of 20 July 2018 establishing the Network and Information Technologies Department</p><p></p>'
