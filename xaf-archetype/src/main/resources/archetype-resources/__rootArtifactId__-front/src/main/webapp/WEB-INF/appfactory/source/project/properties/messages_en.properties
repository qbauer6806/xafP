ts.pageAbandonInscription.introHtml = '<p>You are about to exit the online service without completing your declaration.</p><p>We now invite you to participate in a <a class="ext_link" target="_blank" data-ng-href="{{properties[''mc.gouv.appfactory.gen.front.sondageAbandonUrl.en'']}}" title="Click here to access the survey" rel="noopener noreferrer">survey</a>.</p>'
ts.pageAbandonParcours.introHtml = '<p>You are about to exit the online service without completing your declaration.</p><p>We now invite you to participate in a <a class="ext_link" target="_blank" data-ng-href="{{properties[''mc.gouv.appfactory.gen.front.sondageAbandonUrl.en'']}}" title="Click here to access the survey" rel="noopener noreferrer">survey</a>.</p><p>You can also return to the online service <a href="menu.html">menu</a>.</p>'
ts.pageAccesTeleservice.acceptCGVHtml = '<span>I accept <a href="${symbol_pound}" data-ng-click="mcRuntimeCallAction(''mcCharteTsGoToCgu'', ${symbol_dollar}event)">the terms and conditions for use of the online service</a></span>'
