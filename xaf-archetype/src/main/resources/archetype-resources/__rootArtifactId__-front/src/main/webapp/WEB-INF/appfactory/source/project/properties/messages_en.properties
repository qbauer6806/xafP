ts.pageDesinscription.title = Unsubscribe from the online service
ts.pageErreur.introHtml = '<p>Due to a technical issue, we are unable to complete your request. Please accept our apologies and try again later.</p><p>You can return to the online service <a href="menu.html">menu</a>.</p>'
