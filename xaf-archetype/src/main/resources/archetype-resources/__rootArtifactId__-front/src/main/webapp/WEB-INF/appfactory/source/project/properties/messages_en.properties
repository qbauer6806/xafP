ts.pageDemarrer.contenuHtml = '<p>This online service allows you to submit an application for an exemption to statutory public holidays.</p><p></p><p>The principle and conditions of the online service are described in <a title="Open the procedure in a new window" data-ng-href="{{properties[&${symbol_pound}39;mc.gouv.appfactory.gen.front.ficheDemarcheUrl.en&${symbol_pound}39;]}}" class="ext_link" target="_blank">the procedure</a> on the Individuals section of the Public Services web pages.</p><p></p><p>Before you begin, make sure that you have at hand all of the documents you will need to attach in one of the following format: .doc, .docx, .rtf, .pdf, .jpg, .png and .tif.</p><p></p><p>To use this online service, you will need a personal account.&nbsp;You will need to create an account if you do not already have one.</p><p></p><p>Please also bring the following supporting document with you:</p><ul><li>The opinion of the staff representatives, if the size of your company''s workforce justifies the presence of such representatives</li><li>The opinion of the employees concerned, if the size of your company''s workforce does not justify the presence of staff representatives</li></ul><p></p><p>The steps in the online service are as follows: </p><ol><li>Information about the company</li><li>Information about the exemption application</li><li>Supporting document(s)</li><li>Summary</li></ol><p></p><p>As part of this online service, you will also be offered the opportunity to take part in an anonymous survey.</p>'
ts.pageDemarrer.title = 'Start page'
