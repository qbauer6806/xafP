ts.pageAccesTeleservice.introHtml = '<p>To access the service, you must accept the terms and conditions of use, which include the fact that personal information available through your account (for example, surname, first name, email address) will be used as part of the service</p>'
ts.pageAccesTeleservice.title = accessing the service
ts.pageAide.introHtml = '<h4>What should I do if I do not receive confirmation of receipt?</h4><pre>Following the declaration, confirmation of receipt will be sent to you electronically using the e-mail address of the account with which you are connected.${symbol_escape}nYou should check to see whether the e-mail appears in the spam section of your In Box.${symbol_escape}n Otherwise, please contact the XXXXXX Department.</pre><h4>What should I do if I encounter problems displaying pages?</h4><p>An Internet connection and browser are required to use this online service. The browser must be configured to allow session cookies and pop-up windows. The site is optimised for viewing with a screen resolution of 1024x768 pixels. To ensure that the application works properly, the following browser versions are recommended:</p><ul><li>Internet Explorer 10 or higher</li><li>Last version of Firefox</li><li>Last version of Chrome</li></ul><h4>How can I obtain information on this process?</h4><p>You can consult <a class="ext_link" target="_blank" data-ng-href="{{properties[''mc.gouv.appfactory.gen.front.ficheDemarcheUrl.en'']}}" title="Open the procedure in a new window" rel="noopener noreferrer">the procedure</a> on the Individuals section of the Public Services web pages.<p>'
ts.pageAide.title = Help
