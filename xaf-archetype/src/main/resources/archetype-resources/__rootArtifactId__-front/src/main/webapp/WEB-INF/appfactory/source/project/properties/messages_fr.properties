ts.pageDesinscription.introHtml1 = <pre>Vous êtes sur le point de vous désinscrire de ce téléservice.${symbol_escape}n</pre>
ts.pageDesinscription.introHtml2 = <pre>Votre compte usager sera dissocié de ce téléservice et toutes vos demandes en cours seront annulées.${symbol_escape}nVous n${symbol_escape}u2019aurez par ailleurs plus accès aux demandes effectuées jusqu${symbol_escape}u2019ici pour ce téléservice.${symbol_escape}n</pre>
ts.pageDesinscription.introHtml3 = <pre>Si vous souhaitez poursuivre, cochez la case ci-dessous et cliquez sur "Se désinscrire". Dans le cas contraire, quittez la page ou cliquez sur "Annuler".</pre>
