ts.pageDemarrer.contenuHtml = '<pre>La présente démarche en ligne vous permet de faire une demande de détachement de salariés à Monaco depuis la France ou l${symbol_escape}u2019Italie pour une durée inférieure ou égale à 3 mois.${symbol_escape}n${symbol_escape}nGrâce à la procédure de détachement, le salarié qui va, pendant une durée déterminée, travailler à Monaco pour le compte de votre entreprise, sera maintenu au régime français ou italien de sécurité sociale.&nbsp;${symbol_escape}n${symbol_escape}nLes entreprises, les artisans ou les&nbsp;sous-traitants qui ne sont pas établis à Monaco&nbsp;et&nbsp;qui souhaitent réaliser des travaux sur des chantiers publics ou privés doivent préalablement demander une autorisation de chantier&nbsp;auprès de la Direction de l${symbol_escape}u2019Expansion Économique (Cf. <a title="Ouvrir la fiche démarche pour demander une autorisation de chantier" href="https://service-public-entreprises.gouv.mc/En-cours-d-activite/Autorisations-ponctuelles/Interventions-ponctuelles-en-Principaute/Demander-une-autorisation-de-chantier" class="ext_link" target="_blank" rel="noopener noreferrer">la fiche démarche</a>).${symbol_escape}n&nbsp;${symbol_escape}nDans le cadre d${symbol_escape}u2019un détachement d${symbol_escape}u2019une durée supérieure à 3 mois, il convient de vous rapprocher du Service de l${symbol_escape}u2019Emploi afin de transmettre le dossier sous format papier. ${symbol_escape}nLe principe et les conditions de la démarche sont décrits dans <a title="Ouvrir la fiche démarche dans une nouvelle fenêtre" data-ng-href="{{properties[&${symbol_pound}39;mc.gouv.appfactory.gen.front.ficheDemarcheUrl.fr&${symbol_pound}39;]}}" class="ext_link" target="_blank" rel="noopener noreferrer">la fiche démarche</a> de l${symbol_escape}u2019Espace Entreprises du Service Public.${symbol_escape}n&nbsp;${symbol_escape}nCe téléservice ne s${symbol_escape}u2019adresse pas aux artisans autorisés à intervenir à titre personnel, sans détachement de salariés. Il vous est possible d${symbol_escape}u2019en informer le Service de l${symbol_escape}u2019Emploi par courrier, en précisant que vous intervenez seul, et en joignant à l${symbol_escape}u2019envoi une copie de l${symbol_escape}u2019autorisation de travaux délivrée par la Direction de l${symbol_escape}u2019Expansion Economique.${symbol_escape}n&nbsp;${symbol_escape}nPour les détachements de salariés dans le cadre d${symbol_escape}u2019un chantier, il vous sera demandé de fournir : </pre><ul><li>Une autorisation de chantier délivrée par la Direction de l${symbol_escape}u2019Expansion Economique.</li></ul><pre>Pour les sociétés italiennes uniquement,&nbsp;il vous sera demandé de fournir en plus : </pre><ul><li>Les pièces d${symbol_escape}u2019identité des salariés concernés (de nationalité italienne exclusivement).</li></ul><pre>Avant de démarrer, assurez-vous d${symbol_escape}u2019avoir à votre disposition toutes les pièces à joindre dans l${symbol_escape}u2019un des formats suivants : .doc, .docx, .xls, .xlsx, .rtf, .pdf, .zip, .gz, .7z, .jpg, .png et .tif.${symbol_escape}n&nbsp;${symbol_escape}nEnfin, l${symbol_escape}u2019utilisation de cette démarche en ligne nécessite de disposer d${symbol_escape}u2019un compte personnel que vous devrez créer si vous n${symbol_escape}u2019en possédez pas déjà un.${symbol_escape}nLes étapes sont les suivantes :</pre><ol><li>Informations sur l${symbol_escape}u2019entreprise d${symbol_escape}u2019origine</li><li>Informations sur le détachement</li><li>Informations sur les salariés à détacher</li><li>Pièces justificatives</li><li>Récapitulatif</li></ol><pre>Dans le cadre de cette démarche, vous avez également la possibilité de répondre anonymement à un sondage.</pre>'
ts.pageDemarrer.title = Démarrage
ts.pageDesinscription.acceptHtml = <span>J${symbol_escape}u2019ai pris connaissance des informations ci-dessus et souhaite me désinscrire de ce téléservice.</span>
