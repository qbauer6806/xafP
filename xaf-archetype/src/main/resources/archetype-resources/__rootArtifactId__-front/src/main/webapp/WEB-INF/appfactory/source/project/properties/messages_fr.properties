ts.pageAccesTeleservice.introHtml = '<p>Afin d${symbol_escape}u2019accéder à la démarche vous devez accepter les conditions générales d${symbol_escape}u2019utilisation qui prévoient notamment que les informations nominatives disponibles sur votre compte (exemples : Nom, Prénom, Adresse e-mail) soient utilisées dans le cadre de la démarche</p>'
ts.pageAccesTeleservice.title = Accès à la démarche
ts.pageAide.introHtml = '<h4>Que faire si je ne reçois pas d${symbol_escape}u2019accusé de réception ?</h4><pre>Lors de la demande, un accusé de réception vous est transmis par courriel à l${symbol_escape}u2019adresse e-mail du compte avec lequel vous vous êtes connecté(e).${symbol_escape}nIl convient de vérifier que ce courriel n${symbol_escape}u2019apparaît pas dans le courrier indésirable de votre messagerie.${symbol_escape}nA défaut, veuillez contacter le Service de l${symbol_escape}u2019Emploi.</pre><h4>Que faire si je rencontre des problèmes d${symbol_escape}u2019affichage ?</h4><pre>L${symbol_escape}u2019utilisation du service requiert une connexion et un navigateur Internet. Le navigateur doit être configuré pour autoriser les « cookies » de session. Il doit également être configuré afin d${symbol_escape}u2019autoriser l${symbol_escape}u2019ouverture de fenêtres pour le site "teleservice.gouv.mc". Le site est optimisé pour un affichage en 1024x768 pixels. Afin de garantir un bon fonctionnement du Service, il est conseillé d${symbol_escape}u2019utiliser les versions récentes de navigateurs suivants :${symbol_escape}no&nbsp;&nbsp;&nbsp;Chrome ${symbol_escape}no&nbsp;&nbsp;&nbsp;Internet Explorer ${symbol_escape}nLes autres navigateurs usuels (Safari, Firefox, Edge${symbol_escape}u2026) sont réputés compatibles avec le téléservice, mais l${symbol_escape}u2019Administration ne peut garantir un rendu optimal.</pre><h4>Comment obtenir des informations sur la démarche&nbsp;?</h4><p>Vous pouvez consulter la <a title="Ouvrir la fiche démarche dans une nouvelle fenêtre" data-ng-href="{{properties[&${symbol_pound}39;mc.gouv.appfactory.gen.front.ficheDemarcheUrl.fr&${symbol_pound}39;]}}" class="ext_link" target="_blank" rel="noopener noreferrer">fiche démarche</a> de l${symbol_escape}u2019Espace Entreprises du Service Public.</p>'
