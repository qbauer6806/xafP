ts.pageFinDemarche.introHtml = '<pre>Votre demande a bien été prise en compte.${symbol_escape}nVous allez recevoir un accusé de réception électronique transmis à votre adresse e-mail.</pre><p>Dans le cadre de cette démarche, nous vous invitons à participer à un <a title="Cliquez ici pour accéder au sondage" data-ng-href="{{properties[&${symbol_pound}39;mc.gouv.appfactory.gen.front.sondageUrl.fr&${symbol_pound}39;]}}" class="ext_link" target="_blank" rel="noopener noreferrer">sondage</a>.</p>'
