mcRuntimeConstants["mcCharteTshiPageConstantCaseToCamelCase"] = function(value) {
var exports = {};
exports["noCaseToCamelCase"] = function(value, noUnderscores) {
  if (typeof value != 'string') {
    return '';
  }
  var res = value.replace(/ (.)/g, function(m, p1, idx) {
    // les underscores permettent de se souvenir des espaces entre chiffres/lettres
    // car camelCase ne le permet pas normalement ex: a09 a09B0a du coup on met
    // les underscores là où on veut couper les lettres
    // " 09" -> "09"
    // "x 09" -> "x_09"
    // "9 a" -> "9_A"
    if (
      !noUnderscores &&
      idx > 0 &&
      (/^[0-9]+${symbol_dollar}/.test(p1) || /^[0-9]${symbol_dollar}/.test(value.substring(idx - 1, idx)))
    ) {
      return '_' + p1.toUpperCase();
    }
    return p1.toUpperCase();
  });
  if (!noUnderscores) {
    // traitement des cas restants (maintenant on a des majuscules qui se suivent)
    // "b a a" -> "bA_A"
    // "a a" -> "aA"
    return res.replace(/([A-Z])(?=[A-Z])/g, '${symbol_dollar}1_');
  }
  return res;
};
exports["constantCaseToNoCase"] = function(value) {
  if (typeof value != 'string') {
    return '';
  }
  return value.replace(/_/g, ' ').toLowerCase();
};
return (function(value) {
  return exports.noCaseToCamelCase(exports.constantCaseToNoCase(value));
})(value);
};

{symbol_escape}"noopener noreferrer${symbol_escape}">sondage</a>.</p><p>Vous pouvez également revenir au <a href=${symbol_escape}"menu.html${symbol_escape}">menu</a> du téléservice.</p>","ts.pageAccesTeleservice.acceptCGVHtml":"<span>J’accepte les <a href=${symbol_escape}"${symbol_escape}${symbol_escape}${symbol_pound}${symbol_escape}" data-ng-click=${symbol_escape}"mcRuntimeCallAction('mcCharteTsGoToCgu', ${symbol_dollar}event)${symbol_escape}">Conditions générales d’utilisation du téléservice.</a></span>","ts.pageAccesTeleservice.erreurAcceptCGV":"Vous devez accepter les conditions générales d’utilisation du téléservice.","ts.pageAccesTeleservice.introHtml":"<p>Afin d’accéder à la démarche vous devez accepter les conditions générales d’utilisation qui prévoient notamment que les informations nominatives disponibles sur votre compte (exemples : Nom, Prénom, Adresse e-mail) soient utilisées dans le cadre de la démarche</p>","ts.pageAccesTeleservice.title":"Accès à la démarche","ts.pageAide.introHtml":"<h4>Que faire si je ne reçois pas d’accusé de réception ?</h4><pre>Lors de la demande, un accusé de réception vous est transmis par courriel à l’adresse e-mail du compte avec lequel vous vous êtes connecté(e).${symbol_escape}nIl convient de vérifier que ce courriel n’apparaît pas dans le courrier indésirable de votre messagerie.${symbol_escape}nA défaut, veuillez contacter le Service de l’Emploi.</pre><h4>Que faire si je rencontre des problèmes d’affichage ?</h4><pre>L’utilisation du service requiert une connexion et un navigateur Internet. Le navigateur doit être configuré pour autoriser les « cookies » de session. Il doit également être configuré afin d’autoriser l’ouverture de fenêtres pour le site ${symbol_escape}"teleservice.gouv.mc${symbol_escape}". Le site est optimisé pour un affichage en 1024x768 pixels. Afin de garantir un bon fonctionnement du Service, il est conseillé d’utiliser les versions récentes de navigateurs suivants :${symbol_escape}no&nbsp;&nbsp;&nbsp;Chrome ${symbol_escape}no&nbsp;&nbsp;&nbsp;Internet Explorer ${symbol_escape}nLes autres navigateurs usuels (Safari, Firefox, Edge…) sont réputés compatibles avec le téléservice, mais l’Administration ne peut garantir un rendu optimal.</pre><h4>Comment obtenir des informations sur la démarche&nbsp;?</h4><p>Vous pouvez consulter la <a title=${symbol_escape}"Ouvrir la fiche démarche dans une nouvelle fenêtre${symbol_escape}" data-ng-href=${symbol_escape}"${symbol_escape}${symbol_escape}{${symbol_escape}${symbol_escape}{properties[&${symbol_escape}${symbol_escape}${symbol_pound}39;mc.gouv.appfactory.${artifactIdLower}.front.ficheDemarcheUrl.fr&${symbol_escape}${symbol_escape}${symbol_pound}39;]${symbol_escape}${symbol_escape}}${symbol_escape}${symbol_escape}}${symbol_escape}" class=${symbol_escape}"ext_link${symbol_escape}" target=${symbol_escape}"_blank${symbol_escape}" rel=${symbol_escape}"noopener noreferrer${symbol_escape}">fiche démarche</a> de l’Espace Entreprises du Service Public.</p>","ts.pageAide.title":"Aide","ts.pageAssocier.champIdentifiant":"Identifiant de la demande","ts.pageAssocier.champNom":"Raison sociale","ts.pageAssocier.erreurIdentifiant":"Cette demande n’a pas pu être trouvée ou n’a pas été faite hors téléservice","ts.pageAssocier.erreurNom":"La raison sociale est incorrect","ts.pageAssocier.introHtml":"<p>Veuillez renseigner les informations suivantes :</p>","ts.pageAssocier.title":"Identification de la demande","ts.pageDemandeCancel.introHtml":"<p>Vous êtes sur le point d’annuler votre demande.</p><p>Si vous êtes sûr(e), veuillez valider l’annulation de votre demande.</p><p>Un courriel de confirmation d’annulation vous sera transmis.</p>","ts.pageDemandeCancel.title":"Annulation de la demande","ts.pageDemandeEdit.sectionInfosDemande.title":"Informations demandées","ts.pageDemandeEdit.sectionReponse.champPj.erreurTaille":"Les fichiers supérieurs à 5Mo ne sont pas autorisés.","ts.pageDemandeEdit.sectionReponse.champPj.erreurType":"Les fichiers de ce type ne sont pas autorisés.","ts.pageDemandeEdit.sectionReponse.champReponse":"Réponses demandées","ts.pageDemandeEdit.sectionReponse.champReponse.erreurLongueur":"Vous pouvez saisir jusqu’à {p0} caractères.","ts.pageDemandeEdit.sectionReponse.intro":"Veuillez transmettre les informations demandées à l’aide des champs suivants","ts.pageDemandeEdit.sectionReponse.pjIntro":"Fichiers supplémentaires. Sélectionnez un fichier à partir de votre ordinateur : ","ts.pageDemandeEdit.sectionReponse.pjIntro.help":"Taille maximale 5 Mo, formats acceptés .doc, .docx, .rtf, .pdf, .jpg, .png et .tif.","ts.pageDemandeEdit.sectionReponse.title":"Votre réponse","ts.pageDemandeEdit.title":"Demande d’informations complémentaires","ts.pageDemandeEditRecap.sectionReponse.champFichiers":"Fichiers supplémentaires","ts.pageDemandeEditRecap.title":"Validation demandes d’informations complémentaires","ts.pageDemandeView.title":"Résumé de la demande","ts.pageDemandes.sectionDemandesNonEnAttente.title":"Mes demandes","ts.pageDemandes.title":"Mes demandes","ts.pageDemarrer.contenuHtml":"<pre>La présente démarche en ligne vous permet de faire une demande de détachement de salariés à Monaco depuis la France ou l’Italie pour une durée inférieure ou égale à 3 mois.${symbol_escape}n${symbol_escape}nGrâce à la procédure de détachement, le salarié qui va, pendant une durée déterminée, travailler à Monaco pour le compte de votre entreprise, sera maintenu au régime français ou italien de sécurité sociale.&nbsp;${symbol_escape}n${symbol_escape}nLes entreprises, les artisans ou les&nbsp;sous-traitants qui ne sont pas établis à Monaco&nbsp;et&nbsp;qui souhaitent réaliser des travaux sur des chantiers publics ou privés doivent préalablement demander une autorisation de chantier&nbsp;auprès de la Direction de l’Expansion Économique (Cf. <a title=${symbol_escape}"Ouvrir la fiche démarche pour demander une autorisation de chantier${symbol_escape}" href=${symbol_escape}"https://service-public-entreprises.gouv.mc/En-cours-d-activite/Autorisations-ponctuelles/Interventions-ponctuelles-en-Principaute/Demander-une-autorisation-de-chantier${symbol_escape}" class=${symbol_escape}"ext_link${symbol_escape}" target=${symbol_escape}"_blank${symbol_escape}" rel=${symbol_escape}"noopener noreferrer${symbol_escape}">la fiche démarche</a>).${symbol_escape}n&nbsp;${symbol_escape}nDans le cadre d’un détachement d’une durée supérieure à 3 mois, il convient de vous rapprocher du Service de l’Emploi afin de transmettre le dossier sous format papier. ${symbol_escape}nLe principe et les conditions de la démarche sont décrits dans <a title=${symbol_escape}"Ouvrir la fiche démarche dans une nouvelle fenêtre${symbol_escape}" data-ng-href=${symbol_escape}"${symbol_escape}${symbol_escape}{${symbol_escape}${symbol_escape}{properties[&${symbol_escape}${symbol_escape}${symbol_pound}39;mc.gouv.appfactory.${artifactIdLower}.front.ficheDemarcheUrl.fr&${symbol_escape}${symbol_escape}${symbol_pound}39;]${symbol_escape}${symbol_escape}}${symbol_escape}${symbol_escape}}${symbol_escape}" class=${symbol_escape}"ext_link${symbol_escape}" target=${symbol_escape}"_blank${symbol_escape}" rel=${symbol_escape}"noopener noreferrer${symbol_escape}">la fiche démarche</a> de l’Espace Entreprises du Service Public.${symbol_escape}n&nbsp;${symbol_escape}nCe téléservice ne s’adresse pas aux artisans autorisés à intervenir à titre personnel, sans détachement de salariés. Il vous est possible d’en informer le Service de l’Emploi par courrier, en précisant que vous intervenez seul, et en joignant à l’envoi une copie de l’autorisation de travaux délivrée par la Direction de l’Expansion Economique.${symbol_escape}n&nbsp;${symbol_escape}nPour les détachements de salariés dans le cadre d’un chantier, il vous sera demandé de fournir : </pre><ul><li>Une autorisation de chantier délivrée par la Direction de l’Expansion Economique.</li></ul><pre>Pour les sociétés italiennes uniquement,&nbsp;il vous sera demandé de fournir en plus : </pre><ul><li>Les pièces d’identité des salariés concernés (de nationalité italienne exclusivement).</li></ul><pre>Avant de démarrer, assurez-vous d’avoir à votre disposition toutes les pièces à joindre dans l’un des formats suivants : .doc, .docx, .xls, .xlsx, .rtf, .pdf, .zip, .gz, .7z, .jpg, .png et .tif.${symbol_escape}n&nbsp;${symbol_escape}nEnfin, l’utilisation de cette démarche en ligne nécessite de disposer d’un compte personnel que vous devrez créer si vous n’en possédez pas déjà un.${symbol_escape}nLes étapes sont les suivantes :</pre><ol><li>Informations sur l’entreprise d’origine</li><li>Informations sur le détachement</li><li>Informations sur les salariés à détacher</li><li>Pièces justificatives</li><li>Récapitulatif</li></ol><pre>Dans le cadre de cette démarche, vous avez également la possibilité de répondre anonymement à un sondage.</pre>","ts.pageDemarrer.title":"Démarrage","ts.pageDesinscription.acceptHtml":"<span>J’ai pris connaissance des informations ci-dessus et souhaite me désinscrire de ce téléservice.</span>","ts.pageDesinscription.boutonDesinscription":"Se désinscrire","ts.pageDesinscription.erreurAccept":"Vous devez cocher la case pour confirmer votre désinscription du téléservice.","ts.pageDesinscription.introHtml1":"<pre>Vous êtes sur le point de vous désinscrire de ce téléservice.${symbol_escape}n</pre>","ts.pageDesinscription.introHtml2":"<pre>Votre compte usager sera dissocié de ce téléservice et toutes vos demandes en cours seront annulées.${symbol_escape}nVous n’aurez par ailleurs plus accès aux demandes effectuées jusqu’ici pour ce téléservice.${symbol_escape}n</pre>","ts.pageDesinscription.introHtml3":"<pre>Si vous souhaitez poursuivre, cochez la case ci-dessous et cliquez sur ${symbol_escape}"Se désinscrire${symbol_escape}". Dans le cas contraire, quittez la page ou cliquez sur ${symbol_escape}"Annuler${symbol_escape}".</pre>","ts.pageDesinscription.title":"désinscription du téléservice","ts.pageErreur.introHtml":"<p>Suite à un problème technique, nous ne pouvons donner suite à votre requête. Nous vous prions de bien vouloir nous en excuser et vous invitons à essayer ultérieurement.</p><p>Vous pouvez revenir au <a href=${symbol_escape}"menu.html${symbol_escape}">menu</a> du téléservice.</p>","ts.pageErreur.title":"Erreur","ts.pageEtapeTest.sectionFiles.introHtml":"<p>Fichiers de la demande.</p>","ts.pageEtapeTest.sectionFiles.title":"Fichiers","ts.pageExpire.introHtml":"<p>Votre session a expiré.</p><p>Vous pouvez retourner à <a href=${symbol_escape}"${symbol_escape}${symbol_escape}${symbol_pound}${symbol_escape}" data-ng-click=${symbol_escape}"mcRuntimeCallAction('mcCharteTsLoginDoLogin', ${symbol_dollar}event)${symbol_escape}">la page d’accueil du téléservice</a>.</p>","ts.pageExpire.title":"Session expirée","ts.pageFinDemarche.boutonDeclarer":"Effectuer une autre demande","ts.pageFinDemarche.introHtml":"<pre>Votre demande a bien été prise en compte.${symbol_escape}nVous allez recevoir un accusé de réception électronique transmis à votre adresse e-mail.</pre><p>Dans le cadre de cette démarche, nous vous invitons à participer à un <a title=${symbol_escape}"Cliquez ici pour accéder au sondage${symbol_escape}" data-ng-href=${symbol_escape}"${symbol_escape}${symbol_escape}{${symbol_escape}${symbol_escape}{properties[&${symbol_escape}${symbol_escape}${symbol_pound}39;mc.gouv.appfactory.${artifactIdLower}.front.sondageUrl.fr&${symbol_escape}${symbol_escape}${symbol_pound}39;]${symbol_escape}${symbol_escape}}${symbol_escape}${symbol_escape}}${symbol_escape}" class=${symbol_escape}"ext_link${symbol_escape}" target=${symbol_escape}"_blank${symbol_escape}" rel=${symbol_escape}"noopener noreferrer${symbol_escape}">sondage</a>.</p>","ts.pageFinDemarche.title":"Démarche finalisée","ts.pageMenu.sectionDemandesEnAttente.title":"Demande(s) en attente d’informations complémentaires","ts.pageMenu.sectionDemandesNonEnAttente.aucuneDemande":"Vous n’avez fait aucune déclaration","ts.pageMenu.sectionDeman   function() {
    var filter = function(inputValue, choixAdditionnel) {
      if (choixAdditionnel) {
        var returnValue = {};
        if (typeof inputValue === 'string') {
          returnValue.valeur = inputValue;
          return returnValue;
        }
        if (typeof inputValue === 'number') {
          returnValue.valeur = '' + inputValue;
          return returnValue;
        }
        if (typeof inputValue === 'object') {
          if (!inputValue) {
            return returnValue;
          }
          if (typeof inputValue.valeur === 'undefined') {
            return returnValue;
          }
          returnValue.valeur = inputValue.valeur;
          if (typeof inputValue.valeurExtra != 'undefined') {
            returnValue.valeurExtra = inputValue.valeurExtra;
          }
          return returnValue;
        }
        return returnValue;
      } else {
        if (typeof inputValue === 'string') {
          return inputValue;
        }
        if (typeof inputValue === 'number') {
          return '' + inputValue;
        }
        if (typeof inputValue === 'object') {
          if (!inputValue) {
            return inputValue;
          }
          if (typeof inputValue.valeur != 'undefined') {
            return inputValue.valeur;
          }
        }
        return null;
      }
    };
    return filter;
  }
]);
