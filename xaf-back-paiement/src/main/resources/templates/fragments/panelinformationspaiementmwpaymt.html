<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
<div id="panelinformationspaiementmwpaymt" th:fragment="panelinformationspaiementmwpaymt" th:remove="tag">
  <div class="tab-pane" id="tab4" role="tabpanel">
    <div class="row">
      <div class="col-xs-6">
        <label>Statut de paiement : </label>&nbsp;
        <span th:class="'label statusbox ' + ${statutPaiementColor}"
              th:text="${statutPaiement}"></span>
      </div>
    </div>

    <div class="row" style="margin-top: 15px;">
      <!-- Montant -->
      <div style="margin-top: 1rem; width: 50%; margin-left: 15px;">
        <label th:if="${statutPaiementCode.name()} != 'DEBIT_REALISE'" for="montant">Montant de la demande :</label>
        <label th:if="${statutPaiementCode.name()} == 'DEBIT_REALISE'" for="montant">Montant débité :</label>
        <br>
        <input class="form-control" type="text" id="montant" th:value="${montantPaiement}" disabled="true" style="width: 100%;" />
      </div>

      <!-- Date de débit -->
      <div style="margin-top: 1rem; width: 50%; margin-left: 15px;">
        <label for="dateEmpreinte">Date de débit :</label>
        <br>
        <input class="form-control" type="text" id="dateEmpreinte" th:value="${datePaiement}" disabled="true" style="width: 100%;" />
      </div>

      <!-- Moyen de paiement -->
      <div style="margin-top: 1rem; width: 50%; margin-left: 15px;">
        <label for="moyenPaiement">Moyen de paiement :</label>
        <br>
        <input class="form-control" type="text" id="moyenPaiement" th:value="${moyenPaiement}" disabled="true" style="width: 100%;" />
      </div>
    </div>
    <hr>

    <h4 class="h4">HISTORIQUE DE PAIEMENT</h4>

    <div th:each="histo : ${paiementHisto}">
      <div th:if="${histo != null}">
        <span style="vertical-align: middle" th:class="'label statusbox ' + ${histo.getCouleur()}">&nbsp;</span>&nbsp;
        <span th:if="${histo.getDate() != null}" style="font-weight: bold"
              th:text="${histo.getDate().format(formatDate)}"></span>&nbsp;
        <span th:text="${histo.getContenu()}"></span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
