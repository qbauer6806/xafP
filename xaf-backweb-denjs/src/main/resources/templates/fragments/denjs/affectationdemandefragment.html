<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

	<div id="affectationdemandefragment"
		th:fragment="affectationdemandefragment">
		<div id="affecter-box" style="display: none">
			<form method="POST" id="affecterDemandeForm" th:action="@{/demandes/affecterEtablissement}+'?'+${_csrf.parameterName}+'='+${_csrf.token}"
			enctype="multipart/form-data">
				<div class="container-fluid">
					<div class="row">
						<div class="col-xs-12">
							<span style="color: rgb(94, 97, 100); font-size: 16pt">Affecter la demande</span>
						</div>
					</div>
					<br/>
					<div class="row">
						<div class="col-xs-12">
							<span style="color: rgb(94, 97, 100);">Veuillez sélectionner un établissement dans la liste ci-dessous pour affecter la demande :</span>
							<br />
							<br/>
							<input type="hidden" name="pkDemande" id="affecterPkDemande" th:value="${demandeDTO.pkDemandes}"/>
							<input type="hidden" name="activeTaskDefinitionKey" th:value="${activeTaskDefinitionKey}" />
		                    <select id="etablissementCode" required type="text" name="etablissementCode" class="form-control">
		                        <option th:value="aucun">
		                            Sélectionner un établissement
		                        </option>
	                        <option th:each="etablissement : ${etablissements}" th:value="${etablissement.code}" th:text="${etablissement.nom}">
	                        </option>
		                    </select>
						</div>
					</div>
					<br/>
					<div class="row">
						<div class="col-xs-12 text-center margin-top">
							<a href="#"
								class="btn btn-action-second ripple-effect transferer-annuler"
								style="margin-right: 10px">Annuler</a>
							<input id="affecter-button" type="submit" name="action" value="Valider" class="btn btn-action" />
						</div>
					</div>
				</div>
			</form>
		</div>
	</div>

</body>
</html>
