<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	class="no-js sidebar-left-collapsed" lang="fr" dir="ltr">

<head>
<meta charset="utf-8" />
<meta http-equiv="x-ua-compatible" content="ie=edge" />
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no" />
<title th:text="${AfBackUtils.getDemarcheNom()}"></title>

<!-- Import FONTS -->
<link th:href="@{/webjars/xcb-wlib/fonts/style.css}" rel="stylesheet" />
<link rel="stylesheet" th:href="@{/webjars/xcb-wlib/fonts/ie7/ie7.css}" />

<!-- Import CSS -->
<link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
	rel="stylesheet" type="text/css" />
<link th:href="@{/webjars/xcb-wlib/css/template.css}" rel="stylesheet" />
<link th:href="@{/webjars/xcb-wlib/css/sidebar.css}" rel="stylesheet" />
<link th:href="@{/webjars/xcb-wlib/css/element.css}" rel="stylesheet" />
<link th:href="@{/webjars/datatables/css/dataTables.bootstrap.css}"
	rel="stylesheet" />
<link
	th:href="@{/webjars/bootstrap-datepicker/css/bootstrap-datepicker.css}"
	rel="stylesheet" />

<link rel="shortcut icon" type="image/x-icon"
	th:href="@{/img/favicon.ico}" />
<link th:href="@{/css/tsgen.css(${applicationBuildTimestamp})}"
	rel="stylesheet" />
<link th:href="@{/css/tsdem.css(${applicationBuildTimestamp})}"
	rel="stylesheet" />
<link rel="stylesheet"
	th:href="@{/webjars/fancybox/jquery.fancybox.css}" />
</head>

<body th:with="pageDemandesActive='active'">

	<div th:replace="fragments/header :: header" />

	<div id="wrapper">

		<div th:replace="fragments/sidebar :: sidebar" />

		<!-- DEBUT CONTENU -->
		<div id="page-content-wrapper">

			<div class="breadcrumbContent">
				<div class="breadcrumb">
					<span> <a th:href="@{/}" class="breadcrumb-item active">ACCUEIL</a>&nbsp;&gt;&nbsp;
						<a th:href="@{/demandes}" class="breadcrumb-item active">DEMANDES</a>
						&gt;
					</span>
				</div>
				<div class="triangleTopright"></div>
			</div>

			<div class="container-fluid">
				<form id="rechercheForm">
					<div class="row">
						<div class="col-xs-12">
							<h1>Toutes les demandes</h1>


							<div class="panel panel-simple">
								<h4 class="titre">Recherche</h4>
								<div class="form-group">
									<label for="texteInput">Saisissez un terme ou une
										expression de recherche</label>
									<div class="row">
										<div class="col-xs-8">
											<input type="text" th:value="${texte}" name="texte"
												class="form-control" id="texteInput" title="" />
										</div>
										<div class="col-xs-4 nopadding">
											<button type="submit" class="btn btn-action ripple-effect"
												name="action" value="Rechercher" id="rechercherButton1">
												<i class="icon-action_chercher"></i>
											</button>
											<button class="btn btn-action ripple-effect greyTooltip"
												data-placement="right" data-html="true"
												data-original-title="<p style='text-align: left;'>Recherche d'une expression exacte:<br/> &quot;pierre étudiant&quot;<br/>Recherche intégrant un second terme:<br/>pierre +étudiant<br/>Recherche excluant un terme:<br/>pierre -étudiant</p>"
												data-toggle="tooltip">
												<i class="icon-menu_aide"></i>
											</button>
										</div>
									</div>

								</div>
								<div class="row">
									<div class="col-xs-12">

										<div class="panel-group accordion" aria-multiselectable="true">
											<div class="panel panel-default">
												<div class="panel-heading" role="tab" id="headingOne">
													<h4 class="panel-title">
														<a role="button" data-toggle="collapse"
															data-parent="#accordion" href="#collapseOne"
															aria-expanded="false" aria-controls="collapseOne"
															class="collapsed"> <i
															class="pannelState icon-action_accordeon-ferme"></i>
															Filtres
														</a>
													</h4>
												</div>
												<div id="collapseOne"
													class="sectionrecherche panel-collapse collapse"
													role="tabpanel" aria-labelledby="headingOne">
													<div class="panel-body">
														<h3>
															<div class="row">
																<div class="col-xs-12 col-md-10">
																	<span>Mode de réception</span>
																</div>
																<div class="col-xs-12 col-md-2">
																	<a id="tousModeTr" href="#"><span>TOUS</span></a><span>
																		/ </span><a id="aucunModeTr" href="#"><span>AUCUN</span></a>
																</div>
															</div>
														</h3>
														<div class="row">
															<div class="col-xs-12 col-md-3">
																<div class="toggle">
																	<label class="switch"> <input
																		class="switch-input" id="switchTS" type="checkbox"
																		checked="" name="canal" value="GUICHET_VIRTUEL" /> <input
																		type="hidden" checked="" /> <span class="slider"></span>
																	</label> <label class="toggleLabel">Téléservice</label>

																</div>
															</div>

															<div class="col-xs-12 col-md-3">
																<div class="toggle">
																	<label class="switch"> <input
																		class="switch-input" id="switchGuichet"
																		type="checkbox" checked="" name="canal"
																		value="GUICHET_PHYSIQUE" /> <input type="hidden"
																		checked="" /> <span class="slider"></span>
																	</label> <label class="toggleLabel">Au guichet</label>
																</div>
															</div>

															<div class="col-xs-12 col-md-3">
																<div class="toggle">
																	<label class="switch"> <input
																		class="switch-input" id="switchCourrier"
																		type="checkbox" checked="" name="canal"
																		value="COURRIER" /> <input type="hidden" checked="" />
																		<span class="slider"></span>
																	</label> <label class="toggleLabel">Par courrier</label>
																</div>
															</div>
														</div>

														<br />
														<h3>
															<div class="row">
																<div class="col-xs-12 col-md-10">
																	<span>Etat de la demande</span>
																</div>
																<div class="col-xs-12 col-md-2">
																	<a id="tousEtat" href="#"><span>TOUS</span></a><span>
																		/ </span><a id="aucunEtat" href="#"><span>AUCUN</span></a>
																</div>
															</div>
														</h3>

														<div>
															<div class="row">
																<div class="col-xs-12 col-md-3"
																	th:each="statut,iter: ${statuts}"
																	th:style="${iter.index}>
																	3? 'margin-top:1em': ''">
																	<div class="toggle">
																		<label class="switch"> <input
																			class="switch-input" id="switchEnAttTrait"
																			type="checkbox" checked="" name="statut"
																			th:value="${statut.key}" /> <input type="hidden"
																			checked="" /> <span class="slider"></span>
																		</label> <label class="toggleLabel" th:text="${statut.value}"></label>
																	</div>
																</div>
															</div>


														</div>


														<br />
														<div class="row text-center">
															<div class="form-inline  ">
																<div class="form-group">
																	<label for="agentId">Responsable</label> <select
																		style="margin-left: 1em" name="agentId" id="agentId"
																		class="form-control">
																		<option th:value="null" th:text="Tous" />
																		<option th:each="agent : ${agentsInit}"
																			th:text="${agent.displayName}"
																			th:value="${agent.matricule}" />
																	</select>
																</div>

																<div class="form-group" style="margin-left: 2em">
																	<label for="creationStartDate">Après le</label>
																	<div class="input-group date" style="margin-left: 1em">
																		<input type="text" id="creationStartDate"
																			name="creationStartDate" placeholder="__/__/____"
																			class="form-control" /> <span
																			class="input-group-addon"><i
																			class="icon-action_calendrier"></i></span>
																	</div>
																</div>
																<div class="form-group" style="margin-left: 2em">
																	<label for="creationEndDate">AVANT LE</label>
																	<div class="input-group date" style="margin-left: 1em">
																		<input type="text" id="creationEndDate"
																			name="creationEndDate" placeholder="__/__/____"
																			class="form-control" /> <span
																			class="input-group-addon"><i
																			class="icon-action_calendrier"></i></span>
																	</div>
																</div>
															</div>
														</div>

														<br />

														<div class="row">
															<div class="col-xs-12 text-center">
																<a id="rechercherButton2"
																	class="btn btn-action ripple-effect">Appliquer le
																	filtre</a>
															</div>
														</div>

													</div>
												</div>
											</div>
										</div>

									</div>
								</div>

								<div class="row" id="affinerDiv" style='display: none'>
									<div class="col-xs-12">

										<div class="panel-group accordion" aria-multiselectable="true">
											<div class="panel panel-default">
												<div class="panel-heading" role="tab" id="headingOne">
													<h4 class="panel-title">
														<a role="button" data-toggle="collapse" id="affinerLink"
															data-parent="#accordion" href="#collapseAffiner"
															aria-expanded="false" aria-controls="collapseOne"
															class="collapsed"> <i
															class="pannelState icon-action_accordeon-ferme"></i>
															Affiner
														</a>
													</h4>
												</div>
												<div id="collapseAffiner"
													class="sectionrecherche panel-collapse collapse"
													role="tabpanel" aria-labelledby="headingOne">
													<div class="panel-body">


														<div>

															<div id="facets">
																<div id="facetCategory" style='display: none'
																	class="col-xs-12 col-sm-2">
																	<h2 id="facetCategoryName">category</h2>
																	<div id="facet"
																		style='display: none; margin-bottom: 0.5em'>
																		<a href="javascript:;" class="greyTooltip"
																			data-toggle="tooltip" id="facetLink"><span
																			id="facetName">name </span><span class="badge"
																			id="facetSize">size</span></a>
																	</div>
																</div>
															</div>

															<div id="rechercheavancee"
																style="padding-left: 3em; padding-top: 1em;"></div>


														</div>

													</div>
												</div>
											</div>
										</div>

									</div>
								</div>
							</div>



						</div>
					</div>
				</form>

				<div class="row">
					<div class="col-xs-12">
						<div th:insert="demandes/demandetable"></div>


					</div>
				</div>

			</div>

		</div>

		<!-- FIN CONTENU -->

	</div>

	<script type="text/javascript"
		th:src="@{/recherchedynamicjs/dynamicjs.js}"></script>
	<div th:replace="fragments/footer :: footer"></div>

	<script type="text/javascript" th:inline="javascript">
	/*<![CDATA[*/
	
	
	
	
	
		var buildFacetsSerachData = function(params) {
			if (params === undefined) {
				params = {}
			}
	
			var rechercheParams = $("#rechercheForm").serializeArray();
	
			$.each(rechercheParams, function(i, o) {
				var n = o.name,
					v = o.value;
	
				if (v !== '') {
	
					params[n] = params[n] === undefined ? v : $
						.isArray(params[n]) ? params[n].concat(v) : [
						params[n], v ];
				}
	
			});
	
			return params
		}
	
		var buildSearchDatafunction = function(params) {
	
			//Ajout des champs de recherche
			self.buildFacetsSerachData(params)
	
			//Suppression de toutes les valeurs renvoyées par datatable
			params.columns = null;
			params.search = null;
			params.searchFields = APP.selectedField
	
			//conversion des params pour Pageable Spring MVC
			params.size = params.length;
			params.page = params.start / params.length;
			
			if($("input[name='canal']:checked").length==0)
			{
				params.aucunCanal=true;
			}
	
			if($("input[name='statut']:checked").length==0)
			{
				params.aucunStatut=true;
			}
	
	
			var col = columns[params.order[0].column]
			if (col.data !== "highlightedField") {
				var keyword = ""
				if (col.keyword)
					keyword = ".keyword"
				params.sort = columns[params.order[0].column].data + keyword + ","
				+ params.order[0].dir;
			}
	
		}
	
	
		var self = this
		self.buildFacetsSerachData = buildFacetsSerachData
		self.buildSearchDatafunction = buildSearchDatafunction
		self.facets = {}
	
	
	
		$(document).ready(function() {
	
	
	
			// Sélection d'une date dans un calendrier
			$('#creationStartDate, #creationEndDate').datepicker({
				format : "dd/mm/yyyy",
				weekStart : 1,
				language : "fr",
				todayHighlight : true
			});
	
			$('.input-group-addon').click(function() {
				var $input = $(this).closest('div').find(':input');
				$input.focus();
			});
	
			$('#rechercherButton1').click(function(e) {
				e.preventDefault();
				$('#rechercherButton2').click();
			});
	
			$('#rechercheButton1, #rechercherButton2').click(function(e) {
				APP.selectedField = null
				$('#datatable-demandes').DataTable().ajax.reload(null, true);
				APP.buildFacets()
			});
	
	
			if ($("#texteInput").val() !== '') {
				APP.buildFacets()
			}
	
	
			configurationDataTable.ajax.data = buildSearchDatafunction;
	
			if(typeof searchDefaultSort !== 'undefined' )
			{
				configurationDataTable.order = searchDefaultSort;	
			}
			var table = $('#datatable-demandes').DataTable(configurationDataTable);
	
			$('#tousModeTr').click(function(e) {
				e.preventDefault();
				$("input[name='canal']").prop('checked', true);
			});
	
			$('#aucunModeTr').click(function(e) {
				e.preventDefault();
				$("input[name='canal']").prop('checked', false);
			});
	
			$('#tousEtat').click(function(e) {
				e.preventDefault();
				$("input[name='statut']").prop('checked', true);
			});
	
			$('#aucunEtat').click(function(e) {
				e.preventDefault();
				$("input[name='statut']").prop('checked', false);
			});
	
	
		});
	
	
		$("body").tooltip({
			selector : '[data-toggle=tooltip]'
		}).tooltip();
	
		/*]]>*/
	</script>
</body>
</html>
