<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div id="panelfichiersjointstypedoc" th:fragment="panelfichiersjointstypedoc" th:remove="tag">
    <div class="tab-pane" id="tab2" role="tabpanel">
        <form action="#" method="post" th:action="@{/demandes/typageDocuments}">
            <div th:each="cat : ${categories}">

                <div class="row">
                    <div class="col-xs-9">
                        <h3 th:text="${cat.name}"></h3>
                    </div>
                    <div class="dropdown col-xs-3 text-right" style="padding: 0"
                         th:if="${cat.name == 'Fichiers de la demande initiale'}">
                        <button class="btn btn-action dropdown-toggle" data-toggle="dropdown" type="button">Télécharger
                            <span class="icon-action_accordeon-ouvert"></span>
                        </button>
                        <div aria-labelledby="dropdownMenuButton" class="dropdown-menu dropdown-menu-custom">
                            <a class="dropdown-item dropdown-item-custom" id="allDownloadButton">Tous les documents</a>
                            <a class="dropdown-item dropdown-item-custom"
                               id="validesDownloadButton"
                               th:classappend="!${isDocumentsValidesActif} ? disabled : enable">Les
                                documents valides</a>
                        </div>
                    </div>
                </div>

                <div class="row" th:if="${cat.subCategories == null}">
                    <div th:replace="fragments/panelfichiersjointstypedoctable :: panelfichiersjointstypedoctable"></div>
                </div>
                <div class="row" th:if="${cat.subCategories != null} and ${cat.subCategories.size() > 0}">
                    <!-- Affichage des sous-sections éventuelles -->
                    <div class="tab-pane" role="tabpanel" th:each="subcat,iter : ${cat.subCategories}"
                         th:id="'subcats'+${iter.index}">
                        <div aria-multiselectable="true" class="panel-group subcataccordion">
                            <div class="panel panel-default">
                                <div class="panel-heading" role="tab" th:id="'heading' + ${iter.index}">
                                    <h4 class="panel-title">
                                        <a aria-expanded="false" class="collapsed" data-parent="#subcataccordion" data-toggle="collapse"
                                           role="button"
                                           th:attr="aria-controls='subcat'+${iter.index}"
                                           th:href="${'#subcat'+iter.index}"><i
                                                class="pannelState icon-action_accordeon-ferme"></i><span
                                                th:text="${subcat.name}"></span>
                                        </a>
                                    </h4>
                                </div>

                                <div class="panel-body sectionic panel-collapse collapse"
                                     role="tabpanel"
                                     th:attr="aria-labelledby='heading' + ${iter.index}"
                                     th:id="${'subcat'+iter.index}">
                                    <!-- On appelle le tableau sous forme de fragment, en lui passant en paramètre la sous-catégorie -->
                                    <div th:replace="fragments/panelfichiersjointstypedoctable :: panelfichiersjointstypedoctable(cat=${subcat})"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div th:if="${cat.name} == 'Fichiers de la demande initiale' and ${editionTypedocActive} and (${cat.files.size() > 0} or (${cat.subCategories != null} and ${cat.subCategories.size() > 0}))">
                    <input class="btn btn-action ripple-effect" disabled="disabled" id="typedoc-files-button"
                           style="float: right;" type="button"
                           value="Enregistrer les types de fichiers de la demande initiale">
                </div>
                <div th:if="${cat.name} == 'Fichiers complémentaires de l\'usager' and ${editionTypedocActive} and ${cat.files.size() > 0}">
                    <input class="btn btn-action ripple-effect" disabled="disabled" id="typedoc-complements-button"
                           style="float: right;" type="button"
                           value="Enregistrer les types de fichiers complémentaires">
                </div>
                <br/>
            </div>
            <input id="typedoc-files" th:field="${typedocFormBean.files}" type="hidden"/>
            <input id="typedoc-complements" th:field="${typedocFormBean.complements}" type="hidden"/>
            <input name="pkDemande" th:value="${demandeDTO.pkDemandes}" type="hidden"/>
            <input id="confirmer-typedoc-button" style="display: none" type="submit"/>
        </form>
    </div>
</div>
</body>
</html>
