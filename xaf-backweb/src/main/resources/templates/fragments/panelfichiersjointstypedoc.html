<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div id="panelfichiersjointstypedoc" th:fragment="panelfichiersjointstypedoc" th:remove="tag">
    <div class="tab-pane" id="tab2" role="tabpanel">
        <form action="#" method="post" th:action="@{/demandes/typageDocuments}">
            <div th:each="cat : ${categories}">
            <div class="row">
                <div class="col-xs-12">
                <div class="col-xs-5">
                	<h3 th:text="${cat.name}"></h3>
                </div>
                <div th:if="${cat.name == 'Fichiers de la demande initiale'}" class="col-xs-7 text-right">
					<select id="fileToDownload" name="fileToDownload" class="btn btn-action ripple-effect">
						<option value="defaultValue">Télécharger</option>
						<option value="all">Tous les documents</option>
						<option value="valides" th:disabled="!${isDocumentsValidesActif}">Les documents valides</option>
					</select>
			     </div>
			     </div>
			     </div>
                <!-- Affichage des sous-sections éventuelles -->
                <div th:if="${cat.subCategories.size() > 0}" role="tabpanel" class="tab-pane" th:id="'subcats'+${iter.index}" th:each="subcat,iter : ${cat.subCategories}">
                	<div class="panel-group subcataccordion" aria-multiselectable="true">
						<div class="panel panel-default">
							<div class="panel-heading" role="tab"
								th:id="'heading' + ${iter.index}">
								<h4 class="panel-title">
									<a role="button" data-toggle="collapse" class="collapsed" aria-expanded="false"
										data-parent="#subcataccordion"
										th:attr="aria-controls='subcat'+${iter.index}"
										th:href="${'#subcat'+iter.index}"><i
										class="pannelState icon-action_accordeon-ferme"></i><span
										th:text="${subcat.name}"></span>
									</a>
								</h4>
							</div>
	
							<div th:id="${'subcat'+iter.index}"
								class="panel-body sectionic panel-collapse collapse"
								role="tabpanel"
								th:attr="aria-labelledby='heading' + ${iter.index}">
								<!-- On appelle le tableau sous forme de fragment, en lui passant en paramètre la sous-catégorie -->
								<div th:replace="fragments/panelfichiersjointstypedoctable :: panelfichiersjointstypedoctable(cat=${subcat})"></div>
							</div>
						</div>
					</div>
            	</div>
            	
            	<div th:if="${cat.subCategories == null}">
            		<div th:replace="fragments/panelfichiersjointstypedoctable :: panelfichiersjointstypedoctable"></div>
            	</div>

                <div th:if="${cat.name} == 'Fichiers de la demande initiale' and ${editionTypedocActive} and (${cat.files.size() > 0} or ${cat.subCategories.size() > 0})">
                    <input class="btn btn-action ripple-effect" id="typedoc-files-button" type="button"
                    value="Enregistrer les types de fichiers de la demande initiale" style="float: right;" disabled="disabled">
                </div>
                <div th:if="${cat.name} == 'Fichiers complémentaires de l\'usager' and ${editionTypedocActive} and ${cat.files.size() > 0}">
                    <input class="btn btn-action ripple-effect" id="typedoc-complements-button" type="button"
                    value="Enregistrer les types de fichiers complémentaires" style="float: right;" disabled="disabled">
                </div>
                <br/>
            </div>
            <input id="typedoc-files" th:field="${typedocFormBean.files}" type="hidden"/>
            <input id="typedoc-complements" th:field="${typedocFormBean.complements}" type="hidden"/>
            <input name="pkDemande" th:value="${demandeDTO.pkDemandes}" type="hidden"/>
            <input id="confirmer-typedoc-button" style="display: none" type="submit"/>
        </form>
    </div>
</div>
</body>
</html>
