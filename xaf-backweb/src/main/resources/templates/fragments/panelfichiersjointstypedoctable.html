<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"
          type="text/javascript"></script>
</head>
<body>

<div id="panelfichiersjointstypedoctable" th:fragment="panelfichiersjointstypedoctable"
     th:remove="tag">
  <table class="table table-striped datatablefichiers fixed-layout" id="datatable-fichiers">
    <thead>
    <tr>
      <th th:class="${cat.typedoc} ? 'file-name-col-small' : 'file-name-col'">Nom du fichier</th>
      <th class="date-col">Date</th>
      <th class="typedoc-col nosort" th:if="${cat.typedoc}">Type</th>
      <th class="action-col nosort">Actions</th>
      <th class="check-col nosort" th:if="${cat.typedoc}">Statut</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="file : ${cat.files}"
        th:classappend="${file.verification} and ${file.typedoc} != null and ${file.typedoc} != '' ? (${AfBackUtils.isTypedocApplicable(file.typedoc)} ? 'valid-background' : 'non-applicable-background') : ''">
      <td th:class="${cat.typedoc} ? 'file-name-col-small' : 'file-name-col'" th:text="${file.name}"
          th:title="${file.name}"></td>
      <td class="date-col" th:text="${#dates.format(file.date, 'dd/MM/yyyy HH:mm')}"></td>
      <td class="typedoc-col" th:if="${cat.typedoc}">
        <select class="form-control" onchange="updateTypedocJSON(this)"
                th:disabled="!${editionTypedocActive}"
                th:id="${file.compFile} ? comp + ${file.pkDemandesComplementsFiles} : file + ${file.pkDemandesFiles}">
          <option th:value="null" title="Sélectionnez un type">Sélectionnez un type</option>
          <option th:each="typedoc : ${typedocList}"
                  th:id="typedoc + ${file.pkDemandesFiles}"
                  th:selected="${file.typedoc} == ${typedoc.key}" th:text="${typedoc.value}"
                  th:title="${typedoc.value}"
                  th:value="${typedoc.key}">

          </option>
          <script th:inline="javascript">
            /*<![CDATA[*/
            var idToUpdate = /*[[${file.compFile} ? comp + ${file.pkDemandesComplementsFiles} : file + ${file.pkDemandesFiles}]]*/
            var idToUpdateObj = document.getElementById(idToUpdate);
            var selectedOptionText = idToUpdateObj.options[idToUpdateObj.selectedIndex].title
            document.getElementById(idToUpdate).title = selectedOptionText;
            /*]]>*/
          </script>
        </select>
      </td>
      <td class="action-col">
        <div class="bouton-action">
          <a class="nopadding" th:href="@{/ws/file/get}+${#uris.escapePath(file.url)}">
            <button class="btn btn-action ripple-effect greyTooltip"
                    data-original-title="Télécharger"
                    data-placement="bottom"
                    data-toggle="tooltip" title="" type="button">
              <i class="icon-action_pdf"></i>
            </button>
          </a>
        </div>
        <div class="bouton-action">
          <a class="nopadding" id="popup" th:value="@{/ws/file/get/apercu}+${#uris.escapePath(file.url)}">
            <button class="btn btn-action ripple-effect greyTooltip" data-placement="bottom"
                    data-toggle="tooltip"
                    onclick="setCurrentPopup(this)" th:data-original-title="Prévisualiser"
                    th:disabled="!(${#strings.endsWith(#strings.toLowerCase(file.url),'.pdf')} or ${#strings.endsWith(#strings.toLowerCase(file.url),'.png')} or ${#strings.endsWith(#strings.toLowerCase(file.url),'.jpg')} or ${#strings.endsWith(#strings.toLowerCase(file.url),'.jpeg')})"
                    th:id="${file.compFile} ? previewButton + ${file.pkDemandesComplementsFiles} : previewButton + ${file.pkDemandesFiles}"
                    title=""
                    type="button">
              <i class="icon-action_voir"></i>
            </button>
          </a>
        </div>
      </td>
      <td class="check-col" th:if="${cat.typedoc}">
        <div class="form-group">
          <div class="checkbox-custom checkbox-default">
            <input type="checkbox" th:checked="${file.verification}"
                   th:id="${file.compFile} ? 'compCheckbox' + ${file.pkDemandesComplementsFiles} : 'fileCheckbox' + ${file.pkDemandesFiles}"
                   th:disabled="!${editionTypedocActive}" onchange="updateCheckboxJSON(this)"/>
            <label
                th:for="${file.compFile} ? 'compCheckbox' + ${file.pkDemandesComplementsFiles} : 'fileCheckbox' + ${file.pkDemandesFiles}"
                th:id="'checklabel' + (${file.compFile} ? ${file.pkDemandesComplementsFiles} : ${file.pkDemandesFiles})">Vérifié</label>
          </div>
        </div>
      </td>
    </tr>
    </tbody>
  </table>
</div>
</body>

</html>
