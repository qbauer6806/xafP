<div class="col-xs-12" th:fragment="rectification">
  <form method="POST"
        th:action="@{/rectification/repondre}">
    <div class="row">
      <div id="commentaireReponseFormGroup"
           class="col-xs-12 form-group">
												<span class="titre">Répondre à la demande de rectification à la place de l'usager</span>
        <textarea id="commentaireReponse"
                  class="form-control greyTooltip" name="commentaireReponse"
                  oninput="checkInfoComplFormValidity()"
                  data-toggle="tooltip" data-placement="bottom"
                  title="Commentaire limité à 1500 caractères"
                  th:disabled="!${#authorization.expression('hasRole(''ROLE_TRAITEMENT'')')}"></textarea>
      </div>
    </div>

    <div class="row mt-15">
      <div class="col-xs-6 text-left">
        <input type="hidden" name="pkDemande"
               th:value="${demandeDTO.pkDemandes}"/> <input
          type="hidden" name="activeTaskDefinitionKey"
          th:value="${activeTaskDefinitionKey}"/> <a
          class="btn btn-action-second ripple-effect"
          id="annulerDemande" th:disabled="!${isAnnulationActive}">
        Annuler la demande</a>
      </div>
      <div class="col-xs-6 text-right">
        <input type="submit" value="Envoyer"
               class="btn btn-action ripple-effect"
               id="envoyer-button"
               th:disabled="!${#authorization.expression('hasRole(''ROLE_TRAITEMENT'')')}"/>
        <input type="hidden" name="icId" th:value="${icId}"/>
      </div>
    </div>
  </form>
</div>
