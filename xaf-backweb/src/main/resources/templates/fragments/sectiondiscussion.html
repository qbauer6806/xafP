<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
	<div id="sectiondiscussion" th:fragment="sectiondiscussion"
		th:remove="tag">
		<div class="col-xs-12">
			<form id="discussion-demande" action="#"
				th:action="@{/demandes/commentaires}" method="post">
				<div class="panel-group accordion" role="tablist"
					aria-multiselectable="true">
					<div class="panel panel-default">
						<div class="panel-heading" role="tab" id="heading5">
							<h4 class="panel-title">
								<a role="button" data-toggle="collapse"
									data-parent="#accordion5" href="#collapse5"
									aria-controls="collapse5"
									th:attr="aria-expanded=true">
									<i class="pannelState icon-action_accordeon-ouvert"></i>
									Discussion administration
								</a>
							</h4>
						</div>
						<div id="collapse5" class="panel-collapse collapse in"
							role="tabpanel" aria-labelledby="heading5">
							<div class="panel-body">
								<div class="row">
									<div class="col-xs-12">

										<div id="commentairesInternes" class="container-fluid"
											style="padding: 2px; margin-bottom: 10px; overflow-y: scroll; height: 250px; border-top: 1px solid rgb(28, 142, 172); border-bottom: 1px solid rgb(28, 142, 172);">

											<div class="row" th:each="comm : ${commInternes}">

												<div th:if="comm != null" class="col-xs-12"
													style="background-color: #ffffff; line-height: 1em">
													<div th:if="comm.date != null"
														th:text="${#dates.format(comm.date,'dd/MM/yyyy HH:mm:ss')}"
														style="font-size: 0.8em; font-weight: bold; color: rgb(94, 97, 100);"></div>
													<div style="font-weight: bold;"
														th:if="comm.agentId != null"
														th:text="${AfBackUtils.getUserNameFromID(comm.agentId)}"></div>
													<div th:unless="comm.agentId != null"
														style="font-weight: bold; color: red;">Erreur dans
														la récupération des informations du commentaire...</div>
													<div th:if="comm.commentaire != null"
														th:text="${comm.commentaire}" style="margin: 5px 0 8px 0;"></div>
												</div>

												<div th:unless="comm != null" class="col-xs-12"
													style="background-color: #ffffff; line-height: 1em">
													<div style="font-weight: bold; color: red;">Erreur
														dans la récupération du commentaire...</div>
												</div>

											</div>


										</div>



										<div class="row">
											<div id="com-interne-inputFormGroup"
												class="col-xs-12 form-group">
												<label for="com-interne-input">AJOUTER UN
													COMMENTAIRE</label>
												<textarea class="form-control greyTooltip"
													oninput="checkCommentaireDiscussionValidity()"
													data-toggle="tooltip" data-placement="bottom"
													title="Commentaire limité à 140 caractères"
													th:field="${xafTraitementFormBean.commentaireInterne}"
													id="com-interne-input"
													th:disabled="!${isDiscussionPanelActive}"></textarea>
											</div>

										</div>
										<div class="row mt-15">
											<div class="col-xs-12 text-right">
												<input type="hidden" name="pkDemande"
													th:value="${demandeDTO.pkDemandes}" /> <input
													type="submit" name="action" value="Publier"
													class="btn btn-action ripple-effect"
													id="envoyer-commentaire-button"
													th:disabled="!${isDiscussionPanelActive}" />
											</div>

										</div>

									</div>
								</div>

							</div>
						</div>
					</div>
				</div>
			</form>
		</div>
	</div>
</body>
</html>
