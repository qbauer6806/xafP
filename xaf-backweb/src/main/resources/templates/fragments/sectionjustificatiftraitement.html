<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div id="sectionjustificatiftraitement" th:fragment="sectionjustificatiftraitement" th:remove="tag">

    <hr/>

    <h3>Justification du traitement de la demande</h3>

    <div th:each="justificatifTraitement : ${justificatifTraitementList}">
        <p><strong th:utext="${justificatifTraitement.historique}"></strong></p>
        <p th:text="${justificatifTraitement.justification}"></p>
    </div>

    <hr/>

</div>
</body>
</html>
