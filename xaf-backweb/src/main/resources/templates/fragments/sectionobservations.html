<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

	<div id="sectionobservations" th:fragment="sectionobservations"
		th:remove="tag">
		<div class="row mt-15">
			<div class="col-xs-12">
				<div class="panel-group accordion" role="tablist"
					aria-multiselectable="true">
					<div class="panel panel-default">
						<div class="panel-heading" role="tab" id="heading4">
							<h4 class="panel-title">
								<a role="button" data-toggle="collapse"
									data-parent="#accordion4" href="#collapse4"
									aria-expanded="true" aria-controls="collapse4"> <i
									class="pannelState icon-action_accordeon-ouvert"></i>
									Informations réservées à l'administration
								</a>
							</h4>
						</div>
						<div id="collapse4" class="panel-collapse collapse in"
							role="tabpanel" aria-labelledby="heading4">
							<div class="panel-body">
								<div class="row">
									<div class="col-xs-12">
										<form id="infos-demande" action="#"
											th:action="@{/demandes/infosAdministration}" method="post">
											<div class="row">
												<div class="col-xs-12">
													<label for="observation-admin">OBSERVATIONS</label>
													<textarea id="observation-admin" class="form-control"
														th:field="${traitementFormBean.observations}"
														th:disabled="${statutPublicOuInterneDTO.getName()} == 'EN_ATTENTE_TRAIT' or ${statutPublicOuInterneDTO.getName()} == 'REFUSEE' or ${statutPublicOuInterneDTO.getName()} == 'ANNULEE' or ${statutPublicOuInterneDTO.getName()} == 'VALIDEE' or !${#authorization.expression('hasRole(''ROLE_TRAITEMENT'')')}" />
												</div>
											</div>
											<div class="row mt-15">
												<div class="col-xs-12 text-right">
													<input class="btn btn-action ripple-effect" type="submit"
														name="action" value="Sauvegarder"
														th:disabled="${statutPublicOuInterneDTO.getName()} == 'EN_ATTENTE_TRAIT' or ${statutPublicOuInterneDTO.getName()} == 'REFUSEE' or ${statutPublicOuInterneDTO.getName()} == 'ANNULEE' or ${statutPublicOuInterneDTO.getName()} == 'VALIDEE' or !${#authorization.expression('hasRole(''ROLE_TRAITEMENT'')')}" />
												</div>
											</div>
											<input type="hidden" name="pkDemande"
												th:value="${demandeDTO.pkDemandes}" />
										</form>
									</div>


								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
