<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
<div id="supprimerusager" th:fragment="supprimerusager">
  <div id="supprimer-box" class="modal fade" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
              aria-hidden="true">&times;</span></button>
          <h4 class="modal-title">Suppression d'un usager</h4>
        </div>
        <div class="modal-body">
          <div id="supprimer-content">
            <div class="container-fluid">
              <div class="row">
                <div class="col-xs-12">
                  <span
                      class="suppressionOk"
                                                    style="color: rgb(94, 97, 100);">Vous êtes sur le point
								de supprimer l'usager :</span> <span class="demandesAffectees"
                                                     style="color: rgb(94, 97, 100);">Des demandes sont
								affectées à l'usager :</span> <br/>
                  <span id="nomPrenom" style="font-weight: bold;"></span><br/>
                  <span id="raisonSociale" style="font-weight: bold;"></span><br/>
                  <span id="adresse" style="font-weight: bold;"></span><br/>
                  <span id="codePostal" style="font-weight: bold;"></span>&nbsp;
                  <span id="ville" style="font-weight: bold;"></span><br/> <br/>
                  <span class="demandesAffectees" style="color: rgb(94, 97, 100);">Voulez-vous
								réaffecter ces demandes à un autre usager ?</span>
                </div>
              </div>
              <div class="row ">
                <div class="col-xs-12 text-center demandesAffectees margin-top">
                  <a href="#"
                     class="btn btn-action-second ripple-effect transferer-annuler">Annuler</a>
                  <a class="btn btn-action ripple-effect margin-left"
                     id="lienpopuptransfert" href="#">Valider</a>
                </div>
              </div>
              <div class="row">
                <div class="col-xs-12 text-center  suppressionOk margin-top">
                  <form id="form-supprimer" action="#"
                        th:action="@{/gestion/usagers/supprimer}" method="post">
                    <div>
                      <input type="hidden" class="usagerId" name="usagerId"/>
                    </div>
                    <a href="#"
                       class="btn btn-action-second ripple-effect supprimer-annuler">Annuler</a>
                    <button class="btn btn-action ripple-effect margin-left"
                            id="supprimer-button" type="button" name="action"
                            value="Valider">Valider
                    </button>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div><!-- /.modal-content -->
    </div><!-- /.modal-dialog -->
  </div><!-- /.modal -->
</div>
</body>
</html>
