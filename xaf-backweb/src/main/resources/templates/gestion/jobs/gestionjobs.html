<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      class="no-js sidebar-left-collapsed" lang="fr" dir="ltr">

<head>
  <meta charset="utf-8"/>
  <meta http-equiv="x-ua-compatible" content="ie=edge"/>
  <meta name="viewport"
        content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
  <meta name="description" content=""/>
  <meta name="author" content=""/>
  <meta th:name="_csrf" th:content="${_csrf.token}"/>
  <meta th:name="_csrf_header" th:content="${_csrf.headerName}"/>


  <title th:text="${titre}"></title>

  <!-- Import FONTS -->
  <link th:href="@{/css/font-style.css(${applicationBuildTimestamp})}" rel="stylesheet"/>

  <!-- Import CSS -->
  <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
        rel="stylesheet" type="text/css"/>
  <link th:href="@{/webjars/xcb-wlib/css/template.css}" rel="stylesheet"/>
  <link th:href="@{/webjars/xcb-wlib/css/sidebar.css}" rel="stylesheet"/>
  <link th:href="@{/webjars/xcb-wlib/css/element.css}" rel="stylesheet"/>
  <link th:href="@{/webjars/datatables/css/dataTables.bootstrap.min.css}"
        rel="stylesheet"/>
  <link rel="shortcut icon" type="image/x-icon"
        th:href="@{/img/favicon.ico}"/>
  <link th:href="@{/css/tsgen.css(${applicationBuildTimestamp})}"
        rel="stylesheet"/>
  <link th:href="@{/css/tsdem.css(${applicationBuildTimestamp})}"
        rel="stylesheet"/>


</head>

<body th:with="pageConfigurationActive='active'">

<div th:replace="~{fragments/header :: header}"></div>

<div id="wrapper">

  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <!-- DEBUT CONTENU -->
  <div id="page-content-wrapper">


    <div class="breadcrumbContent">
      <div class="breadcrumb">
        <a id="ariane0" th:href="@{/}" class="breadcrumb-item active">Accueil</a>&nbsp;&gt;&nbsp;
        <a id="ariane1" th:href="@{/gestion/jobs}"
           class="breadcrumb-item active">JOBS</a> &gt;
      </div>
      <div class="triangleTopright"></div>
    </div>

    <div class="container-fluid">
      <h1 class="col-xs-12 col-md-12">Administration des Jobs</h1>
      <div class="text-left">
        <div class="col-xs-6 col-md-6" style="padding-left: 0px">
          <select style="margin-left: 1em" name="jobsSelect"
                  id="jobsSelectId" class="form-control">
            <option value="">Merci de selectionner un job</option>
            <option th:each="job : ${jobs}" th:value="${job.name()}"
                    th:text="${job.libelle}"></option>
          </select>
        </div>
        <div class="col-xs-6 col-md-6">
          <input type="submit" value="Exécuter" id="executeJobButton"
                 class="btn btn-action ripple-effect ">
        </div>
      </div>
      <div class="row col-xs-12 col-md-12">
        <div class="col-xs-12 col-md-12">
          <div class="tableContent">
            <div class="tableTitle">
              Historique des jobs <span class="badge" id="jobsSize"></span>
            </div>
            <table id="datatable-jobs" class="table table-striped ">
              <thead>
              <tr>
                <th class="col-md-2">Nom</th>
                <th class="col-md-2">Date de création</th>
                <th class="col-md-2">Date de la dernière modification</th>
                <th class="col-md-2">Statut</th>
                <th class="col-md-4">Message</th>
              </tr>
              </thead>
            </table>
          </div>


        </div>
      </div>

      <div class="row">
        <div id="executeJobConfirmPanel" class="modal fade" tabindex="-1" role="dialog">
          <div class="modal-dialog" role="document">
            <div class="modal-content">
              <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
                    aria-hidden="true">&times;</span></button>
                <h4 class="modal-title">Job</h4>
              </div>
              <div class="modal-body">
                <div class="container-fluid">
                  <div class="row">
                    <div id="executeJobConfirmationMsg">Êtes vous sûr de vouloir exécuter
                      le job ?
                    </div>
                  </div>

                  <div class="row">
                    <div class="text-right">
                      <a class="annuler-preview btn btn-action-second ripple-effect"
                         id="cancelExecuteJobButton">Annuler</a> <a
                        class="valider-preview btn btn-action ripple-effect"
                        id="executeJobConfirmationButton">Valider</a>
                    </div>
                  </div>
                </div>
              </div>
            </div><!-- /.modal-content -->
          </div><!-- /.modal-dialog -->
        </div><!-- /.modal -->
      </div>

    </div>

    <input type="hidden" href="javascript:void(0);" data-type="success"
           data-delay="5000" data-message="" id="successMessage"
           class="notification"/> <input type="hidden"
                                         href="javascript:void(0);" data-type="danger"
                                         data-delay="0"
                                         data-message="" id="errorMessage" class="notification"/>


    <!-- FIN CONTENU -->
  </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/tsadminjobs.js(${applicationBuildTimestamp})}"></script>
</body>
</html>
