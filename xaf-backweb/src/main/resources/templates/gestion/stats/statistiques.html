<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      class="no-js sidebar-left-collapsed" lang="fr" dir="ltr">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="x-ua-compatible" content="ie=edge"/>
    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content=""/>
    <meta name="author" content=""/>
    <meta th:name="_csrf" th:content="${_csrf.token}"/>
    <meta th:name="_csrf_header" th:content="${_csrf.headerName}"/>

    <title th:text="${titre}"></title>

    <!-- Import FONTS -->
    <link th:href="@{/webjars/xcb-wlib/fonts/style.css}" rel="stylesheet"/>
    <!--[if lt IE 8]><!-->
    <link rel="stylesheet" th:href="@{/webjars/xcb-wlib/fonts/ie7/ie7.css}"/>

    <!-- Import CSS -->
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
          rel="stylesheet" type="text/css"/>
    <link th:href="@{/webjars/xcb-wlib/css/template.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/xcb-wlib/css/sidebar.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/xcb-wlib/css/element.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/datatables/css/dataTables.bootstrap.css}"
          rel="stylesheet"/>
    <link rel="stylesheet"
          th:href="@{/webjars/fancybox/jquery.fancybox.css}"/>
    <link rel="shortcut icon" type="image/x-icon"
          th:href="@{/img/favicon.ico}"/>
    <link th:href="@{/css/tsgen.css(${applicationBuildTimestamp})}"
          rel="stylesheet"/>
    <link th:href="@{/css/tsdem.css(${applicationBuildTimestamp})}"
          rel="stylesheet"/>

    <style>
        .private.odd {
            background: #eaeaea;
        }
        .private {
            background: #dddddd;
        }
    </style>
</head>
<body th:with="pageConfigurationActive='active'">

<div th:replace="fragments/header :: header"/>

<div id="wrapper">

    <div th:replace="fragments/sidebar :: sidebar"/>

    <!-- DEBUT CONTENU -->
    <div id="page-content-wrapper">

        <div class="breadcrumbContent">
            <div class="breadcrumb">
						<span> <a th:href="@{/}" class="breadcrumb-item">ACCUEIL</a>&nbsp;&gt;&nbsp;
							<a th:href="@{/gestion/statistiques}" class="breadcrumb-item">STATISTIQUES</a>
							&gt;
						</span>
            </div>
            <div class="triangleTopright"></div>
        </div>

        <div class="container-fluid">
            <div class="text-center">
                <h1>Statistiques</h1>
            </div>
            <br/>
            <br/>
            <div class="row">
                <div class="col-xs-12">
                    <div class="tableContent">
                        <div class="tableTitle">Démarches</div>
                        <table id="datatable_parametres"
                               class="table table-striped table-bordered table-hover">
                            <thead>
                            <tr>
                                <th></th>
                                <th th:each="obj, index : ${statusEnum.values()}" th:text="${obj}"
                                    th:classappend="${privateStatusEnum.containsValue(obj)? 'private' : ''}">
                                </th>
                                <th>TOTAL</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="key, index : ${statList.keySet()}">
                                <td th:text="${canalEnum[0].getLibelleFromName(key)}" style="font-weight:bold"></td>
                                <td th:each="obj : ${statusEnum.keySet()}" th:text="${statList.get(key).get(obj)}"
                                    th:classappend="${(privateStatusEnum.containsKey(obj)? 'private' : '') + ' ' +
                                    ((privateStatusEnum.containsKey(obj) && index.odd)? 'odd' : '')}"></td>
                                <td th:text="${statList.get(key).get('TOTAL')}" style="font-weight:bold"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
</div>

<div th:replace="fragments/footer :: footer"></div>
</body>

</body>
</html>
