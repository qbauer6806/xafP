<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      class="no-js sidebar-left-collapsed" lang="fr" dir="ltr">

<head>
  <meta charset="utf-8"/>
  <meta http-equiv="x-ua-compatible" content="ie=edge"/>
  <meta name="viewport"
        content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
  <meta name="description" content=""/>
  <meta name="author" content=""/>
  <meta th:name="_csrf" th:content="${_csrf.token}"/>
  <meta th:name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title th:text="${nomDemarche}"></title>

  <!-- Import FONTS -->
  <link th:href="@{/css/font-style.css(${applicationBuildTimestamp})}" rel="stylesheet"/>

  <!-- Import CSS -->
  <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
        rel="stylesheet" type="text/css"/>
  <link th:href="@{/webjars/xcb-wlib/css/template.css}" rel="stylesheet"/>
  <link th:href="@{/webjars/xcb-wlib/css/sidebar.css}" rel="stylesheet"/>
  <link th:href="@{/webjars/xcb-wlib/css/element.css}" rel="stylesheet"/>
  <link th:href="@{/webjars/datatables/css/dataTables.bootstrap.min.css}"
        rel="stylesheet"/>

  <link rel="shortcut icon" type="image/x-icon"
        th:href="@{/img/favicon.ico}"/>
  <link th:href="@{/css/tsgen.css(${applicationBuildTimestamp})}"
        rel="stylesheet"/>
  <link th:href="@{/css/tsdem.css(${applicationBuildTimestamp})}"
        rel="stylesheet"/>

  <!-- Main Quill library -->
  <script src="//cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/T-vK/DynamicQuillTools@master/DynamicQuillTools.js"></script>

  <!-- Theme included stylesheets -->
  <link href="//cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">


  <style>
    /* Hack charte graphique pour avoir un toggle toujours bleu */
    input:checked + .slider, input + input[type="hidden"] + .slider {
      outline: 3px solid #0F607C;
    }

    input:checked + .slider:before, input + input[type="hidden"] + .slider:before {
      background-color: #0F607C;
    }

    form .form-group span {
      padding-top: 0;
    }

    .ql-toolbar .ql-picker .ql-picker-options {
      max-height: 400px;
      overflow-y: auto;
    }
  </style>

</head>

<body th:with="pageConfigurationActive='active'">

<div>

  <div th:replace="~{fragments/header :: header}"></div>

  <div id="wrapper">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- DEBUT CONTENU -->
    <div id="page-content-wrapper">

      <div class="breadcrumbContent">
        <div class="breadcrumb">
          <a id="ariane0" th:href="@{/index}" class="breadcrumb-link">Accueil</a>&nbsp;&gt;&nbsp;<a
            id="ariane1" th:href="@{/gestion/template}"
            class="breadcrumb-link">TEMPLATES</a> &gt; <span>MODIFICATION</span>
        </div>
        <div class="triangleTopright"></div>
      </div>

      <div class="container-fluid">
        <div class="row">
          <div class="col-xs-6">
            <h1 class="titre">Formulaire de création du template</h1>
          </div>
        </div>
        <div class="row">

          <form class="form-horizontal" id="formTemplate"
                th:action="@{/gestion/template/create}" method="POST"
                th:object="${templateCreateFormBean}">

            <div class="col-xs-12">
              <div class="panel panel-simple">
                <div class="row container-fluid">
                  <div class="form-group">
                    <div class="col-xs-2">
                      <label for="code">Code (majuscules et des underscores)<span class="required"></span>: </label>
                    </div>
                    <div class="col-xs-10">
                      <input type="text" id="code" th:field="*{code}" class="form-control"
                             style="text-transform: uppercase;"
                             pattern="^[A-Z_]+$"
                             title="Uniquement des majuscules et des underscores"
                             oninput="this.value = this.value.toUpperCase().replace(/[^A-Z_]/g,'')" />
                    </div>
                  </div>
                </div>

                <div class="row container-fluid mt-15">
                  <div th:class="form-group">
                    <div class="col-xs-2">
                      <label for="objetFr">Objet du mail (Français)<span class="required"></span>: </label>
                    </div>
                    <div class="col-xs-10">
                      <input type="text" id="objetFr" name="objetFr" th:field="*{objetFr}"
                             class="form-control"/>
                    </div>
                  </div>
                </div>

                <div class="row container-fluid mt-15">
                  <div th:class="form-group">
                    <div class="col-xs-2">
                      <label for="editorFr">Corps du mail (Français)<span class="required"></span>: </label>
                    </div>
                    <div class="col-xs-10">
                      <div id="toolbarFr"></div>
                      <div id="editorFr"></div>
                    </div>
                  </div>
                </div>
                <input type="hidden" id="corpsFr" name="corpsFr" th:field="*{corpsFr}" class="form-control"/>

                <div class="row container-fluid mt-15">
                  <div th:class="form-group">
                    <div class="col-xs-2">
                      <label for="objetFr">Objet du mail (Anglais): </label>
                    </div>
                    <div class="col-xs-10">
                      <input type="text" id="objetEn" name="objetEn" th:field="*{objetEn}"
                             class="form-control"/>
                    </div>
                  </div>
                </div>

                <div class="row container-fluid mt-15">
                  <div th:class="form-group">
                    <div class="col-xs-2">
                      <label for="editorFr">Corps du mail (Anglais): </label>
                    </div>
                    <div class="col-xs-10">
                      <div id="toolbarEn"></div>
                      <div id="editorEn"></div>
                    </div>
                  </div>
                </div>
                <input type="hidden" id="corpsEn" name="corpsEn" th:field="*{corpsEn}" class="form-control"/>


                <div class="row mt-15">
                  <div class="col-xs-12 text-right">
                    <a id="btnRetourMotifs" class="btn btn-action-second ripple-effect"
                       th:href="@{/gestion/template}">Retour</a>
                    <input id="validerBtn" type="submit" value="Valider"
                           class="btn btn-action ripple-effect"/>
                  </div>
                </div>
              </div>
            </div>

          </form>
          <div class="container-fluid">
            <small>Les champs obligatoires sont suivis par *</small>
          </div>
        </div>

      </div>

      <div id="visualisationModal" class="modal fade" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document" style="width: 70%">
          <div class="modal-content">
            <div class="modal-header">
              <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
                  aria-hidden="true">&times;</span></button>
              <h4 class="modal-title">Prévisualisation du template de mail<span id="codeMailModal"></span></h4>
            </div>
            <div class="modal-body">
              <div style="margin-top: 20px">
                <div th:class="form-group">
                  <div class="row">
                    <div class="col-xs-4">
                      <label for="code">Tester ce mail avec la demande (identifiant technique)<span class="required"></span>: </label>
                    </div>
                    <div class="col-xs-6">
                      <input type="text" id="pkDemandeTest" th:object="${templateCreateFormBean}" th:field="*{pkDemandeTest}" th:value="*{pkDemandeTest}" class="form-control"/>
                    </div>
                    <div class="col-xs-2">
                      <button class="btn btn-action ripple-effect" id="validerPkDemandePreview"
                              name="validerPkDemandePreview" type="button"
                              value="Valider">
                        Valider
                      </button>
                    </div>
                  </div>
                </div>
              </div>
              <div><h3 style="margin-bottom: 20px">Résultat prévisualisation:</h3></div>
              <p><span id="corpsMailModal"></span></p>
            </div>
          </div><!-- /.modal-content -->
        </div><!-- /.modal-dialog -->
      </div><!-- /.modal -->



    </div>
  </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<div th:replace="~{fragments/message :: message}"></div>

<script th:inline="javascript">

  // Variables créées pour partager la valeur entre les différents états de la modal
  // Solution trouvée pour ne pas compliquer le code
  var currentSubjectText = '';
  var currentContentText = '';

  $(document).ready(function () {

    /*<![CDATA[*/

    var templateCreateFormBean = /*[[(${templateCreateFormBean})]]*/;
    var tsCode = /*[[(${tsCode})]]*/
    var variablesGlobales = /*[[(${variablesGlobales})]]*/;
    var marqueurs = /*[[(${marqueurs})]]*/;

    if (!!$("#formTemplate").html()) {
      var toolbarOptions = [
        ['bold', 'italic', 'underline', 'strike'],        // toggled buttons
        ['link', 'blockquote', 'code-block'],

        [{'header': 1}, {'header': 2}],               // custom button values
        [{'list': 'ordered'}, {'list': 'bullet'}],
        [{'script': 'sub'}, {'script': 'super'}],      // superscript/subscript
        [{'indent': '-1'}, {'indent': '+1'}],          // outdent/indent
        [{'direction': 'rtl'}],                         // text direction

        [{'size': ['small', false, 'large', 'huge']}],  // custom dropdown
        [{'header': [1, 2, 3, 4, 5, 6, false]}],

        [{'color': []}, {'background': []}],          // dropdown with defaults from theme
        [{'align': []}],

        ['clean']                                         // remove formatting button
      ];
      var options = {
        modules: {
          toolbar: toolbarOptions
        },
        readOnly: false,
        theme: 'snow'
      };
      var editorFr = new Quill('#editorFr', options);
      const deltaFr = editorFr.clipboard.convert(templateCreateFormBean.corpsFr);
      editorFr.setContents(deltaFr, 'silent');
      var editorEn = new Quill('#editorEn', options);
      const deltaEn = editorEn.clipboard.convert(templateCreateFormBean.corpsEn);
      editorEn.setContents(deltaEn, 'silent');

      attachEditorTools(editorFr, $("#objetFr"));
      attachEditorTools(editorEn, $("#objetEn"));
    }

    $('#formTemplate').submit(function () {
      $("#corpsFr").val(getEditorContent(editorFr));
      $("#corpsEn").val(getEditorContent(editorEn));
    });

    function getEditorContent(editor) {
      // Quill ajoute des <p> autour de chaque paragraphe. Nous utilisons des hard line break (<br/>) pour nos mail
      var editorContent = editor.root.innerHTML;
      editorContent = editorContent.replaceAll('<p><br></p>', '<br/>').replaceAll('<p>', '').replaceAll('</p>', '<br/>');

      // Quill ajoute par défaut un paragraphe vide même quand il n'y a rien dans l'éditeur.
      // Pour des motifs de validation, on supprime ce contenu si c'est le cas
      if(editorContent === '<br/>') {
        editorContent = '';
      }
      return editorContent;
    }

    function getSubjectContent() {

    }

    $("#validerPkDemandePreview").click(function () {
      const pkDemande = $('#pkDemandeTest').val();
      makePreviewCall(pkDemande);
      return true;
    });

    var makePreviewCall = function (pkDemande) {
      var token = $("meta[name='_csrf']").attr("content");
      var header = $("meta[name='_csrf_header']").attr("content");

      var body = {
        subjectText: currentSubjectText,
        templateText: currentContentText,
        codeMotifChoisi: null,
        pkDemande: pkDemande,
        commentaire: "** Commentaire à envoyer **",
        texteAEnvoyer: "** Texte à envoyer **"
      };

      $.ajax({
        url: APP.getContextPath() + '/ws/mailpreview-by-text',
        type: 'post',
        contentType: 'application/json',
        data: JSON.stringify(body),
        dataType: "html",
        beforeSend: function (xhr) {
          xhr.setRequestHeader(header, token);
          $('#visualisationModal').modal();
          $('#corpsMailModal').html("Chargement en cours...");
        },
        success: function (data) {
          $('#corpsMailModal').html(data);
        },
        error: function (xhr, status, error) {
          const msg =JSON.parse(xhr.responseText)?.message || "Une erreur est survenue.";
          $.notify({message: msg}, {type: 'danger'});
        }
      });
    };

    var successMessage = /*[[${successMessages}]]*/'';
    if (successMessage) {
      $.notify({message: successMessage}, {type: 'success'});
    }

    var messagesErrorList = /*[[${errorMessages}]]*/'default';
    if (messagesErrorList !== 'undefined' && messagesErrorList !== null) {
      $.each(messagesErrorList, function (key, msg) {
        $.notify({
          message: msg
        }, {
          type: 'danger'
        });
      });
    }

    /*]]>*/


    function attachEditorTools(editor, subjectField) {

      // Dropdown Variables Globales
      const variablesGlobalesItems = Object.entries(variablesGlobales).reduce((acc, [key, value]) => {
        const label = value != null ? `${key} : <b>${value}</b>` : key;
        acc[label] = '${' + key + '}';
        return acc;
      }, {});

      const variablesGlobalesDropdown = new QuillToolbarDropDown({
        label: "Variables globales",
        rememberSelection: false
      })
      variablesGlobalesDropdown.setItems(variablesGlobalesItems)
      variablesGlobalesDropdown.onSelect = function(label, value, quill) {
        const { index, length } = quill.selection.savedRange
        quill.deleteText(index, length)
        quill.insertText(index, value)
        quill.setSelection(index + value.length)
      }
      variablesGlobalesDropdown.attach(editor)

      // Dropdown marqueurs
      const marqueursItems = marqueurs.reduce((acc, m) => {
        acc[m.identifiant] = '${marqueurs.' + m.identifiant + '}';
        return acc;
      }, {});

      const marqueursDropDown = new QuillToolbarDropDown({
        label: "Marqueurs",
        rememberSelection: false
      })

      marqueursDropDown.setItems(marqueursItems)

      marqueursDropDown.onSelect = function(label, value, quill) {
        const { index, length } = quill.selection.savedRange
        quill.deleteText(index, length)
        quill.insertText(index, value)
        quill.setSelection(index + value.length)
      }

      marqueursDropDown.attach(editor)

      // Preview
      const previewFrButton = new QuillToolbarButton({
        icon: "<?xml version=\"1.0\" encoding=\"UTF-8\"?><svg xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"85px\" height=\"11px\" viewBox=\"0 0 91 12\" version=\"1.1\"><g id=\"surface1\"><path style=\" stroke:none;fill-rule:nonzero;fill:rgb(26.666668%,26.666668%,26.666668%);fill-opacity:1;\" d=\"M 0 11.667969 L 0 0.0625 L 4.339844 0.0625 C 5.105469 0.0625 5.691406 0.0976562 6.09375 0.171875 C 6.65625 0.265625 7.128906 0.449219 7.511719 0.714844 C 7.894531 0.984375 8.203125 1.355469 8.433594 1.835938 C 8.667969 2.316406 8.785156 2.84375 8.785156 3.417969 C 8.785156 4.40625 8.472656 5.242188 7.847656 5.925781 C 7.226562 6.609375 6.101562 6.949219 4.476562 6.949219 L 1.523438 6.949219 L 1.523438 11.667969 L 0 11.667969 M 1.523438 5.582031 L 4.5 5.582031 C 5.484375 5.582031 6.179688 5.398438 6.59375 5.027344 C 7.007812 4.65625 7.214844 4.136719 7.214844 3.46875 C 7.214844 2.980469 7.09375 2.566406 6.847656 2.222656 C 6.605469 1.875 6.285156 1.648438 5.886719 1.535156 C 5.628906 1.46875 5.15625 1.433594 4.464844 1.433594 L 1.523438 1.433594 Z M 10.527344 11.667969 L 10.527344 3.261719 L 11.796875 3.261719 L 11.796875 4.539062 C 12.125 3.941406 12.421875 3.546875 12.699219 3.355469 C 12.972656 3.167969 13.273438 3.070312 13.605469 3.070312 C 14.082031 3.070312 14.566406 3.226562 15.058594 3.53125 L 14.570312 4.851562 C 14.222656 4.648438 13.878906 4.542969 13.535156 4.542969 C 13.226562 4.542969 12.949219 4.636719 12.703125 4.824219 C 12.453125 5.011719 12.28125 5.269531 12.175781 5.605469 C 12.019531 6.113281 11.9375 6.667969 11.9375 7.269531 L 11.9375 11.667969 Z M 21.605469 8.960938 L 23.066406 9.144531 C 22.832031 10.007812 22.40625 10.671875 21.785156 11.148438 C 21.160156 11.621094 20.367188 11.859375 19.398438 11.859375 C 18.179688 11.859375 17.210938 11.480469 16.5 10.726562 C 15.78125 9.964844 15.425781 8.902344 15.425781 7.539062 C 15.425781 6.125 15.785156 5.023438 16.507812 4.242188 C 17.230469 3.460938 18.167969 3.
