<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      class="no-js sidebar-left-collapsed" lang="fr" dir="ltr">

<head>
  <meta charset="utf-8"/>
  <meta http-equiv="x-ua-compatible" content="ie=edge"/>
  <meta name="viewport"
        content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
  <meta name="description" content=""/>
  <meta name="author" content=""/>
  <meta th:name="_csrf" th:content="${_csrf.token}"/>
  <meta th:name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title th:text="${titre}"></title>

  <!-- Import FONTS -->
  <link th:href="@{/css/font-style.css(${applicationBuildTimestamp})}" rel="stylesheet"/>

  <!-- Import CSS -->
  <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
        rel="stylesheet" type="text/css"/>
  <link th:href="@{/webjars/xcb-wlib/css/template.css}" rel="stylesheet"/>
  <link th:href="@{/webjars/xcb-wlib/css/sidebar.css}" rel="stylesheet"/>
  <link th:href="@{/webjars/xcb-wlib/css/element.css}" rel="stylesheet"/>
  <link th:href="@{/webjars/datatables/css/dataTables.bootstrap.min.css}"
        rel="stylesheet"/>

  <link rel="shortcut icon" type="image/x-icon"
        th:href="@{/img/favicon.ico}"/>
  <link th:href="@{/css/tsgen.css(${applicationBuildTimestamp})}"
        rel="stylesheet"/>
  <link th:href="@{/css/tsdem.css(${applicationBuildTimestamp})}"
        rel="stylesheet"/>

  <!-- Main Quill library -->
  <script src="//cdn.quilljs.com/1.3.6/quill.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/T-vK/DynamicQuillTools@master/DynamicQuillTools.js"></script>

  <!-- Theme included stylesheets -->
  <link href="//cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">


  <style>
    /* Hack charte graphique pour avoir un toggle toujours bleu */
    input:checked + .slider, input + input[type="hidden"] + .slider {
      outline: 3px solid #0F607C;
    }

    input:checked + .slider:before, input + input[type="hidden"] + .slider:before {
      background-color: #0F607C;
    }

    form .form-group span {
      padding-top: 0;
    }

    .ql-toolbar .ql-picker .ql-picker-options {
      max-height: 400px;
      overflow-y: auto;
    }
  </style>

</head>

<body th:with="pageConfigurationActive='active'">

<div>

  <div th:replace="~{fragments/header :: header}"></div>

  <div id="wrapper">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- DEBUT CONTENU -->
    <div id="page-content-wrapper">

      <div class="breadcrumbContent">
        <div class="breadcrumb">
          <a id="ariane0" th:href="@{/index}" class="breadcrumb-link">Accueil</a>&nbsp;&gt;&nbsp;<a
            id="ariane1" th:href="@{/gestion/template}"
            class="breadcrumb-link">TEMPLATES</a> &gt; <span>MODIFICATION</span>
        </div>
        <div class="triangleTopright"></div>
      </div>

      <div class="container-fluid">
        <div class="row">
          <div class="col-xs-6">
            <h1 class="titre">Formulaire de modification du template</h1>
          </div>

          <div class="col-xs-6 text-right">
							<span th:if="${!frOnly}">
								<span style="color:#0F607C; font-weight: bold">ANGLAIS&nbsp;&nbsp;&nbsp;</span>
								<div class="toggle" style="display:inline-block; transform: translateY(35%);">
									<label class="switch">
										<input class="switch-input" id="switchLangue" type="checkbox" checked=""
                           name="langue" value="LANGUE"/>
										<input type="hidden" checked=""/>
										<span class="slider"></span>
									</label>

								</div>
								<span style="color:#0F607C; font-weight: bold">&nbsp;&nbsp;&nbsp;FRANCAIS</span>
							</span>

            <button class="btn btn-action ripple-effect exportSqlBouton" id="exportSqlBouton"
                    name="exportSql" type="button"
                    value="Export SQL" style="margin-left: 30px">
              Export SQL
            </button>

            <button class="btn btn-action ripple-effect exportSqlBouton" id="preview"
                    name="preview" type="button"
                    value="Prévisualisation" style="margin-left: 30px">
              Prévisualisation
            </button>
          </div>
        </div>
        <div class="row"
             th:if="${templateFormBean.corps} != null and ${templateFormBean.corps} != ''">

          <form class="form-horizontal"
                id="formTemplate"
                th:action="@{/gestion/template/update}" method="POST"
                th:object="${templateFormBean}">

            <input type="hidden" name="code" th:field="*{code}" class="form-control"/>
            <input type="hidden" name="langue" th:field="*{langue}" class="form-control"/>
            <input type="hidden" id="corps" name="corps" th:field="*{corps}" class="form-control"/>

            <div class="col-xs-12">
              <div class="panel panel-simple">
                <div class="row container-fluid">
                  <div th:class="form-group">
                    <div class="col-xs-2">
                      <label for="code">Code<span class="required"></span>: </label>
                    </div>
                    <div class="col-xs-10">
                      <input type="text" id="code" th:field="*{code}" class="form-control"
                             disabled="disabled"/>
                    </div>
                  </div>
                </div>

                <div class="row container-fluid mt-15">
                  <div th:class="form-group">
                    <div class="col-xs-2">
                      <label for="objet">Objet du mail<span class="required"></span>: </label>
                    </div>
                    <div class="col-xs-10">
                      <input type="text" id="objet" name="objet" th:field="*{objet}"
                             class="form-control"/>
                    </div>
                  </div>
                </div>

                <div class="row container-fluid mt-15">
                  <div th:class="form-group">
                    <div class="col-xs-2">
                      <label for="editor">Corps du mail<span class="required"></span>: </label>
                    </div>
                    <div class="col-xs-10">
                      <div id="toolbar"></div>
                      <div id="editor"></div>
                    </div>
                  </div>
                </div>

                <div class="row mt-15">
                  <div class="col-xs-12 text-right">
                    <a id="btnRetourMotifs" class="btn btn-action-second ripple-effect"
                       th:href="@{/gestion/template}">Retour</a>
                    <input id="validerBtn" type="submit" value="Valider"
                           class="btn btn-action ripple-effect"/>
                  </div>
                </div>
              </div>
            </div>

          </form>
          <div class="container-fluid">
            <small>Les champs obligatoires sont suivis par *</small>
          </div>
        </div>

        <div class="row"
             th:if="${templateFormBean.corps} == null or ${templateFormBean.corps} == ''">
          <div class="col-xs-12 text-center">
            <h2>Aucun template trouvé pour cette langue</h2>
          </div>
        </div>
      </div>

      <div id="visualisationModal" class="modal fade" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document" style="width: 70%">
          <div class="modal-content">
            <div class="modal-header">
              <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span
                  aria-hidden="true">&times;</span></button>
              <h4 class="modal-title">Prévisualisation du template de mail<span id="codeMailModal"></span></h4>
            </div>
            <div class="modal-body">
              <div style="margin-top: 20px">
                <div th:class="form-group">
                  <div class="row">
                    <div class="col-xs-4">
                      <label for="code">Tester ce mail avec la demande (identifiant technique)<span class="required"></span>: </label>
                    </div>
                    <div class="col-xs-6">
                      <input type="text" id="pkDemandeTest" th:object="${templateFormBean}" th:field="*{pkDemandeTest}" th:value="*{pkDemandeTest}" class="form-control"/>
                    </div>
                    <div class="col-xs-2">
                      <button class="btn btn-action ripple-effect exportSqlBouton" id="validerPkDemandePreview"
                              name="validerPkDemandePreview" type="button"
                              value="Valider">
                        Valider
                      </button>
                    </div>
                  </div>
                </div>
              </div>
              <div><h3 style="margin-bottom: 20px">Résultat prévisualisation:</h3></div>
              <p><span id="corpsMailModal"></span></p>
            </div>
          </div><!-- /.modal-content -->
        </div><!-- /.modal-dialog -->
      </div><!-- /.modal -->



    </div>
  </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<div th:replace="~{fragments/message :: message}"></div>

<script th:inline="javascript">

  function download(filename, text) {
    var element = document.createElement('a');
    element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(text));
    element.setAttribute('download', filename);

    element.style.display = 'none';
    document.body.appendChild(element);

    element.click();

    document.body.removeChild(element);
  }

  var exportSQLTemplate = function (tsCode, templateCode, templateObjet, templateCorps, templateLangue) {
    var sqlFinal = "";
    sqlFinal += "delete from " + tsCode + ".DEM_TEMPLATES where code = '" + templateCode + "_OBJET' and langue = '" + templateLangue + "';\r\n";
    sqlFinal += "delete from " + tsCode + ".DEM_TEMPLATES where code = '" + templateCode + "_CORPS' and langue = '" + templateLangue + "';\r\n";
    sqlFinal += "insert into " + tsCode + ".DEM_TEMPLATES values (default, '" + tsCode + "', '" + templateCode + "_OBJET', '" + templateObjet.replaceAll("\'", "\'\'") + "', '" + templateLangue + "');\r\n";
    sqlFinal += "insert into " + tsCode + ".DEM_TEMPLATES values (default, '" + tsCode + "', '" + templateCode + "_CORPS', '" + templateCorps.replaceAll("\'", "\'\'") + "', '" + templateLangue + "');\r\n\r\n";
    return sqlFinal;
  };

  $(document).ready(function () {

    /*<![CDATA[*/

    var templateFormBean = /*[[(${templateFormBean})]]*/;
    var tsCode = /*[[(${tsCode})]]*/
    var variablesGlobales = /*[[(${variablesGlobales})]]*/;
    var marqueurs = /*[[(${marqueurs})]]*/;

    if (!!$("#formTemplate").html()) {
      var toolbarOptions = [
        ['bold', 'italic', 'underline', 'strike'],        // toggled buttons
        ['link', 'blockquote', 'code-block'],

        [{'header': 1}, {'header': 2}],               // custom button values
        [{'list': 'ordered'}, {'list': 'bullet'}],
        [{'script': 'sub'}, {'script': 'super'}],      // superscript/subscript
        [{'indent': '-1'}, {'indent': '+1'}],          // outdent/indent
        [{'direction': 'rtl'}],                         // text direction

        [{'size': ['small', false, 'large', 'huge']}],  // custom dropdown
        [{'header': [1, 2, 3, 4, 5, 6, false]}],

        [{'color': []}, {'background': []}],          // dropdown with defaults from theme
        [{'align': []}],

        ['clean']                                         // remove formatting button
      ];
      var options = {
        modules: {
          toolbar: toolbarOptions
        },
        readOnly: false,
        theme: 'snow'
      };
      var editor = new Quill('#editor', options);
      const delta = editor.clipboard.convert(templateFormBean.corps);
      editor.setContents(delta, 'silent');

      const variablesGlobalesItems = Object.entries(variablesGlobales).reduce((acc, [key, value]) => {
        const label = value != null ? `${key} : <b>${value}</b>` : key;
        acc[label] = '${' + key + '}';
        return acc;
      }, {});

      const variablesGlobalesDropdown = new QuillToolbarDropDown({
        label: "Variables globales",
        rememberSelection: false
      })

      variablesGlobalesDropdown.setItems(variablesGlobalesItems)

      variablesGlobalesDropdown.onSelect = function(label, value, quill) {
        const { index, length } = quill.selection.savedRange
        quill.deleteText(index, length)
        quill.insertText(index, value)
        quill.setSelection(index + value.length)
      }

      variablesGlobalesDropdown.attach(editor)

      const marqueursItems = marqueurs.reduce((acc, m) => {
        acc[m.identifiant] = '${marqueurs.' + m.identifiant + '}';
        return acc;
      }, {});

      const marqueursDropDown = new QuillToolbarDropDown({
        label: "Marqueurs",
        rememberSelection: false
      })

      marqueursDropDown.setItems(marqueursItems)

      marqueursDropDown.onSelect = function(label, value, quill) {
        const { index, length } = quill.selection.savedRange
        quill.deleteText(index, length)
        quill.insertText(index, value)
        quill.setSelection(index + value.length)
      }

      marqueursDropDown.attach(editor)

    }

    $("#switchLangue").prop('checked', templateFormBean.langue === 'fr');

    $('#formTemplate').submit(function () {
      // Quill ajoute des <p> autour de chaque paragraphe. Nous utilisons des hard line break (<br/>) pour nos mail
      var editorContent = editor.root.innerHTML;
      editorContent = editorContent.replaceAll('<p><br></p>', '<br/>').replaceAll('<p>', '').replaceAll('</p>', '<br/>');
      $("#corps").val(editorContent);
    });

    $("#exportSqlBouton").click(function () {
      var sqlGenere = exportSQLTemplate(tsCode, templateFormBean.code, templateFormBean.objet, templateFormBean.corps, templateFormBean.langue);
      download("exportSQL-" + templateFormBean.code + ".sql", sqlGenere);
    });

    $("#preview").click(function () {
      const pkDemande = $('#pkDemandeTest').val();
      makePreviewCall(pkDemande)
      return true;
    });

    $("#validerPkDemandePreview").click(function () {
      const pkDemande = $('#pkDemandeTest').val();
      makePreviewCall(pkDemande)
      return true;
    });

    var makePreviewCall = function (pkDemande) {
      var token = $("meta[name='_csrf']").attr("content");
      var header = $("meta[name='_csrf_header']").attr("content");

      var body = {
        templateCode: templateFormBean.code,
        codeMotifChoisi: null,
        pkDemande: pkDemande,
        commentaire: "** Commentaire à envoyer **",
        texteAEnvoyer: "** Texte à envoyer **"
      };

      $.ajax({
        url: APP.getContextPath() + '/ws/mailpreview-by-code',
        type: 'post',
        contentType: 'application/json',
        data: JSON.stringify(body),
        dataType: "html",
        beforeSend: function (xhr) {
          xhr.setRequestHeader(header, token);
          $('#visualisationModal').modal();
          $('#corpsMailModal').html("Chargement en cours...");
        },
        success: function (data) {
          $('#corpsMailModal').html(data);
        }
      });
    };

    $("#switchLangue").click(function () {
      var langue = templateFormBean.langue === 'fr' ? 'en' : 'fr';
      window.location.href = APP.getContextPath() + '/gestion/template/update?code=' + templateFormBean.code + '&langue=' + langue;
    });

    var successMessage = /*[[${successMessages}]]*/'';
    if (successMessage) {
      $.notify({message: successMessage}, {type: 'success'});
    }

    var messagesErrorList = /*[[${errorMessages}]]*/'default';
    if (messagesErrorList !== 'undefined' && messagesErrorList !== null) {
      $.each(messagesErrorList, function (key, msg) {
        $.notify({
          message: msg
        }, {
          type: 'danger'
        });
      });
    }

    /*]]>*/

  });
</script>
</body>
</html>
