application.module=frontserver
server.port=${front.port}
# Server
server.servlet.context-path=${front.context}

mc.gouv.appli.frontserver.url=http://localhost:${front.port}${server.servlet.context-path}
mc.gouv.appli.frontserver.api.url=http://localhost:${api.port}/${application.name}/api/v1
mc.gouv.appli.frontserver.back.url=http://localhost:${back.port}/${application.name}
# Proprietes utilisees par le FO
