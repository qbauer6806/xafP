mc.gouv.gichuni.pub.mconnect.url.fr=${mc.gouv.gichuni.front.url}/utiliser-mconnect?dest=${mc.gouv.appli.frontserver.url}/menu.html
mc.gouv.gichuni.pub.mconnect.url.en=${mc.gouv.gichuni.front.url}/en/use-mconnect?dest=${mc.gouv.appli.frontserver.url}/menu.html
mc.gouv.gichuni.demarche.particulier.url.fr=${mc.gouv.gichuni.front.url}/particuliers/mes-demarches
mc.gouv.gichuni.demarche.particulier.url.en=${mc.gouv.gichuni.front.url}/en/particuliers/my-services
mc.gouv.gichuni.demarche.entreprise.url.fr=${mc.gouv.gichuni.front.url}/entreprises/mes-demarches
mc.gouv.gichuni.demarche.entreprise.url.en=${mc.gouv.gichuni.front.url}/en/entreprises/my-services
mc.gouv.gichuni.profil.particulier.url.fr=${mc.gouv.gichuni.front.url}/particuliers/profil
mc.gouv.gichuni.profil.particulier.url.en=${mc.gouv.gichuni.front.url}/en/particuliers/profil
mc.gouv.gichuni.profil.entreprise.url.fr=${mc.gouv.gichuni.front.url}/entreprises/profil
mc.gouv.gichuni.profil.entreprise.url.en=${mc.gouv.gichuni.front.url}/en/entreprises/profil
mc.gouv.appli.frontserver.matomo.site_id=0
mc.gouv.appli.frontserver.copyright.years=0000

# Demandes courrier
mc.gouv.appli.frontserver.redirectToBo.url=${mc.gouv.appli.frontserver.back.url}/demandes/<id>?origin=fo

# MonGuichet
mc.gouv.appli.frontserver.gichkey.keycloak.redirect.uri=${mc.gouv.appli.frontserver.url}/acces_teleservice.html
mc.gouv.appli.frontserver.gichkey.redirect.url=${mc.gouv.gichuni.front.url}/auth/realms/gichuni/protocol/openid-connect/auth?client_id=${mc.gouv.appli.frontserver.gichkey.client_id}&response_type=code&redirect_uri=${mc.gouv.appli.frontserver.gichkey.keycloak.redirect.uri}

# File
# Pour la prod/rec, 200 fichiers max / 24h. En dev/local 10 fichiers / seconde
mc.gouv.frontserver.max.upload.intervalle=10
mc.gouv.frontserver.temps.upload.intervalle=1000

# Front
mc.gouv.appli.frontserver.jwt=${APPLI_FRONT_JWT}
# File
mc.gouv.appli.frontserver.file.jwt=${APPLI_FRONT_FILE_JWT}
# Vscan
mc.gouv.appli.frontserver.vscan.jwt=${APPLI_FRONT_VSCAN_JWT}
# Tgf
mc.gouv.appli.frontserver.tgf.jwt=${APPLI_FRONT_TGF_JWT}
# MonGuichet
mc.gouv.appli.frontserver.gichkey.client_secret=${APPLI_FRONT_GICHUNI_CLIENT_SECRET}
# Security
mc.gouv.appli.frontserver.key=${APPLI_FRONT_KEY}
