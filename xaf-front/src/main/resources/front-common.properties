mc.gouv.appfactory.cookies.particulier.url.en=https://monservicepublic.gouv.mc/en/cookies-teleservices
mc.gouv.appfactory.cookies.entreprise.url.fr=https://monentreprise.gouv.mc/cookies-teleservices
mc.gouv.appfactory.cookies.entreprise.url.en=https://monentreprise.gouv.mc/en/cookies-teleservices
mc.gouv.appfactory.mconnect.help.url.fr=https://mconnect.gouv.mc/aide
