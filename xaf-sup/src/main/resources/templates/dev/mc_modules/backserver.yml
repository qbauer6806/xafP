---
appli: ${tscode}
type: backserver
name: ${tscode}-backserver
maven:
    group_id: mc.gouv.${tscode}
    artifact_id: ${tscode}-backserver
context: /${tscode}
url: https://${tscode}-back-dev.monaco-gouvernement.mc/${tscode}
http_port: 10${TSPORT}0
jmx_port: 10${TSPORT}1
rmi_port: 10${TSPORT}2
xms: ${XMS}
xmx: ${XMX}
tags:
    - ${tscode}backapi
java_extra_opts: -Dspring.profiles.active=gouv -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/var/tmp/heap-dump/${tscode}-backserver/

