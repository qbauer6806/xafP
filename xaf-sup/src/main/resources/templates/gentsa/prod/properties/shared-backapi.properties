{{ ansible_managed | comment }}

# Base de données PostgreSQL
############################################################################################################################################################
${TSCODE}-CONN=${TSCODE}
${TSCODE}-CLASS=org.postgresql.Driver
${TSCODE}-URL=jdbc:postgresql://gentsa-eosd-0.monaco-gouvernement.mc:5432/${tscode}
${TSCODE}-USER=${tscode}
${TSCODE}-PASS=${TSPGPWD}
${TSCODE}-MAX_ACTIVE=10

# 
############################################################################################################################################################
mc.gouv.${tscode}.backserver.processDefinitionKey=process

# TOKENS JWT
############################################################################################################################################################
#createJWTToken("<mail-api.jwt.secret>", "${TSCODE}", new String[] { "USER"}, "MAIL", null,null);
mc.gouv.${tscode}.backserver.mail.jwt=${TSMAILJWT}
#createJWTToken("<file-api.jwt.secret>", "${TSCODE}", new String[] { "USER"}, "FILE", null,null);
mc.gouv.${tscode}.backserver.file.jwt=${TSFILEJWT}
# Clé partagée avec le front pour le calcul du sig
mc.gouv.${tscode}.backserver.front.key=${TSFRONTKEY}


# URLs (liens directs ou rédirection)
############################################################################################################################################################
##NORMALEMENT CES PROPRIETES DEVRAIENT ETRE DANS ${tscode}-backserver.properties
##Le problème est que GouvPropertiesResolver est partagé aujourd'hui entre l'API et le Back
# URL de redirection vers le front pour la création des demandes en tant qu'usager courrier
mc.gouv.${tscode}.backserver.front.url=https://teleservice.gouv.mc/${tscontexte}/
mc.gouv.${tscode}.backserver.front.formstartpage=${BACKSRVFRNTFORMSTPAGE}
# Page de Back-Office
mc.gouv.${tscode}.backserver.back.url=https://${tscode}-back.monaco-gouvernement.mc/${tscode}/
# Page d'aide
mc.gouv.${tscode}.backserver.help.url=https://intragouv.monaco-gouvernement.mc
#url du support
mc.gouv.af.back.contactSupport.url=http://sos/glpi/

# Configuration Hibernate
############################################################################################################################################################
${tscode}.override.spring.jpa.properties.hibernate.default_schema=${TSCODE}
mc.gouv.${tscode}.backserver.usagerscache.duration=60000


# Conifuration Elastic Search
############################################################################################################################################################
mc.gouv.${tscode}.elasticsearch.clustername={{elasticsearch_cluster_name}}
mc.gouv.${tscode}.elasticsearch.clusterHosts=gentsa-eose1-0,gentsa-eose2-0,gentsa-eose3-0
## Voir si la notation gentsa-eose[1-3]-1
mc.gouv.${tscode}.elasticsearch.port=9200
mc.gouv.${tscode}.elasticsearch.reindex.bulksize=100
mc.gouv.${tscode}.elasticsearch.user=${tscode}
mc.gouv.${tscode}.elasticsearch.password=${TSESPWD}
mc.gouv.${tscode}.elasticsearch.connectTimeout=90000
mc.gouv.${tscode}.elasticsearch.socketTimeout=90000

# URL APIs et SERVICES EXTERNES
############################################################################################################################################################
#Utiliser par af pour sauvegarder tous les appels à file
mc.gouv.af.back.file.url=http://linuxas-1.monaco-gouvernement.mc:30490/file/api/v1/file
mc.gouv.af.back.mail.url=http://linuxas-1.monaco-gouvernement.mc:30480/mail/api/v1/mail
# Service REST
mc.gouv.demarches.external.filews.file.url=http://linuxas-1.monaco-gouvernement.mc:30490/file/api/v1/file
mc.gouv.demarches.external.usagers.url=http://linuxas-2.monaco-gouvernement.mc:20110/servicerest/rest/usagers
mc.gouv.demarches.external.pays.url=http://linuxas-2.monaco-gouvernement.mc:20110/servicerest/rest/pays

# Container utilisé pour l'appel à FILE
############################################################################################################################################################
mc.gouv.${tscode}.backserver.file.containerId=ROOT
mc.gouv.demarches.containerId=ROOT
