# Voir la description dans les fichiers templates "src\main\resources\templates\generic\${tscode}-dev"

# code du téléservice en lowercase
tscode=[tscode à renseigner]

# code du téléservice en uppercase
TSCODE=[TSCODE à renseigner]

#Deux premiers chiffre du port du téléservice (ex. 79 pour 790)
TSPORT=[TSPORT à renseigner]

# Contexte du téléservice sans le slash (ex. derogation-pause-femme)
TSCONTEXTE=[TSCONTEXTE à renseigner]

# Code du tracking piwik back
TSPWKB=[TSPWKB à renseigner]

# Code du tracking piwik front
TSPWKF=[TSPWKF à renseigner]

# Token JWT File
TSFILEJWT=[TSFILEJWT à renseigner]

# Token JWT Mail
TSMAILJWT=[TSFILEJWT à renseigner]

# Secret pour les Token JWT Api
TSAPISECRET=[TSFILEJWT à renseigner]

# Token JWT Api pour le front
TSAPIJWT=[TSFILEJWT à renseigner]

# Password postgres
TSPGPWD=[TSPGPWD sera fourni par le DBA]

# Clef partagé entre le front et le back
TSFRONTKEY=[TSFRONTKEY à renseigner]
